# trellis-watchtower: the local monitoring stack (docs/SPEC.md, W1 + W2).
#
# Rules this file keeps (SPEC "Rules the implementation must keep"):
# - Every published port binds 127.0.0.1, in the block 4390-4394.
# - Every image is an upstream image pinned by digest. Nothing is built here,
#   so no image tag of ours can collide with another project's.
# - It never touches another project's containers. Docker is read through a
#   GET-only socket proxy on an internal network that only Alloy shares.
# - The :4310 stack's internal network (tpa-net) is NOT joined by default.
#   compose.tpa-net.yml is a manual opt-in; read the warning at its top.
#
# Profiles: `db` adds the two postgres exporters (needs the DSNs in .env);
# `test` adds tw-stub for `make stub-test`.

name: trellis-watchtower

networks:
  tw-net:
    driver: bridge
  # Only the socket proxy and Alloy. `internal` means no route out, and no
  # other tw-* container can reach the proxy (container inspect shows other
  # containers' environment, so the proxy is not on tw-net).
  tw-docker:
    driver: bridge
    internal: true

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
  # Empty on purpose. Mounted where the tpa-net probe targets would be, so
  # without the overlay those three targets do not exist (not "down").
  # compose.tpa-net.yml replaces this mount with ./prometheus/tpa-net.
  tpa-net-targets-off:

services:
  grafana:
    image: grafana/grafana:12.4.11@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
    container_name: tw-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:4390:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      FLY_ORG: ${FLY_ORG:-}
      FLY_PROM_TOKEN: ${FLY_PROM_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [tw-net]
    depends_on: [prometheus, loki]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: tw-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:4391:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - tpa-net-targets-off:/etc/prometheus/tpa-net:ro
    networks: [tw-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  blackbox:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: tw-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    networks: [tw-net]
    # Host processes (network, forge, enroll, feed-ingest) and the published
    # tpa ports bind 127.0.0.1 on the Mac; Docker Desktop forwards
    # host.docker.internal to the host's loopback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: tw-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:4392:3100"
    volumes:
      - loki-data:/loki
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks: [tw-net]
    # No healthcheck: the image has no shell or HTTP client.

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: tw-socket-proxy
    restart: unless-stopped
    environment:
      # GET only. CONTAINERS covers list, inspect and logs. NETWORKS is needed
      # because Docker service discovery lists networks; PING and VERSION are
      # the client's API negotiation. Everything else, POST included, is off.
      CONTAINERS: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
      POST: 0
      EVENTS: 0
      INFO: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      SECRETS: 0
      AUTH: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      SESSION: 0
      GRPC: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
      ALLOW_PAUSE: 0
      ALLOW_UNPAUSE: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [tw-docker]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: tw-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    ports:
      - "127.0.0.1:4393:12345"
    volumes:
      - alloy-data:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # The scrub test's replay directory (scripts/scrub_check.sh).
      - ./.fixtures-run:/fixtures-run:ro
    networks: [tw-net, tw-docker]
    depends_on: [loki, socket-proxy]
    # No healthcheck: the image has no HTTP client.

  # ---- profile db: one exporter per database, so pg_up is per database ----
  postgres-exporter-network:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: tw-postgres-exporter-network
    profiles: [db]
    restart: unless-stopped
    command: ["--no-collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: ${PG_DSN_NETWORK:-}
    networks: [tw-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres-exporter-forge:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: tw-postgres-exporter-forge
    profiles: [db]
    restart: unless-stopped
    command: ["--no-collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: ${PG_DSN_FORGE:-}
    networks: [tw-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- profile test: a static health body for the negative probe test ----
  stub:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    container_name: tw-stub
    profiles: [test]
    command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
    volumes:
      - ./tests/stub:/www:ro
    networks: [tw-net]
