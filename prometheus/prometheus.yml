# Local Prometheus. No Alertmanager: local alerts are visual (Prometheus
# /alerts and Grafana's data-source-managed rules).
#
# Label contract (docs/SPEC.md "Naming rules"): blackbox series carry
# job="blackbox", stack, service, probe; postgres series carry job="postgres"
# and db. The target files set stack/service/probe and the module.

global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
          # Empty unless compose.tpa-net.yml is in use (manual opt-in).
          - /etc/prometheus/tpa-net/*.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: tw-blackbox:9115

  # Profile `db` only. Without it these two targets read up=0; no alert
  # depends on `up` for them, only on pg_up.
  - job_name: postgres
    static_configs:
      - targets: ["tw-postgres-exporter-network:9187"]
        labels:
          db: network
      - targets: ["tw-postgres-exporter-forge:9187"]
        labels:
          db: forge
