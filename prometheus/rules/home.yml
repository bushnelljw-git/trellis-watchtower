# Generated by scripts/gen_home.py: edit that, not this file.
# Alerts on what Loki's ruler records (loki/rules/fake/home.yml), beside the probe alerts in local.yml.
# Visual only: no Alertmanager locally. Tested by tests/prometheus/rules_test.yml.
groups:
  - name: home-logs
    rules:
      - alert: AuthNotReady
        expr: "sum by (reason_code) (sum_over_time(tw:auth_not_ready:sum30s[2m])) > 0"
        for: 1m
        labels:
          severity: "page"
        annotations:
          summary: "auth is not ready ({{ $labels.reason_code }})"
          description: "auth's /ready refused with this reason in the last 2 minutes, for 1 minute (from its not_ready log lines, counted by Loki's ruler)."
      - alert: WorkerStale
        expr: "(label_replace((time() - max(max_over_time(tw:worker_ok_ms:max{service=\"connectors\"}[1h])) / 1000 or vector(3600)) > 120, \"service\", \"connectors\", \"\", \"\") or label_replace((time() - max(max_over_time(tw:worker_ok_ms:max{service=\"crm_transitions\"}[1h])) / 1000 or vector(3600)) > 180, \"service\", \"crm_transitions\", \"\", \"\") or label_replace((time() - max(max_over_time(tw:worker_ok_ms:max{service=\"outbox_dispatch\"}[1h])) / 1000 or vector(3600)) > 180, \"service\", \"outbox_dispatch\", \"\", \"\") or label_replace((time() - max(max_over_time(tw:worker_ok_ms:max{service=\"auth-publisher\"}[1h])) / 1000 or vector(3600)) > 150, \"service\", \"auth-publisher\", \"\", \"\") or label_replace((time() - max(max_over_time(tw:worker_ok_ms:max{service=\"auth-sweeper\"}[1h])) / 1000 or vector(3600)) > 900, \"service\", \"auth-sweeper\", \"\", \"\")) and on () (sum(sum_over_time(tw:loki_rules:heartbeat[1m])) > 0)"
        for: 1m
        labels:
          severity: "page"
        annotations:
          summary: "{{ $labels.service }} has not reported for {{ $value | humanizeDuration }}"
          description: "No INFO tick or summary line from this worker within its limit (the home page's red), for 1 minute. Quiet while Loki's rules are not arriving: the page says it cannot tell instead."
