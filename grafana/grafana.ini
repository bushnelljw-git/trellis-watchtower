# Grafana 12, local only. Published on 127.0.0.1:4390 (compose.yml), so the
# anonymous Viewer below is reachable from this Mac only. The admin password
# comes from .env (GF_SECURITY_ADMIN_PASSWORD, set by compose.yml).
# The home dashboard is set by the dashboards (W3), not here.

[server]
http_port = 3000
root_url = http://localhost:4390/

[security]
admin_user = admin
disable_gravatar = true
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/overview.json

[unified_alerting]
enabled = true

[log]
mode = console
level = warn

[paths]
provisioning = /etc/grafana/provisioning
