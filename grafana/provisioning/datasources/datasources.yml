# Datasource uids are part of the dashboards contract (docs/SPEC.md):
# prometheus, loki.

apiVersion: 1

deleteDatasources:
  - name: Tempo
    orgId: 1
  - name: Alertmanager
    orgId: 1
  # No Fly systems (owner, 2026-10-11): removes the old `fly` datasource from
  # a Grafana whose volume still holds it.
  - name: Fly Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://tw-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://tw-loki:3100
    editable: false
    jsonData:
      maxLines: 1000
