# Accepted exceptions to the vulnerability gate of this repository's cloud
# images, the monitoring website's Grafana (cloud/, D-145) and the synthetic
# journeys (synthetics/), which tpa-platform's shared image builder builds and
# signs with this repository's own key (image-signing/trellis-watchtower). The
# builder reads THIS file, at the image's own commit, never another
# repository's. The synthetics image (python:3.12-slim by tpa-platform's
# digest, plus cryptography) needs the base's openssl and glibc entries below,
# the same ids, packages, reasons and expiries as records-service's file on the
# same base; its zlib finding is fixed in synthetics/Dockerfile, not excepted
# (the deploy session's build of 093aff85, 2026-11-13).
#
# The builder's policy step fails an image, and nothing is signed or tagged,
# when Container Analysis reports a finding whose effectiveSeverity is
# CRITICAL, or HIGH with a fix available, or missing or unknown. An entry here
# excepts one finding in one package, until its expiry date. Nothing else is
# excepted, and MEDIUM and below never fail the gate.
#
# The format is the builder's strict subset of YAML (tpa-platform's
# cloudbuild/pipeline.py, read_exceptions): printable ASCII only, no quotes,
# anchors, aliases, tags, flow style, block scalars or trailing comments; each
# entry exactly these four keys, once each, "- " starting it and two spaces
# indenting the rest:
#
#   - id: CVE-2026-12345
#     package: openssl
#     reason: Why the image is not exposed, in one line.
#     expires: 2026-12-31
#
# The id and the package must both match the finding exactly. An entry past
# its expiry date fails the builder's exceptions step. At most 50 entries. A
# list with no entries is written [] alone on its line, as below. Every change
# here is a reviewed commit, like the image it excepts.
#
# The entries below: the two fixable HIGH findings Container Scanning reports in the image, by its own package
# names, and nothing else; no CRITICAL is ever excepted. Both are Tempo's, matched by version though the code Grafana
# compiles in already has each fix (each entry says how that was checked). Its scan of trellis-watchtower
# 3f7fc36 (tpa-platform's build 4122c0b2, 2026-10-12) also reported Go 1.26.6's standard library (package go: two
# CRITICAL, eight fixable HIGH, five with no severity) in Grafana's binaries and zlib 1.3.2-r0 (CVE-2026-85091, HIGH).
# cloud/Dockerfile fixes both rather than excepting them: Grafana's three Go binaries are rebuilt from the v12.4.12
# source with Go 1.26.9, and zlib is 1.3.2-r1. The earlier entries under trivy's names (stdlib, golang.org/x/net) are
# gone: Container Scanning names Go's standard library go, and reported nothing in golang.org/x/net. Its scan of
# fe9302a (tpa-platform's build b5453d1f, 2026-10-24) also reported github.com/getkin/kin-openapi v0.147.0 in grafana
# (CVE-2026-100352, -100353 and -100354, HIGH), musl 1.2.6-r2 (CVE-2026-107891) and brotli 1.2.0-r1 (CVE-2026-111497),
# the last two with no severity yet. cloud/Dockerfile fixes those too: kin-openapi v0.149.0, musl 1.2.6-r3, brotli
# 1.2.1-r0. Its scan of f6f79cb (build ef0194fb, 2026-10-29, Grafana 12.4.12) reported curl in Alpine 3.24.2 (24
# findings, fixed in 8.23.0-r0) and go-jose v4 v4.1.4 in Grafana's binaries (HIGH, fixed in v4.1.6); the image now has
# Grafana 12.4.14 (Alpine 3.24.3, curl 8.23.0-r0) and rebuilds the binaries with go-jose v4.1.6. Production window 48
# (2026-11-21) found four HIGH openssl findings in it at the base's Alpine 3.5.9-r0; cloud/Dockerfile now raises libssl3
# and libcrypto3 to 3.5.9-r1, which fixes the five O272 openssl ids below (Alpine's secdb), so those five stay for the
# synthetics image's Debian base only. The three O355 openssl ids (OpenSSL's Low advisories of 2026-11-17) are fixed
# in neither base yet and cover both images. Of the Grafana image's own findings, only the two Tempo entries remain.
- id: CVE-2026-21728
  package: github.com/grafana/tempo
  reason: Matched by version alone, already fixed in the code. Grafana 12.4.14's go.mod (12.4.12's, 12.4.13's and 13.3.0's too) pins Tempo at main commit 525d1bab07e0 of 2026-04-27 (v1.5.1-0.20260427112133-525d1bab07e0), which contains the fix, commit 650eb198 (grafana/tempo#6525, 2026-02-20), as GitHub's compare of the two shows; the scanner compares the pseudo-version v1.5.1 with the fixed 2.8.4, 2.9.2 and 2.10.2. The library serves only the Tempo datasource, which this image never provisions and viewers cannot add; the website is behind IAP, read-only, with no internet egress. Re-checked 2026-10-29 against Grafana 12.4.14 and 13.3.0, unchanged. Ruled by delegation by the orchestrator, session bodyfirst-a9, 2026-10-11; renewed under Container Scanning's package name 2026-10-12. Re-checked 2026-11-12 against 12.4.15 and 13.3.1, unchanged; renewed to 2026-12-12 on the owner's standing word of 2026-11-12.
  expires: 2026-12-12
