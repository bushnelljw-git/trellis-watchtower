# Accepted exceptions to the vulnerability gate of this repository's cloud
# images, the monitoring website's Grafana (cloud/, D-145) and the synthetic
# journeys (synthetics/), which tpa-platform's shared image builder builds and
# signs with this repository's own key (image-signing/trellis-watchtower). The
# builder reads THIS file, at the image's own commit, never another
# repository's. The synthetics image (python:3.12-slim by tpa-platform's
# digest, standard library only) needs no entry: tpa-platform's images on the
# same base pass with none.
#
# The builder's policy step fails an image, and nothing is signed or tagged,
# when Container Analysis reports a finding whose effectiveSeverity is
# CRITICAL, or HIGH with a fix available, or missing or unknown. An entry here
# excepts one finding in one package, until its expiry date. Nothing else is
# excepted, and MEDIUM and below never fail the gate.
#
# The format is the builder's strict subset of YAML (tpa-platform's
# cloudbuild/pipeline.py, read_exceptions): printable ASCII only, no quotes,
# anchors, aliases, tags, flow style, block scalars or trailing comments; each
# entry exactly these four keys, once each, "- " starting it and two spaces
# indenting the rest:
#
#   - id: CVE-2026-12345
#     package: openssl
#     reason: Why the image is not exposed, in one line.
#     expires: 2026-12-31
#
# The id and the package must both match the finding exactly. An entry past
# its expiry date fails the builder's exceptions step. At most 50 entries. A
# list with no entries is written [] alone on its line, as below. Every change
# here is a reviewed commit, like the image it excepts.
#
# The entries below: the two fixable HIGH findings Container Scanning reports in the image, by its own package
# names, and nothing else; no CRITICAL is ever excepted. Both are Tempo's, matched by version though the code Grafana
# compiles in already has each fix (each entry says how that was checked). Its scan of trellis-watchtower
# 3f7fc36 (tpa-platform's build 4122c0b2, 2026-10-12) also reported Go 1.26.6's standard library (package go: two
# CRITICAL, eight fixable HIGH, five with no severity) in Grafana's binaries and zlib 1.3.2-r0 (CVE-2026-85091, HIGH).
# cloud/Dockerfile fixes both rather than excepting them: Grafana's three Go binaries are rebuilt from the v12.4.12
# source with Go 1.26.9, and zlib is 1.3.2-r1. The earlier entries under trivy's names (stdlib, golang.org/x/net) are
# gone: Container Scanning names Go's standard library go, and reported nothing in golang.org/x/net.
- id: CVE-2026-21728
  package: github.com/grafana/tempo
  reason: Matched by version alone, already fixed in the code. Grafana 12.4.12's go.mod pins Tempo at main commit 525d1bab07e0 of 2026-04-27 (v1.5.1-0.20260427112133-525d1bab07e0), which contains the fix, commit 650eb198 (grafana/tempo#6525, 2026-02-20), as GitHub's compare of the two shows; the scanner compares the pseudo-version v1.5.1 with the fixed 2.8.4, 2.9.2 and 2.10.2. The library serves only the Tempo datasource, which this image never provisions and viewers cannot add; the website is behind IAP, read-only, with no internet egress. Re-check on the next Grafana release. Ruled by delegation by the orchestrator, session bodyfirst-a9, 2026-10-11; renewed under Container Scanning's package name 2026-10-12.
  expires: 2026-11-10
- id: CVE-2026-28377
  package: github.com/grafana/tempo
  reason: Matched by version alone, already fixed in the code. Grafana 12.4.12's go.mod pins Tempo at main commit 525d1bab07e0 of 2026-04-27 (v1.5.1-0.20260427112133-525d1bab07e0), which contains the fix, commit bb8ca663 (grafana/tempo#6711, 2026-03-17), as GitHub's compare of the two shows; the scanner compares the pseudo-version v1.5.1 with the fixed 2.10.3. The library serves only the Tempo datasource, which this image never provisions and viewers cannot add; the website is behind IAP, read-only, with no internet egress. Re-check on the next Grafana release. Ruled by delegation by the orchestrator, session bodyfirst-a9, 2026-10-11; renewed under Container Scanning's package name 2026-10-12.
  expires: 2026-11-10
