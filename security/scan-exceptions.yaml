- id: CVE-2026-107493
  package: openssl
  reason: OpenSSL rates it Low in its advisory of 2026-11-17 and no fixed openssl is yet in the python 3.12 slim base of watchtower-synthetics or in the Alpine libssl3 that the watchtower image's curl links (the fix is due with the 1 December 2026 release of OpenSSL); it affects only an application that passes its own stack to PEM_X509_INFO_read_bio_ex and reuses it after a failure, which neither image does (no code in this repository calls it); watchtower is Grafana, a Go program using Go's own TLS, serving plain HTTP on Cloud Run with internal-and-load-balancer ingress behind IAP, so TLS ends at Google's load balancer and never in the container, and the synthetic journeys run as Cloud Run jobs that serve nothing and call out as TLS clients only; the images already running carry an openssl with the same flaw, since no fixed one exists; the owner, 2026-11-17 (dec 8th is fine), ruling O355, as records-service carries it; remove this entry as soon as a fixed openssl is in the image.
  expires: 2026-12-08
