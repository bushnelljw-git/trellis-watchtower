# The monitoring catalogue, as data. Every environment root with services reads
# this one file (its main.tf, `yamldecode`) and hands each project's half to its
# `monitoring` module call, so beta and production cannot drift. The prose,
# the routing and the reasons are docs/infra/monitoring.md; the module is
# modules/monitoring.
#
# Rules this file keeps, refused at plan by the module and read back by
# tests/infra/test_monitoring_shape.py:
#
# - A metric lives in the project that RECEIVES the logs it counts: records,
#   connectors and the protected jobs in `phi`; auth, tpa-api, tpa-jobs,
#   model-gateway (D-70, 2026-09-27) and web in `app`; the CRM's engine in
#   `crm`; beta's call-centre services and job in `cc` (2026-10-11, read by
#   beta's callcentre.tf alone: production-full has no call-centre project).
#   Nothing crosses the perimeter. `beta_text_codes` (2026-10-13, D-158) is
#   beta's text sender's, read by beta's textcodes.tf alone into the
#   member-data project, and only while var.beta_text_codes_enabled is on.
# - A label is one of service, operation, gate, code, outcome, status_class,
#   job, lane, class, sqlstate, role, direction, site, and no extractor reads a
#   tenant, request, session, principal, member, row, address or URL field.
#   `role` (2026-10-24, the records limit; OD-4's (b)) is one of the twelve
#   staff role names, held to that list by its REGEXP_EXTRACT alternation;
#   `direction` is records' closed `raise` or `lower`.
# - Filters match on the formatters' own field names, which differ by repo:
#   this repository's lines carry `service`, `message`, `operation`, `reason`
#   and `exc.class` (tpa_common/logging.py); the gateway's carry `service`,
#   `message`, `op`, `gate`, `code` and `exc.{class,sqlstate}`
#   (records-service records/logging.py); the issuer's carry `logger`, `msg`,
#   `route`, `status`, `reason` and `error` (auth-notary auth/logging.py).
#   Every one writes its level as `level`, which Cloud Logging leaves in
#   jsonPayload rather than mapping to severity, so no filter here reads
#   `severity` for one of their lines. Two writers name `severity` itself,
#   which Cloud Logging does map: the Cloud SQL Auth Proxy sidecar
#   (`--structured-logs`) and call-center's services (services/privacy/
#   log_setup.py); only their filters read it.
# - A PromQL condition is alone in its policy (Google's rule).
# - `urgent: true` is the one routing fact. The module derives the policy's
#   channels, its severity (CRITICAL, else WARNING; PagerDuty reads it as
#   urgency) and its routing label from it, so they never disagree.
# - No condition copies a log line into a notification: every condition is a
#   threshold, an absence or PromQL over a counter or a distribution (never a
#   log-match condition), and no documentation names a label or a value with
#   Cloud Monitoring's ${...} variables.
# - `subject` (2026-10-13, the owner: "Arent all of these messages supposed to
#   be formatted better?") is the notification's subject line, which
#   PagerDuty titles the incident with: what is wrong, then which, plain. The
#   module writes "<environment> · " and, from `urgent`, "URGENT " in front;
#   without one the display name is the subject. "Which" names only a closed
#   label its own condition's series carry, as
#   ${metric_or_resource.label.KEY}, never a raw resource string such as a
#   database_id; at most 255 bytes once written in
#   (tests/infra/test_alert_subjects.py; docs/infra/monitoring.md §9a).

# Added to every project's own lists below.
shared:
  log_metrics:
    # D-147: a memory limit exceeded is `run_oom_kills`' (its own policy,
    # `run-oom`), so one kill opens one alert, not two.
    run_system_errors:
      description: >-
        Cloud Run's own system log at ERROR or above: a failed startup or
        liveness probe, a container that exited. A memory limit exceeded is
        `run_oom_kills`' alone. Written by the platform, not by a service, so
        it holds no application field.
      filter: |
        (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
        AND log_id("run.googleapis.com/varlog/system")
        AND severity>=ERROR
        AND NOT textPayload=~"^Memory limit of [0-9]+ MiB exceeded"

    # 2026-10-11 (the alert-gaps review): every database client here dials
    # through the Cloud SQL Auth Proxy sidecar (`--psc --auto-iam-authn
    # --structured-logs`, modules/run-service and run-job; auth through its
    # own connector), so Cloud Run's built-in Cloud SQL path, and the
    # connection_refused_count `canary-sql` used to read, is never used and
    # that count stays at zero. The proxy's own refusals are the signal.
    sql_proxy_errors:
      description: >-
        The Cloud SQL Auth Proxy sidecar's own lines at ERROR or above: it
        could not dial an instance or log in to it as the service's IAM user.
        Its structured line names its severity (`--structured-logs`), which
        Cloud Logging maps, and its message opens with the instance's
        connection name in brackets; only that shape is matched, and nothing
        of the line is extracted.
      filter: |
        (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
        AND severity>=ERROR
        AND jsonPayload.message=~"^[[][a-z][a-z0-9-]*:[a-z0-9-]+:[a-z][a-z0-9-]*[]] "

    # D-147 (the reliability signals, 2026-10-11; docs/infra/monitoring.md
    # §12). Every metric below reads a line the platform writes, never one of
    # ours, and no label but the method on the two audit counters.
    #
    # PostgreSQL's server log, which Cloud SQL writes as text to postgres.log:
    # on every start (a restart, a maintenance, a crash's recovery, an HA
    # failover's new primary) the server writes "database system is ready to
    # accept connections". Counted by the instance (the resource's
    # database_id); the module's per-instance `restarted` policy reads it.
    sql_restarts:
      description: >-
        A Cloud SQL instance's PostgreSQL server came up: its server log's
        "database system is ready to accept connections". By the instance
        (the resource's own database_id); nothing of the line is read.
      filter: |
        resource.type="cloudsql_database"
        AND log_id("cloudsql.googleapis.com/postgres.log")
        AND textPayload:"database system is ready to accept connections"

    # Every instance takes an automated backup each night (modules/cloud-sql,
    # backup_configuration.enabled, true by default and in every root). Cloud
    # SQL writes one system event audit entry per automated backup attempt
    # (`cloudaudit.googleapis.com/system_event`, methodName
    # `cloudsql.instances.automatedBackup`), and its outcome is the entry's
    # `protoPayload.metadata.windowStatus`, never its status: every entry read
    # on beta carries `status: {message: "OK"}`, no code, severity INFO,
    # failed or not (the review's read of all three projects, 2026-10-09 to
    # 2026-10-24: 63 `STATUS_SUCCEEDED` and four `STATUS_ATTEMPT_FAILED`, one
    # on each instance on 2026-10-09, which this counter, reading a status
    # code alone, never counted, so `<db>-backup-failed` never opened; TP-237).
    # Google's values (Cloud SQL's "View audit logs for automated backups",
    # last updated 2026-10-22): STATUS_SUCCEEDED; STATUS_ATTEMPT_FAILED (an
    # attempt that did not start or failed); STATUS_FAILED (no backup could be
    # made in the window, written after the failed attempts); STATUS_SKIPPED
    # (the instance stopped running since its last successful backup). Counted
    # as failures: STATUS_ATTEMPT_FAILED and STATUS_FAILED, each the final
    # word on what it names (an attempt, a window) and each one Google says to
    # act on; never STATUS_SKIPPED (a stopped instance: beta's B8 on purpose,
    # anything else `<db>-down`), and never a value Google has not listed. An
    # on-demand backup's or a restore's failure still counts by its status
    # code, wherever its entry lands.
    sql_backup_failures:
      description: >-
        A Cloud SQL backup or restore that failed: an automated backup's
        system event audit entry whose windowStatus is STATUS_ATTEMPT_FAILED
        or STATUS_FAILED, or any backup or restore operation's audit entry
        with a non-zero status code. By the instance; nothing of the entry is
        read.
      filter: |
        resource.type="cloudsql_database"
        AND protoPayload.serviceName="cloudsql.googleapis.com"
        AND (
          (protoPayload.methodName=~"[Bb]ackup" AND protoPayload.status.code>0)
          OR (log_id("cloudaudit.googleapis.com/system_event")
            AND protoPayload.methodName="cloudsql.instances.automatedBackup"
            AND (protoPayload.metadata.windowStatus="STATUS_ATTEMPT_FAILED"
              OR protoPayload.metadata.windowStatus="STATUS_FAILED"))
        )

    # D-173 (the owner, 2026-10-24: "Update the trellis-watchtower as a check
    # and it should be on all the main dashboards and we should have
    # alerting"): each automated backup that succeeded, by the instance,
    # counted positively by its windowStatus (above). The module's
    # per-instance `-backup-missing` opens when a backup window has closed
    # with none counted (modules/monitoring, main.tf). Its absence is the
    # signal, so a filter that matches nothing pages rather than passes.
    sql_automated_backups:
      description: >-
        A Cloud SQL automated backup that succeeded: Cloud SQL's system event
        audit entry for cloudsql.instances.automatedBackup whose windowStatus
        is STATUS_SUCCEEDED. By the instance (the resource's own database_id);
        nothing of the entry is read.
      filter: |
        resource.type="cloudsql_database"
        AND log_id("cloudaudit.googleapis.com/system_event")
        AND protoPayload.serviceName="cloudsql.googleapis.com"
        AND protoPayload.methodName="cloudsql.instances.automatedBackup"
        AND protoPayload.metadata.windowStatus="STATUS_SUCCEEDED"

    # Cloud Run's system log, by the service or job alone (the resource):
    # a container killed for exceeding its memory limit, and a container that
    # exited non-zero or was killed by a signal other than SIGTERM (15, which
    # Cloud Run sends at every scale-in and shutdown) and SIGKILL (9, which
    # follows a SIGTERM not answered within ten seconds at a scale-in, and an
    # out-of-memory kill, `run_oom_kills`' own).
    run_oom_kills:
      description: >-
        Cloud Run's system log: a container exceeded its memory limit and was
        killed. By the service or job; nothing of the line is read.
      filter: |
        (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
        AND log_id("run.googleapis.com/varlog/system")
        AND textPayload=~"^Memory limit of [0-9]+ MiB exceeded"

    run_crash_exits:
      description: >-
        Cloud Run's system log: a service's container exited with a non-zero
        code or was killed by a signal other than SIGTERM or SIGKILL. Never a
        job's (its failed execution is `jobs-failed`'s), never an exit(0), the
        SIGTERM of a scale-in, or the SIGKILL after it or of a memory kill.
        By the service; nothing of the line is read.
      filter: |
        resource.type="cloud_run_revision"
        AND log_id("run.googleapis.com/varlog/system")
        AND textPayload=~"^Container (called exit[(][1-9][0-9]*[)]|terminated on signal ([1-8]|1[0-46-9]|[2-9][0-9]))[.]"

    # The Admin Activity audit log (always on, free, copied to the vault):
    # a Secret Manager version disabled or destroyed, and a KMS key version
    # disabled or scheduled for destruction. Each breaks whatever reads it at
    # its next deploy or restart. By method alone, as `monitoring_changes`;
    # who and which stay in the entry. A method is matched by its last name,
    # since Secret Manager writes the full name and KMS may write the short.
    secret_version_changes:
      description: >-
        A Secret Manager version disabled or destroyed, or a secret deleted
        with every version (#202, tpa-siem's rule 100326), from the Admin
        Activity audit log. By method alone; the entry says who and which.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="secretmanager.googleapis.com"
        AND protoPayload.methodName=~"(^|[.])((Disable|Destroy)SecretVersion|DeleteSecret)$"
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    kms_version_changes:
      description: >-
        A Cloud KMS key version scheduled for destruction, or disabled (an
        update whose request sets the version's state to DISABLED), from the
        Admin Activity audit log. By method alone; the entry says who and
        which.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="cloudkms.googleapis.com"
        AND (protoPayload.methodName=~"(^|[.])DestroyCryptoKeyVersion$"
          OR (protoPayload.methodName=~"(^|[.])UpdateCryptoKeyVersion$"
            AND protoPayload.request.cryptoKeyVersion.state="DISABLED"))
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # #202 (T-5080, the decider, 2026-10-29: "If they are important or some
    # security risk or something I do want to know right away"; the review's
    # gaps R4, with tpa-siem's control-plane rules 100301 to 100350 folded in
    # as the one paging path). Each counts Admin Activity audit entries in the
    # project, which are always on, free and copied to the vault, by method
    # alone: who made the change and what it was stay in the entry, and no
    # principal, caller, resource or request field is ever extracted (the
    # module refuses them by name). A filter may read the principal's shape to
    # tier a change, never to drop one made by a person or an unknown
    # principal: Terraform is applied by a person on beta (no CI identity
    # applies it, TP-04), so an apply's changes cannot be told from a console
    # change by who made them, and they are told, as `p2` where applies make
    # them often (IAM, the network controls) and `p1` where they are rare
    # (keys, audit configs, logging, the IAP gate, a public service, an org
    # policy, a database export). docs/infra/monitoring.md §19c.
    #
    # Every method below is matched on success alone (`status.code` absent or
    # zero) but a service account key's, where a refused attempt is itself
    # the finding. Resource types: an audit entry's series lands on its
    # entry's type where Cloud Monitoring holds it (gcs_bucket,
    # cloud_run_revision, cloudsql_database, logging_sink,
    # network_security_policy), on audited_resource for the services that
    # use it (Secret Manager, read 2026-10-11), and on `global` for every
    # Logging-only type (a project, a service account, a firewall rule, a
    # crypto key: Google's "Mappings for Logging-only resources"); each policy
    # names every type its methods can land on. UNVERIFIED until the first
    # change after the apply: infra/README.md, "#202's security alerts".
    iam_policy_changes:
      description: >-
        An IAM policy set on any resource in this project (the project, a
        bucket, a secret, a key, a service account, a Cloud Run service, a
        backend's IAP, a database, the registry) or a custom role created,
        changed or deleted, from the Admin Activity audit log. By method
        alone; the entry says who, on what and which binding.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND (protoPayload.methodName=~"(?i)(^|[.])setiampolicy$"
          OR protoPayload.methodName="storage.setIamPermissions"
          OR protoPayload.methodName=~"^google[.]iam[.]admin[.]v1[.](CreateRole|UpdateRole|DeleteRole|UndeleteRole)$")
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    service_account_key_changes:
      description: >-
        A service account key created, uploaded or enabled, from the Admin
        Activity audit log, refused or not: no key exists anywhere in this
        estate (`iam.disableServiceAccountKeyCreation` and the managed
        constraint, infra/org), so any attempt is the finding. By method
        alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="iam.googleapis.com"
        AND protoPayload.methodName=~"^google[.]iam[.]admin[.]v1[.](CreateServiceAccountKey|UploadServiceAccountKey|EnableServiceAccountKey)$"
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    audit_config_changes:
      description: >-
        A policy set whose change touches an audit config (the Data Access
        logs turned on or off for a service), from the Admin Activity audit
        log. By method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.methodName=~"(?i)(^|[.])setiampolicy$"
        AND protoPayload.serviceData.policyDelta.auditConfigDeltas:*
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    logging_config_changes:
      description: >-
        This project's logging changed: a sink, an exclusion, a log bucket
        (its retention or lock among it), a log view or the project's logging
        settings created, changed or deleted, or a log's entries deleted
        (DeleteLog), from the Admin Activity audit log. By method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="logging.googleapis.com"
        AND protoPayload.methodName=~"^google[.]logging[.]v2[.](ConfigServiceV2[.](CreateSink|UpdateSink|DeleteSink|CreateExclusion|UpdateExclusion|DeleteExclusion|CreateBucket|CreateBucketAsync|UpdateBucket|UpdateBucketAsync|DeleteBucket|UndeleteBucket|CreateView|UpdateView|DeleteView|UpdateSettings|UpdateCmekSettings)|LoggingServiceV2[.]DeleteLog)$"
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    network_control_changes:
      description: >-
        A firewall rule, a network firewall policy or one of its rules, a
        Cloud Armor policy or one of its rules created, changed or deleted,
        or a backend's Cloud Armor policy set, from the Admin Activity audit
        log. By method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="compute.googleapis.com"
        AND protoPayload.methodName=~"^(v1|beta)[.]compute[.]((firewalls)[.](insert|patch|update|delete)|(securityPolicies)[.](insert|patch|delete|addRule|patchRule|removeRule)|(networkFirewallPolicies|regionNetworkFirewallPolicies)[.](insert|patch|delete|addRule|patchRule|removeRule|addAssociation|removeAssociation)|backendServices[.]setSecurityPolicy)$"
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    iap_setting_changes:
      description: >-
        The IAP gate changed: IAP's settings on a resource updated, or a
        backend service updated with IAP turned off, from the Admin Activity
        audit log. Who may pass IAP is an IAM policy (iam_policy_changes). By
        method alone. The portal's own backend, bes-web, is left out: it runs
        without IAP by design since OWNER-EMAIL-2 opened the portal, and every
        apply that touches it writes `iap { enabled = false }` again (36 such
        updates from 2026-10-29 to 2026-11-13, every match of this counter once
        D-340 made it count), which would page p1 on each deploy. The exclusion
        assumes portal_public_enabled; remove it where that switch is false.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND ((protoPayload.serviceName="iap.googleapis.com"
            AND protoPayload.methodName=~"(^|[.])UpdateIapSettings$")
          OR (protoPayload.serviceName="compute.googleapis.com"
            AND protoPayload.methodName=~"^(v1|beta)[.]compute[.]backendServices[.](patch|update)$"
            AND protoPayload.request.iap.enabled=false
            AND NOT protoPayload.resourceName=~"/backendServices/bes-web$"))
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # The four services whose allUsers invoker is the design's (bindings.json
    # rows 78 to 80, OWNER: 25; row 100, R148, svc-voice behind armor-voice)
    # are left out by name; any other service given allUsers or
    # allAuthenticatedUsers is counted, in the request's new policy or in
    # its recorded change, whichever shape Cloud Run writes.
    run_public_invokers:
      description: >-
        A Cloud Run service's or job's IAM policy set with allUsers or
        allAuthenticatedUsers in it, on any service but the four whose public
        invoker is the design's (web, auth, tpa-api, svc-voice), from the
        Admin Activity audit log. By method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="run.googleapis.com"
        AND protoPayload.methodName=~"[.](Services|Jobs)[.]SetIamPolicy$"
        AND (protoPayload.request.policy.bindings.members:"allUsers"
          OR protoPayload.request.policy.bindings.members:"allAuthenticatedUsers"
          OR protoPayload.serviceData.policyDelta.bindingDeltas.member:"allUsers"
          OR protoPayload.serviceData.policyDelta.bindingDeltas.member:"allAuthenticatedUsers")
        AND NOT protoPayload.resourceName=~"/services/(web|auth|tpa-api|svc-voice)$"
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # An organization's or a folder's policy is written in that resource's
    # own log, which no project's metric reads; a policy set on this project
    # (beta's POL-2, POL-4, POL-11, POL-14 and POL-15 pins) is in this one.
    org_policy_changes:
      description: >-
        An organization policy set, cleared or deleted on this project, from
        the Admin Activity audit log (the v1 and v2 APIs). By method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND (protoPayload.methodName=~"(^|[.])(SetOrgPolicy|ClearOrgPolicy)$"
          OR protoPayload.methodName=~"^google[.]cloud[.]orgpolicy[.]v[12][.]OrgPolicy[.](CreatePolicy|UpdatePolicy|DeletePolicy)$")
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # A database export or clone made by anyone but a service account: the
    # nightly export to the vault (`tpa-db-export`) runs as its own account
    # and is not counted; a person or an unknown principal is.
    sql_exports_by_hand:
      description: >-
        A Cloud SQL export or clone not made by a service account, from the
        Admin Activity audit log: a copy of a database leaving it by hand. By
        method alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.serviceName="cloudsql.googleapis.com"
        AND protoPayload.methodName=~"^cloudsql[.]instances[.](export|clone)$"
        AND NOT protoPayload.authenticationInfo.principalEmail=~"[.]gserviceaccount[.]com$"
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # The changes `iam_policy_changes` and `network_control_changes` count,
    # made by a service account of ours. On beta every Terraform apply is a
    # person's, and no workload of ours changes IAM or the network, so a
    # robot doing it is a misused identity or a stolen token. Google's own
    # service agents (gcp-sa-* and the Google APIs agent) are left out of
    # this one and counted by the two above.
    security_changes_by_robot:
      description: >-
        An IAM policy, a custom role, a firewall rule or policy, or a Cloud
        Armor policy changed by a service account that is not one of Google's
        own service agents, from the Admin Activity audit log. By method
        alone.
      filter: |
        log_id("cloudaudit.googleapis.com/activity")
        AND protoPayload.authenticationInfo.principalEmail=~"[.]gserviceaccount[.]com$"
        AND NOT protoPayload.authenticationInfo.principalEmail=~"@(gcp-sa-[a-z0-9-]+[.]iam|cloudservices)[.]gserviceaccount[.]com$"
        AND (protoPayload.methodName=~"(?i)(^|[.])setiampolicy$"
          OR protoPayload.methodName="storage.setIamPermissions"
          OR protoPayload.methodName=~"^google[.]iam[.]admin[.]v1[.](CreateRole|UpdateRole|DeleteRole|UndeleteRole)$"
          OR protoPayload.methodName=~"^(v1|beta)[.]compute[.](firewalls|securityPolicies|networkFirewallPolicies|regionNetworkFirewallPolicies)[.]"
          OR protoPayload.methodName=~"^(v1|beta)[.]compute[.]backendServices[.]setSecurityPolicy$")
        AND NOT protoPayload.status.code>0
      labels:
        operation: 'EXTRACT(protoPayload.methodName)'

    # R572 (the portal review's §5 item 7): Cloud Armor's own signals once the
    # portal and the CRM face the internet, in the project of each load
    # balancer (beta: both in the app project). Adaptive Protection writes one
    # entry per alert it raises (and its updates) on the policy's own resource,
    # with `alertId` beside the attack's confidence and size; nothing of it is
    # read but the entry's presence, and the policy is the resource's own label.
    # Google documents the entry's fields from its Enterprise examples; that
    # beta's Standard tier writes `alertId` too is read on its first live entry
    # (infra/README.md, "The openings' alerts").
    armor_adaptive_alerts:
      description: >-
        One per Cloud Armor Adaptive Protection alert or alert update: a layer-7
        attack it saw building against a backend behind one of this project's
        policies. Its presence alone; the policy is the resource's label.
      filter: |
        resource.type="network_security_policy"
        AND jsonPayload.alertId:*

    # The preconfigured attack rules' hits in the load balancer's request log,
    # by set (`class`: sqli, xss, lfi, rfi, rce, scannerdetection,
    # protocolattack, sessionfixation), read off the matched expression's id
    # (owasp-crs-v030301-id942100-sqli and the like; a repeated field, whose
    # first match is the label). Refused is the enforced outcome DENY; previewed
    # is what a preview rule would have done. Never the path, the query, the
    # address or the host: the load balancer's url map is the resource's label
    # (um-app holds both web hosts, um-crm the CRM's).
    armor_waf_refused:
      description: >-
        One per request a preconfigured attack rule refused (enforced, DENY),
        by its set (`class`). Nothing of the request is read.
      filter: |
        resource.type="http_load_balancer"
        AND jsonPayload.enforcedSecurityPolicy.outcome="DENY"
        AND jsonPayload.enforcedSecurityPolicy.preconfiguredExprIds:*
      labels:
        class: 'REGEXP_EXTRACT(jsonPayload.enforcedSecurityPolicy.preconfiguredExprIds, "-(sqli|xss|lfi|rfi|rce|scannerdetection|protocolattack|sessionfixation)$")'

    armor_waf_previewed:
      description: >-
        One per request a preconfigured attack rule in preview would have
        refused, by its set (`class`): the watch-only period's hits, beside
        scripts/armor_waf_readout.py. Nothing of the request is read.
      filter: |
        resource.type="http_load_balancer"
        AND jsonPayload.previewSecurityPolicy.outcome="DENY"
        AND jsonPayload.previewSecurityPolicy.preconfiguredExprIds:*
      labels:
        class: 'REGEXP_EXTRACT(jsonPayload.previewSecurityPolicy.preconfiguredExprIds, "-(sqli|xss|lfi|rfi|rce|scannerdetection|protocolattack|sessionfixation)$")'

  alert_policies:
    # #202 (T-5080): beta's live incidents of this were five to ten 5xx in
    # five minutes, a few page loads at beta's traffic, but one: so 20 or
    # more and above 2 percent over ten minutes, held ten. A full outage is
    # `backend-down`'s, `records-down`'s and `voice-down`'s (p1). The release
    # canary keeps its own bar (docs/pipeline.md §5.1).
    canary-5xx:
      display_name: "5xx above 2% of requests"
      tier: p2
      subject: "5xx above 2% of requests: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service answered 20 or more of its requests with a 5xx,
        and more than 2 percent of them, in every ten minutes for ten minutes.
        During a release: roll back (docs/pipeline.md §6). Otherwise read the
        service's ERROR lines. A service answering nothing but errors pages on
        its own (`backend-down`, `records-down`, `voice-down`).
      conditions:
        - name: "20 or more 5xx and above 2% over ten minutes, for ten minutes"
          promql:
            query: >-
              sum by (service_name) (rate(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", response_code_class="5xx"}[10m]))
              > 0.02 * sum by (service_name) (rate(run_googleapis_com:request_count{monitored_resource="cloud_run_revision"}[10m]))
              and sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", response_code_class="5xx"}[10m])) >= 20
            duration: "600s"
            evaluation_interval: "60s"

    canary-latency:
      display_name: "p95 latency above 2 s"
      tier: p3
      subject: "p95 above 2 s: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service's 95th percentile request latency stayed above two
        seconds for ten minutes. The canary compares a new revision with the
        old one (1.5 times its p95); this standing policy is the absolute
        floor. Check the database first, then the hop to records.
      conditions:
        - name: "p95 above 2000 ms for ten minutes"
          promql:
            query: >-
              histogram_quantile(0.95, sum by (service_name, le) (rate(run_googleapis_com:request_latencies_bucket{monitored_resource="cloud_run_revision"}[5m]))) > 2000
            duration: "600s"
            evaluation_interval: "60s"

    canary-startup:
      display_name: "container startup or runtime failure"
      tier: p2
      subject: "container failing to start or run: ${metric_or_resource.label.service_name}${metric_or_resource.label.job_name}"
      # #202 (T-5080): a service's alone, three lines in fifteen minutes. One
      # failed probe at a deploy or a cold start opened it in three projects
      # (12 of its 17 live incidents were one every-minute job on 10-15); a
      # job's failure is `jobs-failed`'s (twice in a row), and a service down
      # for good is `no_instance`'s and `run-crash-loop`'s.
      documentation: >-
        Cloud Run's system log reported three or more failed probes or exits
        of one service in fifteen minutes (a memory limit exceeded is
        `run-oom`'s). A startup probe failure means `/ready` did not answer
        within its budget; read the revision's own lines for its `not_ready`
        reason.
      conditions:
        - name: "three or more of a service's system log lines at ERROR in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_system_errors" AND resource.type = "cloud_run_revision"
            threshold_value: 2
            alignment_period: "900s"
            group_by_fields: ["resource.label.service_name"]

    # In every project with a database client (2026-10-11): it replaces the
    # app and PHI projects' `canary-sql`, whose Cloud Run Cloud SQL count could
    # never fire. A database that is down is also its own urgent policy
    # (`<instance>-down`, per project below).
    canary-sql:
      display_name: "database connection errors"
      tier: p2
      subject: "database connection refused: ${metric_or_resource.label.service_name}${metric_or_resource.label.job_name}"
      documentation: >-
        The Cloud SQL Auth Proxy beside a service or a job could not reach its
        database or log in to it. The canary's "Cloud SQL connection errors:
        zero" (docs/pipeline.md §5.1). Check the instance (its own
        `<instance>-down` policy), then its Private Service Connect endpoint
        and the network's 3307 rule, then the IAM login.
      # #202: five refusals in every ten minutes for ten, so a refresh or a
      # maintenance blip opens nothing; a database down is its own p1.
      conditions:
        - name: "the proxy beside a service refused five connections in ten minutes, for ten"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sql_proxy_errors" AND resource.type = "cloud_run_revision"
            threshold_value: 4
            duration: "600s"
            alignment_period: "600s"
            group_by_fields: ["resource.label.service_name"]
        - name: "the proxy beside a job refused five connections in ten minutes, for ten"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sql_proxy_errors" AND resource.type = "cloud_run_job"
            threshold_value: 4
            duration: "600s"
            alignment_period: "600s"
            group_by_fields: ["resource.label.job_name"]

    # -------------------------------------------------------------------------
    # D-147 (the owner, 2026-10-11: "We need a solid system covering ALL
    # critical reliability checks"; docs/infra/monitoring.md §12). Saturation
    # and platform signals, in every project. A signal on a resource a project
    # does not have (a NAT gateway, an external load balancer) has no series
    # and never opens. Each threshold and duration is chosen to open on
    # sustained trouble, never a blip (the owner: "fix the alerts so i don't
    # keep getting alerts for no reason"); §12 gives each one's reason.
    # -------------------------------------------------------------------------

    run-cpu-high:
      display_name: "a Cloud Run service's CPU above 90% for 15 minutes"
      tier: p3
      subject: "CPU above 90%: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service's 99th percentile container CPU stayed above 90
        percent for fifteen minutes: its instances are saturated, so requests
        queue and slow down. Autoscaling should add instances; if it has not,
        read the service's instance count against its ceiling (the
        `ceiling-` and `run-instances-near-quota` policies), then what is
        running hot (a loop, an embedding storm, a stuck stream).
      conditions:
        - name: "p99 container CPU above 0.9 for fifteen minutes"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/container/cpu/utilizations" AND resource.type = "cloud_run_revision"
            threshold_value: 0.9
            duration: "900s"
            alignment_period: "300s"
            per_series_aligner: "ALIGN_PERCENTILE_99"
            cross_series_reducer: "REDUCE_MAX"
            group_by_fields: ["resource.label.service_name"]

    run-memory-high:
      display_name: "a Cloud Run service's memory above 90% for 30 minutes"
      tier: p2
      subject: "memory above 90%: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service's 99th percentile container memory stayed above
        90 percent of its limit for thirty minutes: the next allocation may kill
        the container (`run-oom`). Read whether it is growing (a leak) or
        steady (the limit is too small for the work), then raise the
        service's memory in Terraform or fix the leak.
      conditions:
        # #202: held thirty minutes (a service that sits near its limit
        # stayed open; `run-oom` tells a kill).
        - name: "p99 container memory above 0.9 for thirty minutes"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/container/memory/utilizations" AND resource.type = "cloud_run_revision"
            threshold_value: 0.9
            duration: "1800s"
            alignment_period: "300s"
            per_series_aligner: "ALIGN_PERCENTILE_99"
            cross_series_reducer: "REDUCE_MAX"
            group_by_fields: ["resource.label.service_name"]

    # Every service runs at Cloud Run's default concurrency of 80 but
    # svc-voice (40 since R5142: a call's socket and its callbacks; this
    # never opens for it: the call-centre project's voice-concurrency-high
    # does, at 32), file-reader (1, D-154) and beta's model-gateway (2 since
    # D-249, for two plan designs' memory). This never opens for those two
    # either: theirs is memory (run-memory-high, run-oom), and a full instance
    # starts another up to the service's own ceiling (the module's
    # ceiling-file-reader and ceiling-model-gateway, from instance_ceilings).
    run-concurrency-high:
      display_name: "a Cloud Run service's instances near their request concurrency"
      tier: p3
      subject: "near its request concurrency: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service's 99th percentile of the most requests one
        instance served at once stayed at 72 or more (90 percent of the
        default concurrency of 80) for fifteen minutes: new requests wait for
        a slot or a new instance. On web (ops-web where it is built) and
        tpa-api the desk's event streams hold one slot each for about 40 s. Read the instance count against
        its ceiling, then the request mix.
      conditions:
        - name: "p99 of per-instance peak concurrency at 72 or more for fifteen minutes"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/container/max_request_concurrencies" AND resource.type = "cloud_run_revision"
            threshold_value: 71.5
            duration: "900s"
            alignment_period: "300s"
            per_series_aligner: "ALIGN_PERCENTILE_99"
            cross_series_reducer: "REDUCE_MAX"
            group_by_fields: ["resource.label.service_name"]

    # The project's regional instance quota is 85 (beta's, read by the
    # orchestrating session, 2026-10-11); production-full keeps the same bar
    # until its own quota is read. 68 is 80 percent of it.
    run-instances-near-quota:
      display_name: "the project's Cloud Run instances near the regional quota (85)"
      tier: p2
      documentation: >-
        Every Cloud Run instance in this project, summed, stayed above 68 (80
        percent of the regional quota of 85) for ten minutes. At the quota a
        service cannot start another instance, whatever its own ceiling, and
        a warm service cannot replace one that died. Read which service is
        growing (the console's instance count by service), then ask Google
        for a higher quota or lower a ceiling.
      conditions:
        - name: "more than 68 instances in the project for ten minutes"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/container/instance_count" AND resource.type = "cloud_run_revision"
            threshold_value: 68
            duration: "600s"
            alignment_period: "60s"
            per_series_aligner: "ALIGN_MAX"
            cross_series_reducer: "REDUCE_SUM"

    run-oom:
      display_name: "a container was killed for exceeding its memory limit"
      tier: p2
      subject: "killed for memory: ${metric_or_resource.label.service_name}${metric_or_resource.label.job_name}"
      documentation: >-
        Cloud Run killed a container that exceeded its memory limit (its
        system log's "Memory limit of ... exceeded"). The request it was
        serving failed; a job's attempt failed. Read the service's or job's
        memory over the hour (`run-memory-high` may be open beside it), then
        raise its memory in Terraform or find what grew.
      conditions:
        - name: "a service's container exceeded its memory limit"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_oom_kills" AND resource.type = "cloud_run_revision"
            group_by_fields: ["resource.label.service_name"]
        - name: "a job's container exceeded its memory limit"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_oom_kills" AND resource.type = "cloud_run_job"
            group_by_fields: ["resource.label.job_name"]

    run-crash-loop:
      display_name: "a Cloud Run service's containers keep crashing"
      tier: p2
      subject: "containers crashing: ${metric_or_resource.label.service_name}"
      documentation: >-
        A Cloud Run service's containers exited non-zero, or were killed by a
        signal other than a shutdown's, three times or more in fifteen
        minutes: a crash loop. A warm service may also open `no_instance`, and
        one answering only errors `backend-down`. Read the service's system
        log and its own last lines before each exit; a revision that never
        became ready says why in its `not_ready` line.
      conditions:
        - name: "three exits or more in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_crash_exits" AND resource.type = "cloud_run_revision"
            threshold_value: 2
            alignment_period: "900s"
            group_by_fields: ["resource.label.service_name"]

    # The external Application Load Balancer's 5xx that no backend answered
    # (beta: app, the CRM's copy, the call centre, the monitoring website):
    # its own 502 and 503 when it cannot reach the Cloud Run service behind a
    # URL map, which no Cloud Run count sees. Its count of every 5xx it
    # answered less the 5xx its named backends answered; the backends' own
    # are Cloud Run's already (`canary-5xx`, `backend-down`), so a second page
    # for them would be noise. Both sides read the 5xx class alone, so the
    # load balancer's own 3xx and 4xx (IAP's redirects, Cloud Armor's 403, 404
    # and 429, a host it does not serve) never count (`armor-deny-spike` is
    # Armor's). Read on live beta, 2026-10-11 (7 days, read-only):
    # backend_request_count reports each serverless NEG backend by name
    # (bes-web, bes-web-ops, bes-crm-web, bes-crm-api; bes-voice) beside a
    # series with an empty backend_target_name, the requests no backend
    # answered (app: at most 1,184 in ten minutes; call centre: 320), which
    # `backend_target_name!=""` keeps out of the subtraction. A backend's 5xx
    # series has points only in a window with a backend 5xx, so the second
    # branch reads a window with none: then every 5xx is the load balancer's.
    edge-5xx:
      display_name: "a load balancer answered 5xx no backend sent"
      tier: p2
      subject: "load balancer 5xx no backend sent: ${metric_or_resource.label.url_map_name}"
      documentation: >-
        An external load balancer (by its URL map: um-app, um-crm, um-cc,
        um-watch) answered five or more 5xx in ten minutes that no backend
        sent: it could not reach the Cloud Run service behind it (the service
        or its serverless NEG missing or refusing, a revision with no
        instance), so people saw a 502 or 503 that no service logged. Read
        the load balancer's request log for the status details, then the
        backend service and its Cloud Run service. The backends' own 5xx are
        `canary-5xx` and `backend-down`.
      conditions:
        - name: "five or more load-balancer 5xx no backend sent, in ten minutes"
          promql:
            query: >-
              sum by (url_map_name) (increase(loadbalancing_googleapis_com:https_request_count{monitored_resource="https_lb_rule", response_code_class="500"}[10m]))
              - sum by (url_map_name) (increase(loadbalancing_googleapis_com:https_backend_request_count{monitored_resource="https_lb_rule", backend_target_name!="", response_code_class="500"}[10m])) >= 5
              or (sum by (url_map_name) (increase(loadbalancing_googleapis_com:https_request_count{monitored_resource="https_lb_rule", response_code_class="500"}[10m])) >= 5
              unless sum by (url_map_name) (increase(loadbalancing_googleapis_com:https_backend_request_count{monitored_resource="https_lb_rule", backend_target_name!="", response_code_class="500"}[10m])))
            evaluation_interval: "60s"

    # A spike against the policy's own 23 hours before (the error groups'
    # bar, docs/infra/monitoring.md §4), and above a floor that internet
    # scanning and the voice host's own uptime check never reach.
    armor-deny-spike:
      display_name: "Cloud Armor refusals spiked"
      tier: p2
      subject: "Cloud Armor refusals spiked: ${metric_or_resource.label.policy_name}"
      # #202: a scan flapped this five times in three hours (10-21/22); held
      # open an hour of quiet where its counter stops reporting.
      auto_close: "3600s"
      documentation: >-
        A Cloud Armor policy refused more than 300 requests in ten minutes,
        and more than ten times its own rate over the 23 hours before (or with
        none before). Either an attack or a scan (read the refused requests'
        sources and paths in the load balancer's log), or a rule that started
        refusing real people (read which rule matched; a rule changed by the
        last apply is the first suspect).
      conditions:
        - name: "more than 300 refused in ten minutes, ten times the day's rate"
          promql:
            query: >-
              sum by (policy_name) (increase(networksecurity_googleapis_com:https_request_count{monitored_resource="network_security_policy", blocked="true"}[10m])) > 300
              and (sum by (policy_name) (increase(networksecurity_googleapis_com:https_request_count{monitored_resource="network_security_policy", blocked="true"}[10m]))
              > 10 * sum by (policy_name) (increase(networksecurity_googleapis_com:https_request_count{monitored_resource="network_security_policy", blocked="true"}[23h] offset 10m)) / 138
              or sum by (policy_name) (increase(networksecurity_googleapis_com:https_request_count{monitored_resource="network_security_policy", blocked="true"}[10m]))
              unless sum by (policy_name) (increase(networksecurity_googleapis_com:https_request_count{monitored_resource="network_security_policy", blocked="true"}[23h] offset 10m)))
            evaluation_interval: "60s"

    # R572 (the portal review's §5 item 7): Adaptive Protection's alert, which
    # Cloud Armor raises on its own reading of a layer-7 attack building, and
    # which nothing told anyone of. One is enough: it is rare by design.
    armor-adaptive-protection:
      display_name: "Cloud Armor Adaptive Protection saw an attack"
      tier: p2
      subject: "Cloud Armor Adaptive Protection alert: ${metric_or_resource.label.policy_name}"
      documentation: >-
        Cloud Armor's Adaptive Protection raised or updated an alert on a
        policy: it reads a layer-7 attack building against a backend (a flood,
        or a pattern unlike the baseline), with its confidence and size. On
        beta's Standard tier the alert is the signal alone: Cloud Armor
        Enterprise's suggested rules and auto-deploy are not bought. Read the
        alert in the console (Network Security, Cloud Armor, Adaptive
        Protection) and the load balancer's request log for the sources and
        paths. A rule written to block them is a new expression rule, which the
        project's quota may not hold (docs/infra/edge.md section 2.0); the
        brake that always fits is IAP back on the host (infra/README.md,
        "Putting IAP back").
      conditions:
        - name: "an Adaptive Protection alert in ten minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/armor_adaptive_alerts" AND resource.type = "network_security_policy"
            alignment_period: "600s"
            group_by_fields: ["resource.label.policy_name"]

    # R572: the attack rules' refusals by set, on the load balancer they
    # refused on. Silent until a set enforces (armor_web_waf_mode and
    # armor_crm_waf_mode at "enforce"); then twenty from one set in ten minutes
    # is an attack worth reading or a rule refusing real people.
    armor-waf-refusals:
      display_name: "Cloud Armor's attack rules are refusing requests"
      tier: p2
      subject: "Cloud Armor attack rules refusing: ${metric_or_resource.label.class}"
      documentation: >-
        More than twenty requests in ten minutes were refused by one set of
        Cloud Armor's preconfigured attack rules (the incident's `class`: sqli,
        xss, lfi, rfi, rce, scannerdetection, protocolattack or
        sessionfixation) on one load balancer (um-app holds the portal and ops
        hosts, um-crm the CRM). Either an attack or a scan (read the refused
        requests in the load balancer's request log), or a rule refusing real
        people: a set that refuses a real page goes back to preview, its own
        apply (infra/README.md, "armor-web's attack rules").
      # The counter's own filter reads Logging's resource, `http_load_balancer`;
      # Monitoring has no such resource and files the counter's series under
      # `l7_lb_rule` (which carries `url_map_name`). A policy that names
      # Logging's type is refused: "The resource name does not represent a
      # known descriptor."
      conditions:
        - name: "more than twenty refused by one set in ten minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/armor_waf_refused" AND resource.type = "l7_lb_rule"
            threshold_value: 20
            alignment_period: "600s"
            group_by_fields: ["metric.label.class", "resource.label.url_map_name"]

    # Cloud NAT maps app-run-egress (auth's messenger), phi-run-egress
    # (connectors) and, with R189, cc-voice-run-egress (svc-voice): SendGrid,
    # the text vendor and the model leave through it.
    nat-port-exhaustion:
      display_name: "Cloud NAT is running out of ports"
      tier: p2
      subject: "Cloud NAT running out of ports: ${metric_or_resource.label.gateway_name}"
      documentation: >-
        A Cloud NAT gateway could not allocate addresses or ports, or dropped
        outgoing packets for want of them, for five minutes: calls to the
        email and text vendors and to the model fail. Read the gateway's port
        usage by VM in the console, then raise its minimum ports per VM or
        add an address in Terraform (modules/vpc).
      conditions:
        - name: "allocation failed in three minutes of five"
          threshold:
            filter: >-
              metric.type = "router.googleapis.com/nat/nat_allocation_failed" AND resource.type = "nat_gateway"
            threshold_value: 2
            alignment_period: "300s"
            per_series_aligner: "ALIGN_COUNT_TRUE"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["resource.label.gateway_name"]
        - name: "packets dropped for want of ports for five minutes"
          threshold:
            filter: >-
              metric.type = "router.googleapis.com/nat/dropped_sent_packets_count" AND resource.type = "nat_gateway"
              AND metric.labels.reason = "OUT_OF_RESOURCES"
            threshold_value: 10
            duration: "300s"
            alignment_period: "300s"
            group_by_fields: ["resource.label.gateway_name"]

    quota-exceeded:
      display_name: "a Google Cloud quota is refusing requests"
      tier: p2
      subject: "quota refusing requests: ${metric_or_resource.label.service} ${metric_or_resource.label.quota_metric}"
      documentation: >-
        A Google API refused this project's requests for exceeding a quota in
        three minutes or more of ten. The incident's labels are the service
        and the quota. A retried blip never opens this; a sustained refusal
        means something here is failing until the quota is raised (the
        console's Quotas page) or the caller slows down.
      conditions:
        - name: "a quota exceeded in three minutes of ten"
          threshold:
            filter: >-
              metric.type = "serviceruntime.googleapis.com/quota/exceeded" AND resource.type = "consumer_quota"
            threshold_value: 2
            alignment_period: "600s"
            per_series_aligner: "ALIGN_COUNT_TRUE"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["resource.label.service", "metric.label.quota_metric"]

    # Every sink in the project: the audit sinks into the vault's bucket, the
    # call centre's into cc-audit, and Google's own _Default and _Required.
    # Urgent: a sink that cannot export is a hole in the audit trail.
    log-sink-errors:
      display_name: "URGENT a log sink cannot export (the audit trail)"
      tier: p1
      urgent: true
      subject: "log sink cannot export: ${metric_or_resource.label.name}"
      documentation: >-
        A log sink failed to export entries in every five minutes for fifteen:
        whatever it routes (the audit logs into the vault, the call centre's
        into cc-audit) is not arriving, a hole in the audit trail that grows
        until it is fixed. The incident names the sink. Read its errors in the
        console (Logging, Log Router), most often the writer's permission on
        the destination or the perimeter refusing it; then notify the
        compliance owner of the window.
      conditions:
        - name: "export errors in every five minutes for fifteen"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/exports/error_count" AND resource.type = "logging_sink"
            duration: "900s"
            alignment_period: "300s"
            group_by_fields: ["resource.label.name"]

    # One condition per resource type the counter's series can land on, as
    # `log-counters-changed`. Read on live beta (2026-10-11): Secret Manager's
    # audit entries carry `audited_resource`, a Cloud Monitoring type, so its
    # series is there; Cloud KMS's carry `cloudkms_cryptokey`, a Logging-only
    # type that Google's "Mappings for Logging-only resources" table
    # (logging/docs/api/v2/resource-list) maps to `global`, as it does
    # `cloudkms_cryptokeyversion` and `cloudkms_keyring`, so KMS's series is
    # on `global`. No condition names a Logging-only type: Cloud Monitoring
    # has none, so it could never match.
    secret-version-disabled:
      display_name: "URGENT a Secret Manager version was disabled or destroyed"
      tier: p1
      urgent: true
      subject: "secret version disabled or destroyed: ${metric_or_resource.label.operation}"
      documentation: >-
        A secret's version was disabled or destroyed (the Admin Activity
        log; the incident's label is the method). A service that mounts it,
        pinned or `latest`, fails at its next deploy or restart. If a person
        did it on purpose (a rotation), check that nothing still pins that
        version; if nobody did, re-enable it now (a destroyed version cannot
        come back) and read the entry for who.
      conditions:
        - name: "a version disabled or destroyed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/secret_version_changes" AND resource.type = "audited_resource"
            group_by_fields: ["metric.label.operation"]
        - name: "a version disabled or destroyed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/secret_version_changes" AND resource.type = "global"
            group_by_fields: ["metric.label.operation"]
        - name: "a version disabled or destroyed (on the secret)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/secret_version_changes" AND resource.type = "secretmanager.googleapis.com/Secret"
            group_by_fields: ["metric.label.operation"]

    kms-version-disabled:
      display_name: "URGENT a KMS key version was disabled or scheduled for destruction"
      tier: p1
      urgent: true
      subject: "KMS key version disabled or destroyed: ${metric_or_resource.label.operation}"
      documentation: >-
        A Cloud KMS key version was disabled or scheduled for destruction
        (the Admin Activity log; the incident's label is the method). What it
        encrypts (a database's disk, a log bucket, records' keyring, a signed
        image's key) stops opening at the next restart or read, and a
        destroyed version takes its data with it. Restore it now: a version
        scheduled for destruction is restorable until the scheduled time
        (gcloud kms keys versions restore), a disabled one is enabled again;
        then read the entry for who.
      conditions:
        - name: "a version disabled or scheduled for destruction (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/kms_version_changes" AND resource.type = "audited_resource"
            group_by_fields: ["metric.label.operation"]
        # Where the PHI project's entries land (on `cloudkms_cryptokey`,
        # which Cloud Monitoring files under `global`: read 2026-10-11).
        - name: "a version disabled or scheduled for destruction (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/kms_version_changes" AND resource.type = "global"
            group_by_fields: ["metric.label.operation"]

    # -------------------------------------------------------------------------
    # #202 (T-5080): the security alerts the review found missing (R4), with
    # tpa-siem's control-plane rules folded in, one policy per counter above,
    # in every project. Each change alarm counts over a 30-minute window, so
    # an apply or a console session that makes many changes opens one
    # incident per method and stays open until 30 minutes pass with none;
    # the first notification is the only one. Google's notification rate
    # limit applies to log-match conditions alone, which this catalogue never
    # uses, so the window is the rate limit. p1 where an apply rarely makes
    # the change; p2 where applies make it often. Never a value in a label or
    # the documentation: the method is the one label, and the entry in the
    # project's Admin Activity log says who and what.
    # -------------------------------------------------------------------------

    iam-changed:
      display_name: "an IAM policy or custom role changed"
      tier: p2
      subject: "IAM policy or role changed: ${metric_or_resource.label.operation}"
      documentation: >-
        An IAM policy was set on a resource in this project, or a custom role
        created, changed or deleted (the Admin Activity log; the incident's
        label is the method). Every Terraform apply that changes a binding
        opens this once, as expected, so it waits for the morning (p2); in
        the PHI project it pages now (p1), since a binding there decides who
        reads member data. Read the project's Admin Activity log for the
        entry: who, on what, and which binding changed. A change nobody
        applied, a binding the inventory (infra/bindings.json) does not hold,
        or allUsers anywhere is a finding: the next apply puts Terraform's
        bindings back, and the binding gate names the difference.
      conditions:
        - name: "an IAM change (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an IAM change (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an IAM change (on a bucket)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "gcs_bucket"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an IAM change (on a Cloud Run service)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "cloud_run_revision"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an IAM change (on a database)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "cloudsql_database"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        # A Cloud Run job's IAM (run.v2.Jobs.SetIamPolicy) is logged on the job, as its other audit entries are
        # (2026-11-13: the counter's series by resource type read global, audited_resource and cloud_run_revision;
        # no condition here watched cloud_run_job). Six, Google's most for one policy.
        - name: "an IAM change (on a Cloud Run job)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iam_policy_changes" AND resource.type = "cloud_run_job"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    service-key-created:
      display_name: "URGENT a service account key was created"
      tier: p1
      urgent: true
      subject: "service account key created or attempted: ${metric_or_resource.label.operation}"
      documentation: >-
        Somebody created, uploaded or enabled a service account key, or tried
        to (the Admin Activity log; refused attempts count too). No key
        exists anywhere in this estate and the organization's policies refuse
        one, so this is never an apply: a key is a password for a robot that
        works from anywhere. Read the entry for who and which account; if a
        key exists, delete it now (gcloud iam service-accounts keys delete),
        then read what the account did since (its Admin Activity and Data
        Access entries), and tell the compliance owner.
      conditions:
        - name: "a key created or attempted (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/service_account_key_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a key created or attempted (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/service_account_key_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    audit-config-changed:
      display_name: "URGENT an audit log setting changed"
      tier: p1
      urgent: true
      subject: "audit log setting changed: ${metric_or_resource.label.operation}"
      documentation: >-
        A policy change in this project touched its audit configs: the Data
        Access logs (who read what) turned on or off for a service (the Admin
        Activity log). Turning them off is how a reader hides their reads, so
        it pages; an apply changes them only when infra/modules/audit-config
        does. Read the entry for who and which service; if it was not an
        apply, the next apply puts the configs back, and the gap in the Data
        Access logs is told to the compliance owner.
      conditions:
        - name: "an audit config changed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/audit_config_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an audit config changed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/audit_config_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    logging-changed:
      display_name: "URGENT a log sink, bucket or exclusion changed, or logs were deleted"
      tier: p1
      urgent: true
      subject: "logging changed: ${metric_or_resource.label.operation}"
      documentation: >-
        This project's logging changed (the Admin Activity log; the label is
        the method): a sink (the audit trail's way to the vault or cc-audit),
        an exclusion (which drops entries before they are kept), a log
        bucket (its retention or lock), a log view, the project's logging
        settings, or a log's entries deleted (DeleteLog). Each can hide what
        happened, so it pages; an apply changes them only when
        modules/log-sink does. Read the entry for who and what; a sink or an
        exclusion nobody applied is removed at once and the next apply puts
        Terraform's back; deleted entries are still in the vault's copy, so
        tell the compliance owner the window.
      conditions:
        - name: "logging changed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/logging_config_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "logging changed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/logging_config_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "logging changed (on a sink)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/logging_config_changes" AND resource.type = "logging_sink"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    network-control-changed:
      display_name: "a firewall or Cloud Armor rule changed"
      tier: p2
      subject: "firewall or Cloud Armor changed: ${metric_or_resource.label.operation}"
      documentation: >-
        A firewall rule, a network firewall policy or rule, or a Cloud Armor
        policy or rule was created, changed or deleted, or a backend's Cloud
        Armor policy set (the Admin Activity log; the label is the method).
        Applies change these often, so it waits for the morning (p2); a
        service account making the change pages (security-change-by-robot).
        Read the entry for who and what: a rule nobody applied, an allow
        wider than the design's (docs/infra/network-and-perimeter.md §3), or
        an Armor rule loosened is a finding; the next apply puts Terraform's
        rules back, and the binding gate's assertions name the difference.
      conditions:
        - name: "a network control changed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/network_control_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a network control changed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/network_control_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a network control changed (on a Cloud Armor policy)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/network_control_changes" AND resource.type = "network_security_policy"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        # A backend's Cloud Armor policy set or taken off (backendServices.setSecurityPolicy) is counted on the
        # backend (2026-11-13: two such points from the hooks apply, on gce_backend_service, opened nothing).
        - name: "a network control changed (on a backend service)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/network_control_changes" AND resource.type = "gce_backend_service"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    iap-changed:
      display_name: "URGENT the IAP gate's settings changed"
      tier: p1
      urgent: true
      subject: "IAP settings changed: ${metric_or_resource.label.operation}"
      documentation: >-
        IAP's settings on a resource were updated, or a backend service was
        updated with IAP turned off (the Admin Activity log). IAP is the front
        door of the portal and ops hosts, and while R302 holds the app's own
        header check is off (TP-145), so IAP off is the portals open to the
        internet. An update that drops the backend's iap block without saying
        false is not counted here: the portal and ops uptime checks fail when
        IAP is gone (they pass only on Google's sign-in page). Read the entry
        for who and which backend; put IAP back with a targeted apply of
        edge_app, then read the backend's request lines for the gap.
      conditions:
        - name: "IAP settings changed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iap_setting_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "IAP settings changed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/iap_setting_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    service-made-public:
      display_name: "URGENT a Cloud Run service was made public"
      tier: p1
      urgent: true
      subject: "a Cloud Run service was made public: ${metric_or_resource.label.operation}"
      documentation: >-
        A Cloud Run service's or job's IAM policy was set with allUsers or
        allAuthenticatedUsers on it, and it is not one of the four whose
        public invoker is the design's (web, auth and tpa-api, OWNER: 25;
        svc-voice, R148): anyone on the internet who can reach it may now
        call it (the Admin Activity log). Read the entry for who and which
        service, remove the binding at once (gcloud run services
        remove-iam-policy-binding), then read the service's request lines
        since. The binding gate refuses it at the next plan (N13, N15).
      conditions:
        - name: "allUsers bound (on a Cloud Run service)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_public_invokers" AND resource.type = "cloud_run_revision"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "allUsers bound (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_public_invokers" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "allUsers bound (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_public_invokers" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        # run_public_invokers counts a job's SetIamPolicy as well as a service's, and a job's is logged on the job
        # (2026-11-13: no condition here named cloud_run_job, so a job opened to allUsers counted and paged nobody).
        - name: "allUsers bound (on a Cloud Run job)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/run_public_invokers" AND resource.type = "cloud_run_job"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    org-policy-changed:
      display_name: "URGENT an organization policy changed on the project"
      tier: p1
      urgent: true
      subject: "organization policy changed: ${metric_or_resource.label.operation}"
      documentation: >-
        An organization policy was set, cleared or deleted on this project
        (the Admin Activity log). The project's pins (POL-2's exception, POL-4,
        POL-11, POL-14, POL-15) are what refuse a public service, a key, an
        outside member or the wrong egress, so a change pages; an apply
        changes them only when modules/project does. Read the entry for who
        and which constraint; the next apply puts Terraform's back. A policy
        set on the organization or a folder is in that resource's own log,
        which no project's alert reads.
      conditions:
        - name: "an organization policy changed (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/org_policy_changes" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an organization policy changed (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/org_policy_changes" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    sql-export-by-hand:
      display_name: "URGENT a database was exported or cloned by hand"
      tier: p1
      urgent: true
      subject: "database exported or cloned by hand: ${metric_or_resource.label.operation}"
      documentation: >-
        A Cloud SQL instance in this project was exported or cloned by a
        person or an unknown principal, not a service account (the Admin
        Activity log): a copy of a database left it outside the nightly export
        to the vault, which runs as its own account and is not counted. Read
        the entry for who, which instance and where the copy went; a copy
        nobody planned is deleted from its bucket at once and the compliance
        owner told.
      conditions:
        - name: "an export or clone by hand (on a database)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sql_exports_by_hand" AND resource.type = "cloudsql_database"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an export or clone by hand (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sql_exports_by_hand" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "an export or clone by hand (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sql_exports_by_hand" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

    security-change-by-robot:
      display_name: "URGENT a service account changed IAM, a firewall or Cloud Armor"
      tier: p1
      urgent: true
      subject: "a service account changed a security control: ${metric_or_resource.label.operation}"
      documentation: >-
        One of our service accounts (not one of Google's own service agents)
        set an IAM policy, changed a custom role, or changed a firewall rule
        or policy or a Cloud Armor policy (the Admin Activity log). On beta
        every apply is a person's and no workload of ours changes these, so a
        robot doing it is a misused identity or a stolen token. Read the entry
        for which account and what it changed, disable the account if nobody
        can say why (gcloud iam service-accounts disable), and read what else
        it did since.
      # Six conditions, Google's most. The counter is also written on cloud_run_job (a job's IAM) and
      # gce_backend_service (a backend's Armor policy), which no condition here names (2026-11-13). A robot's change
      # there still opens iam-changed or network-control-changed, which name both, at their tier (p2, or p1 for IAM in
      # the PHI project), never this page. Naming them here needs a second policy or one PromQL condition over every type.
      conditions:
        - name: "a robot's change (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "global"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a robot's change (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "audited_resource"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a robot's change (on a bucket)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "gcs_bucket"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a robot's change (on a Cloud Run service)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "cloud_run_revision"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a robot's change (on a Cloud Armor policy)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "network_security_policy"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]
        - name: "a robot's change (on a database)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/security_changes_by_robot" AND resource.type = "cloudsql_database"
            alignment_period: "1800s"
            group_by_fields: ["metric.label.operation"]

projects:
  # ---------------------------------------------------------------------------
  # The app project: web, auth and its jobs, tpa-api, tpa-jobs and its drains,
  # and (D-70, 2026-09-27) model-gateway. The gateway's lines carry `level`
  # beside `severity` (model_gateway/cli.py), so `errors` counts them with the
  # rest of this repository's; `auth_errors` leaves them out by name, because
  # the gateway's lines also carry a `logger` and uvicorn's is `uvicorn.*`.
  # ---------------------------------------------------------------------------
  app:
    log_metrics:
      errors:
        description: >-
          ERROR lines of the services this repository builds (tpa-api,
          tpa-jobs, tpa-jobs-drains, and model-gateway since D-70), one per
          line. The error group of docs/infra/monitoring.md §4: the
          formatter's service, the exception
          class, the operation and the reason code (which is where these
          services put a caught exception's class).
        filter: |
          (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
          AND jsonPayload.service:*
          AND jsonPayload.level="ERROR"
        labels:
          service: 'EXTRACT(jsonPayload.service)'
          class: 'EXTRACT(jsonPayload.exc.class)'
          operation: 'EXTRACT(jsonPayload.operation)'
          code: 'EXTRACT(jsonPayload.reason)'

      # Pinned to auth's own services and its jobs (2026-10-11; the event
      # publisher's service, auth-event-publisher, since D-314, was a job): the
      # project also runs the CRM's engine, whose uvicorn lines carry a
      # `logger` too (beta's CRM shares it, R282), and model-gateway, whose
      # uvicorn lines do. Its jobs are `migrate-auth` and `auth-*`.
      auth_errors:
        description: >-
          ERROR lines of auth, its messenger, its event publisher and its jobs, whose formatter is
          the issuer's own: the event is `msg`, the exception is the last line
          of `error`, of which only the leading class name is read.
        filter: |
          ((resource.type="cloud_run_revision" AND resource.labels.service_name=~"^auth(-outbox-publisher|-event-publisher)?$")
            OR (resource.type="cloud_run_job" AND resource.labels.job_name=~"^(migrate-auth|auth-[a-z-]+)$"))
          AND jsonPayload.logger=~"^(auth|uvicorn)"
          AND jsonPayload.level="ERROR"
        labels:
          # A leading name followed by a colon or nothing (the dashboard
          # reviewer's sweep, 2026-10-11): auth writes the class's name alone
          # here (auth/logging.py), and a line of free text gives no class,
          # never its first word.
          class: 'REGEXP_EXTRACT(jsonPayload.error, "^([A-Za-z_][A-Za-z0-9_.]*)(?::|$)")'
          operation: 'EXTRACT(jsonPayload.msg)'
          code: 'EXTRACT(jsonPayload.reason)'

      tpa_api_requests:
        description: >-
          tpa-api's one line per request (tpa-api.md §5.3): the operation the
          route called, the outcome and the status class. Never the route's
          filled path, the tenant or the session.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="tpa-api"
          AND jsonPayload.service="tpa-api"
          AND jsonPayload.message="request"
        labels:
          operation: 'EXTRACT(jsonPayload.operation)'
          outcome: 'EXTRACT(jsonPayload.outcome)'
          status_class: 'REGEXP_EXTRACT(jsonPayload.status, "^([1-5])[0-9][0-9]$")'

      # 2026-10-11: beta leaves tpa-api out of `canary-latency` (the module's
      # latency_excluded_services), because Cloud Run's request metric cannot
      # tell the desk's 40-second streams from a slow request. tpa-api's own
      # request line can: it carries the route's template and the time to the
      # response's first byte. The streams (the live lane, the three Ask
      # lanes), the file transfers and the model-backed document rows, whose
      # time is the model's by design, are left out by route and operation.
      # The route on a real request line is the template under the API's
      # mount (`/live/queue/stream`), never `/tpa/api/v1/...`: until the review
      # of 2026-10-11 (findings 6 and 7) the filter named the prefix and so
      # left nothing out. tests/tpa_api/test_latency_metric_lines.py drives
      # the real app's lines through it.
      tpa_api_latency:
        description: >-
          The time tpa-api took to start each answer (`duration_ms` on its
          `request` line, tpa-api.md §5.3), as a distribution in
          milliseconds, without the live lane, the member, staff and employer
          Ask lanes, uploads, downloads and previews (R529), the rows that embed a document in
          tpa-api's own process (D-69, D-76) and the plan-document rows that
          wait on the model. No label: the route and the operation select, and
          are never read into a series.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="tpa-api"
          AND jsonPayload.service="tpa-api"
          AND jsonPayload.message="request"
          AND NOT jsonPayload.route=~"^/(live|assist|staff-ask|employer-ask|uploads|downloads|previews)/"
          AND NOT jsonPayload.route=~"^(/knowledge/documents|/plan-years/[{]plan_year_id[}]/(plan-documents|published-documents)(/reembed)?)$"
          AND NOT jsonPayload.operation=~"^(plans[.]document_ai_begin|plan_templates[.]design_ai_begin|plans[.]add_document|plans[.]add_published_document|knowledge[.]ingest|plans[.]reembed_documents)$"
        value_extractor: 'EXTRACT(jsonPayload.duration_ms)'
        unit: "ms"
        bounds: [25, 50, 100, 250, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000]

      tpa_jobs_runs:
        description: >-
          One per run summary (tpa-jobs.md §6): every scheduled run and every
          drain tick, by job.
        filter: |
          (resource.type="cloud_run_job" OR resource.type="cloud_run_revision")
          AND jsonPayload.run_id:*
          AND jsonPayload.tenants_total:*
        labels:
          job: 'EXTRACT(jsonPayload.job)'

      tpa_jobs_alerts:
        description: >-
          One per alert record a run raises (tpa-jobs.md §6; tpa_jobs/summary.py
          SummaryWriter): the job and the registry's alert name. The record's
          tenant and detail are never read.
        filter: |
          (resource.type="cloud_run_job" OR resource.type="cloud_run_revision")
          AND jsonPayload.run_id:*
          AND jsonPayload.alert:*
          AND jsonPayload.category:*
        labels:
          job: 'EXTRACT(jsonPayload.job)'
          code: 'EXTRACT(jsonPayload.alert)'

      # tpa-jobs.md §5.5: "an outstanding-reconciliation count that grows".
      # accumulator_reconcile raises `accumulator_backlog_growing` with the
      # tenant's open count after every run that leaves one open; its value is
      # the count, so the policy can compare one night with the night before.
      tpa_jobs_accumulator_backlog:
        description: >-
          The outstanding reconciliations a run of accumulator_reconcile left
          open, one point per tenant per run (the record's `count`), by job.
          The record's tenant and detail are never read.
        filter: |
          (resource.type="cloud_run_job" OR resource.type="cloud_run_revision")
          AND jsonPayload.run_id:*
          AND jsonPayload.alert="accumulator_backlog_growing"
        labels:
          job: 'EXTRACT(jsonPayload.job)'
        value_extractor: 'EXTRACT(jsonPayload.count)'
        unit: "1"
        bounds: [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]

      tpa_jobs_drain_raised:
        description: >-
          A drain tick that raised (tpa_jobs/drain.py): the drain and the
          exception class. The loop carries on; the tick did nothing.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="tpa-jobs"
          AND jsonPayload.message="a drain tick raised"
        labels:
          job: 'EXTRACT(jsonPayload.operation)'
          class: 'EXTRACT(jsonPayload.reason)'

      auth_login_failures:
        description: >-
          A refused password sign-in: auth's request line for POST /auth/login
          answering 401. For the door dashboard; the surge alert auth's 04 §5.5
          describes needs a seven-day baseline Google does not keep for a log
          metric's alerts.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.msg="request"
          AND jsonPayload.route="POST /auth/login"
          AND jsonPayload.status=401

      auth_lockouts:
        description: >-
          Every answer of `423 locked` from auth (CONTRACT §7: the sign-in
          family answers 423, never 429).
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.msg="request"
          AND jsonPayload.status=423

      # R5105, R5107 (the decider, 2026-10-28: "190 yes." to #190 item 3,
      # per-person alerts on the existing on-call channels; CONTRACT r83 §4).
      # auth's messenger handles each paused bucket the sign-in recorded
      # (auth-notary auth/workers/sign_in_protection.py) and writes one WARNING
      # `sign_in_paused` per paused account: `kind` (account, factor,
      # factor_ceiling, factor_repeated; auth's own field name, since its
      # logger masks any field named `code`) and `class` (staff or outside),
      # and nothing else. Each is held to its closed list. A pause of an
      # address nobody holds writes no line: `auth_lockouts` counts those.
      auth_sign_in_protection:
        description: >-
          One per account whose sign-in auth paused after wrong attempts, from
          auth's messenger: `sign_in_paused`, by the pause's kind (as `code`:
          account, factor, factor_ceiling, factor_repeated) and whether the
          account is staff's or outside (`class`). Never the account, an
          address or a code.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth-outbox-publisher"
          AND jsonPayload.logger="auth.workers.sign_in_protection"
          AND jsonPayload.msg="sign_in_paused"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.kind, "^(account|factor|factor_ceiling|factor_repeated)$")'
          class: 'REGEXP_EXTRACT(jsonPayload.class, "^(staff|outside)$")'

      # T4 (2026-10-24, D-180; PLAN §5 panels 7 and 8): two more of auth's
      # request lines the hosted security page charts. The line carries the
      # route's template (`POST /auth/admin/principals/{sub}/revoke-all`, never
      # the person) and the status, and nothing else is read.
      auth_stepup_failures:
        description: >-
          A refused step-up: auth's request line for POST /auth/step-up
          answering 401 (a wrong code, password or passkey, or no factor), 403
          (a CSRF or session refusal) or 410 (a challenge expired, spent or
          not the session's own), by that status (`code`). Five in fifteen
          minutes revoke the session (CONTRACT §4).
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.msg="request"
          AND jsonPayload.route="POST /auth/step-up"
          AND (jsonPayload.status=401 OR jsonPayload.status=403 OR jsonPayload.status=410)
        labels:
          code: 'EXTRACT(jsonPayload.status)'

      auth_admin_revocations:
        description: >-
          An administrator ending a person's access: auth's request line for
          POST /auth/admin/principals/{sub}/revoke-all (every session ended)
          or /suspend (the login suspended too) answering 204, by which
          (`operation`: `revoke-all` or `suspend`). Who and why are in auth's
          audit chain, never here.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.msg="request"
          AND (jsonPayload.route="POST /auth/admin/principals/{sub}/revoke-all" OR jsonPayload.route="POST /auth/admin/principals/{sub}/suspend")
          AND jsonPayload.status=204
        labels:
          operation: 'REGEXP_EXTRACT(jsonPayload.route, "/(revoke-all|suspend)$")'

      # T4 (2026-10-25, D-188; auth-notary 04 §7.33 and §7.34 step 0, each a
      # precondition of its switch): auth's staff sign-in lines. Each is matched
      # by its logger and its `msg`, a closed word of auth's own code
      # (auth-notary 83de29c: `sign_in_pass_issued` in auth.api.sign_in_passes,
      # `sign_in_pass_used` in auth.domain.principals; 460505f: `device_pending`,
      # `device_approved`, `device_tag_mismatch` and `device_cookie_superseded`
      # in auth.domain.staff_devices), and every label is a closed
      # REGEXP_EXTRACT alternation, so a value off its list reads empty. The
      # `sub`, `device` and `kind` fields two of the device lines carry are
      # never read: no person, session, tenant, device or fingerprint is a label.
      auth_sign_in_passes:
        description: >-
          A one-time sign-in a TPA administrator issued for a member of staff
          (`sign_in_pass_issued`) or that member of staff signed in with
          (`sign_in_pass_used`), by which (`code`; auth's A3, both WARNING).
          Who issued it for whom, and why, is in auth's audit chain, never here.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND ((jsonPayload.logger="auth.api.sign_in_passes" AND jsonPayload.msg="sign_in_pass_issued")
            OR (jsonPayload.logger="auth.domain.principals" AND jsonPayload.msg="sign_in_pass_used"))
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.msg, "^(sign_in_pass_issued|sign_in_pass_used)$")'

      auth_staff_devices:
        description: >-
          auth's staff laptop lines (A4): a laptop waiting for approval
          (`device_pending`, the approval request), one approved
          (`device_approved`: by the operator's first-approval command,
          `outcome` `operator`, or on the Devices page, `admin`), an approval or
          a session's binding auth did not write (`device_tag_mismatch`), and a
          copied device cookie a second browser used (`device_cookie_superseded`),
          by which (`code`). Never the person, the laptop or its fingerprint.
        filter: |
          ((resource.type="cloud_run_revision" AND resource.labels.service_name="auth")
            OR (resource.type="cloud_run_job" AND resource.labels.job_name=~"^auth-[a-z-]+$"))
          AND jsonPayload.logger="auth.domain.staff_devices"
          AND jsonPayload.msg=~"^device_(pending|approved|tag_mismatch|cookie_superseded)$"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.msg, "^(device_pending|device_approved|device_tag_mismatch|device_cookie_superseded)$")'
          outcome: 'REGEXP_EXTRACT(jsonPayload.outcome, "^(operator|admin)$")'

      # T5 (2026-10-26, D-189; auth-notary's A6 request, §1 item 7): auth's
      # device-bound staff session lines, each matched by its logger and its
      # `msg`, a closed word of auth's own code (auth-notary b7638e8:
      # `session_bound`, `session_refreshed`, `binding_refused`,
      # `binding_guessed` and `binding_tag_mismatch` in auth.api.bound_sessions,
      # `binding_tag_mismatch` also in auth.domain.bound_sessions, and
      # `binding_skipped` in auth.api.cookies). Every label is a closed
      # REGEXP_EXTRACT alternation; the lines' `sid`, `sub` and `dbsc_id` are
      # never read. Written only while AUTH_STAFF_BOUND_SESSIONS is on, so the
      # counter is inert until then.
      auth_bound_sessions:
        description: >-
          auth's device-bound staff session lines (A6): a session bound to its
          laptop's key (`session_bound`), a bound cookie refreshed
          (`session_refreshed`), Chrome declining a binding
          (`binding_skipped`), a refused proof or binding request
          (`binding_refused`, at `register` or `refresh`, the `operation`), a
          session ended after five wrong proofs in fifteen minutes
          (`binding_guessed`), and a binding auth did not write
          (`binding_tag_mismatch`), by which (`code`). Never the person, the
          session or the binding.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND (jsonPayload.logger="auth.api.bound_sessions" OR jsonPayload.logger="auth.domain.bound_sessions"
            OR jsonPayload.logger="auth.api.cookies")
          AND jsonPayload.msg=~"^(session_bound|session_refreshed|binding_skipped|binding_refused|binding_guessed|binding_tag_mismatch)$"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.msg, "^(session_bound|session_refreshed|binding_skipped|binding_refused|binding_guessed|binding_tag_mismatch)$")'
          operation: 'REGEXP_EXTRACT(jsonPayload.stage, "^(register|refresh)$")'

      auth_not_ready:
        description: >-
          auth's `/ready` refusing, by the first check that failed (signer,
          factor_cipher, audit_key, breach_corpus, database, clock, …). auth's
          service alone (2026-10-11): another service's `not_ready` line must
          never open the urgent `auth-database`.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.msg="not_ready"
        labels:
          code: 'EXTRACT(jsonPayload.reason)'

      # R187's header check (2026-10-05, the IAP review's F3): auth's and
      # tpa-api's refusals of an assertion signed by a key the image's pinned
      # set lacks, and the image's own warning that its pinned keys are stale.
      # Either means Google rotated IAP's keys past the image: every browser
      # request would be refused once the old key leaves the set. Both
      # services write the event as `reason` (the header builder, 2026-10-05);
      # the message differs (auth's `msg`, tpa-api's `message`, "iap_refused"
      # for a refusal), so only `reason` and the service are read.
      iap_unknown_key:
        description: >-
          A browser request auth or tpa-api refused because IAP's assertion
          names a key the image's pinned set does not hold (`reason`
          `iap_unknown_key`). Nothing of the request is read.
        filter: |
          resource.type="cloud_run_revision"
          AND (resource.labels.service_name="auth" OR resource.labels.service_name="tpa-api")
          AND jsonPayload.reason="iap_unknown_key"

      iap_pinned_keys_stale:
        description: >-
          auth's or tpa-api's own warning that the IAP keys pinned in its image
          are stale (`reason` `iap_pinned_keys_stale`).
        filter: |
          resource.type="cloud_run_revision"
          AND (resource.labels.service_name="auth" OR resource.labels.service_name="tpa-api")
          AND jsonPayload.reason="iap_pinned_keys_stale"

      # IAP option B (CONTRACT r84; T-5073): every request line auth and tpa-api
      # write carries `iap`, the proxy check's closed word (`ok`, `exempt`,
      # `off`, or the refusal's word), and a request that is not ok also writes
      # `iap_report` (report mode, refused nothing) or `iap_refused` (enforce),
      # with `reason` `iap_<word>`. The two counts make the dashboard's ratio and
      # the two alerts below; nothing of the request is read.
      iap_checked:
        description: >-
          A request auth or tpa-api checked for IAP's assertion: its request
          line's `iap` word is none of `exempt`, `off` or `public` (OWNER-EMAIL-2:
          the portal's own origin, which comes with no assertion), by service, word
          (`code`: `ok` or the refusal's word) and site (`site`: the configured
          word of the backend the request's origin names). iap_not_ok over this,
          site for site, is the share of checked requests that were not ok (the
          would-be refusal rate per site, T-5073b).
        filter: |
          resource.type="cloud_run_revision"
          AND (resource.labels.service_name="auth" OR resource.labels.service_name="tpa-api")
          AND (jsonPayload.msg="request" OR jsonPayload.message="request")
          AND jsonPayload.iap=~"^[a-z_]+$"
          AND NOT jsonPayload.iap="exempt"
          AND NOT jsonPayload.iap="off"
          AND NOT jsonPayload.iap="public"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.iap, "^([a-z_]+)$")'
          # T-5073b R2: the denominator per site, the same closed word iap_not_ok
          # carries (portal, ops, none), never a host, an origin or an audience.
          site: 'REGEXP_EXTRACT(jsonPayload.site, "^([a-z][a-z0-9-]{0,23})$")'

      iap_not_ok:
        description: >-
          A browser request whose IAP assertion was not ok: auth's or tpa-api's
          `iap_report` (report mode: logged, refused nothing) or `iap_refused`
          (enforce: 401), by service, by `outcome` (`reported` or `refused`)
          and by the closed word (`code`: missing, expired, audience,
          unknown_key, origin_mismatch, lifetime, error, ...).
        filter: |
          resource.type="cloud_run_revision"
          AND (resource.labels.service_name="auth" OR resource.labels.service_name="tpa-api")
          AND (jsonPayload.msg=~"^iap_(report|refused)$" OR jsonPayload.message=~"^iap_(report|refused)$")
        labels:
          outcome: 'REGEXP_EXTRACT(jsonPayload.outcome, "^(reported|refused)$")'
          code: 'REGEXP_EXTRACT(jsonPayload.reason, "^iap_([a-z_]+)$")'
          # The option B review's F1: the configured site word (portal, ops,
          # none), never a host, an origin or an audience.
          site: 'REGEXP_EXTRACT(jsonPayload.site, "^([a-z][a-z0-9-]{0,23})$")'

      # D-335: a percentile of this counter (and of auth_events_outbox_lag,
      # the same bounds) never reads above its last bound, 600: Monitoring
      # reads a wait past it as 600 itself (2026-11-11, every minute of a
      # 28-minute wait). So no condition here asks for more than 600, and a
      # bar sits on a bound, since inside a bucket the p99 is interpolated
      # (tests/infra/test_signin_alerts.py holds both).
      auth_messages_outbox_lag:
        description: >-
          The age in seconds of the oldest unsent messages_outbox row, text or
          email, as the messenger reads it (auth's 04 §5.4: how long a person
          has waited for a sign-in message). auth's messenger writes it every
          five seconds while a message waits, even a batch that sent nothing.
          Empty until auth-notary's workers configure the JSON logger
          (docs/infra/monitoring.md §6).
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth-outbox-publisher"
          AND jsonPayload.msg="messages_drained"
        value_extractor: 'EXTRACT(jsonPayload.lag)'
        unit: "s"
        bounds: [1, 5, 10, 30, 60, 120, 300, 600]

      # D-314 (the owner, 2026-11-09): the event publisher, a warm service.
      auth_events_outbox_lag:
        description: >-
          The age in seconds of the oldest unpublished event outbox row, as
          auth's event publisher reads it after a batch (auth's 04 §4.1c and
          §5.4): how long a person's first sign-in may wait for its
          principal.joined. auth-event-publisher writes `publisher_alive` once a
          minute while batches complete and never while they do not
          (`auth_events_publisher_alive` counts the line for the absence).
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth-event-publisher"
          AND jsonPayload.msg="publisher_alive"
        value_extractor: 'EXTRACT(jsonPayload.lag_seconds)'
        unit: "s"
        bounds: [1, 5, 10, 30, 60, 120, 300, 600]

      # D-314 (the review): the same line counted, the heartbeat whose absence
      # the two policies read. A counter, because an absence condition's
      # ALIGN_COUNT is for numeric or Boolean values, not a distribution.
      auth_events_publisher_alive:
        description: >-
          One per `publisher_alive` line of auth's event publisher: once a
          minute while its batches complete, none while they do not. Its
          absence is the signal that publishing has stopped.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth-event-publisher"
          AND jsonPayload.msg="publisher_alive"

      auth_audit_break:
        description: >-
          `auth audit verify` printing a break (auth/cli.py: "audit verify:
          BREAK on <day> seq <n> …") on stderr. Only the prefix is matched;
          nothing of the line is extracted.
        filter: |
          resource.type="cloud_run_job"
          AND textPayload=~"^audit verify: BREAK on "

      auth_audit_reconciled:
        description: >-
          The membership reconcile's heartbeat (auth-notary 04 §5.4): one
          `audit_reconciled` line per run of the auth-sweeper job, whatever it
          found. Unlabelled on purpose: its absence is the "not run" page, and
          absence is judged per time series, so a label a finding could move
          would page "not run" while findings stood.
        filter: |
          resource.type="cloud_run_job"
          AND resource.labels.job_name="auth-sweeper"
          AND jsonPayload.logger="auth.domain.reconcile"
          AND jsonPayload.msg="audit_reconciled"

      auth_audit_reconcile_outcomes:
        description: >-
          The same heartbeat, for the runs that were not clean, by result
          (`findings`, `chain_broken`). A dashboard, never a page: a break
          already paged stays `chain_broken` on every run.
        filter: |
          resource.type="cloud_run_job"
          AND resource.labels.job_name="auth-sweeper"
          AND jsonPayload.logger="auth.domain.reconcile"
          AND jsonPayload.msg="audit_reconciled"
          AND jsonPayload.reason!="clean"
        labels:
          code: 'EXTRACT(jsonPayload.reason)'

      auth_audit_reconcile_findings:
        description: >-
          One `audit_reconcile_finding` line per finding: a membership or a
          principal the audit chain doesn't explain, a person holding a desk
          role beside a `door_internal` role or, since R156 (auth 7c784ac),
          beside `compliance_officer` (`roles_never_together`), a forged
          known-break row, or, since I-240 unit 4, a live credential, workload
          or workload key with no tag or one under an unpublished key id
          (`credential_tag_missing`). By kind.
        filter: |
          resource.type="cloud_run_job"
          AND resource.labels.job_name="auth-sweeper"
          AND jsonPayload.logger="auth.domain.reconcile"
          AND jsonPayload.msg="audit_reconcile_finding"
        labels:
          code: 'EXTRACT(jsonPayload.reason)'

      auth_audit_chain_breaks_new:
        description: >-
          One `audit_chain_break_new` line per audit-chain break the reconcile
          has not paged before; the sweeper then records it as known, so each
          break pages once. By check.
        filter: |
          resource.type="cloud_run_job"
          AND resource.labels.job_name="auth-sweeper"
          AND jsonPayload.logger="auth.domain.reconcile"
          AND jsonPayload.msg="audit_chain_break_new"
        labels:
          code: 'EXTRACT(jsonPayload.reason)'

      auth_credential_tag_invalid:
        description: >-
          A stored factor, workload or workload key whose tag under the bearer
          key was NULL, didn't verify, or named a key outside {current,
          previous}, met by a door about to use it: `credential_tag_invalid`
          (a factor) or `workload_tag_invalid` (a workload or its key) from
          logger `auth.domain.tags` (auth-notary 04 §5.4's
          `auth_credential_tag_invalid_total`, I-240 unit 4), and since unit 5
          (auth-notary 117127a) `bearer_key_invalid`: an open invitation, reset
          or texted code under a key id no key holds. By the row's `kind` (as
          `code`) and the `door` (as `gate`), under the catalogue's own label
          names (docs/infra/monitoring.md §2). From `auth`'s request container
          and from auth's jobs: `auth retag-bearer-key` (04 §7.7a) runs as a
          job and logs its refusals at the door `retag`.
        filter: |
          ((resource.type="cloud_run_revision" AND resource.labels.service_name="auth")
            OR resource.type="cloud_run_job")
          AND jsonPayload.logger="auth.domain.tags"
          AND jsonPayload.metric="credential_tag_invalid"
        labels:
          code: 'EXTRACT(jsonPayload.kind)'
          gate: 'EXTRACT(jsonPayload.door)'

      scheduler_failures:
        description: >-
          A Cloud Scheduler attempt that finished in error: the job could not
          be started. By the attempt's status code (PERMISSION_DENIED,
          NOT_FOUND, …); the scheduler job is the resource's job_id.
        filter: |
          resource.type="cloud_scheduler_job"
          AND jsonPayload."@type"="type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished"
          AND severity>=ERROR
        labels:
          code: 'EXTRACT(jsonPayload.status)'

      # D-147: the vendors the app project calls. model-gateway writes one line
      # per form call (model_gateway/app.py, its ClosedFieldFormatter), every
      # one with `latency_ms`, its `outcome` a vendor_* code when the vendor
      # failed it; only those four codes are read into `code`.
      model_gateway_calls:
        description: >-
          One per model-gateway form call (its line with `latency_ms`), by the
          vendor failure code when the model vendor failed the call
          (vendor_error, vendor_busy, vendor_unavailable, vendor_rejected),
          and no code otherwise. Nothing else of the line is read.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="model-gateway"
          AND jsonPayload.service="model-gateway"
          AND jsonPayload.latency_ms:*
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.outcome, "^(vendor_(?:error|busy|unavailable|rejected))$")'

      # auth's messenger (auth-notary auth/workers/messenger.py): one
      # `message_not_sent` line per send the vendor refused or never answered,
      # with the channel and the seam's reason (auth/seams/outbound.py). Only
      # the vendor's own reasons and the network's; the recipients list, the
      # allowlist, a template and the identity token are ours and have their
      # own lines. Empty until auth's workers write JSON (§6).
      auth_message_vendor_failures:
        description: >-
          A sign-in message (an email or a text) the vendor refused or never
          answered, from auth's messenger: `message_not_sent` with a vendor
          or network reason. By channel (as `lane`) and reason; never the
          template, the row or the destination.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth-outbox-publisher"
          AND jsonPayload.logger="auth.workers.messenger"
          AND jsonPayload.msg="message_not_sent"
          AND jsonPayload.reason=~"^(vendor_(refused|busy|unavailable|unreadable)|unreachable|no_answer)$"
        labels:
          lane: 'EXTRACT(jsonPayload.channel)'
          code: 'EXTRACT(jsonPayload.reason)'

      # R572 (the portal review's §4, "Cost abuse of texted codes", and §5
      # items 6 and 7; I-838, I-843): auth caps the codes it texts in a UTC day,
      # per person and across the estate (auth-notary 7aed4bc, with a199649's
      # pools and two ceilings, at its head cbe9e57; auth/domain/text_caps.py,
      # O244, under its final re-check). The members' estate
      # has a soft ceiling, the setting, past which only a person's first code of
      # their day still goes, and a hard one at twice the setting, past which
      # none does. Every refused members' code writes one
      # `sms_codes_estate_ceiling` line at ERROR from logger
      # `auth.domain.text_caps`, `outcome` refused, `ceiling` soft or hard,
      # `at` offer (a sign-in or a reset left texts out of its methods) or
      # send (a door refused a code); a first code let past the soft ceiling
      # writes the same name at WARNING with `outcome` admitted, which is not a
      # refusal and is not counted. Enroll's applicants count in their own pool,
      # and its refusals write `sms_codes_registration_ceiling` (counted below).
      # Only `at` and `ceiling` are read, each held to its closed words. The
      # person's own cap (`sms_codes_person_cap`) carries the person's `sub` and
      # is not counted. Nothing in auth writes a line per code sent, so the volume
      # below the ceiling is not countable from the logs: asked of auth-notary
      # (trellis-security requests/2026-11-08-tpa-platform-to-auth-notary-
      # texted-codes-line.md).
      auth_sms_codes_estate_ceiling:
        description: >-
          One per members' texted code auth refused because the estate's day is
          spent (`sms_codes_estate_ceiling`, outcome refused), by where it was
          refused (`code`: offer or send) and which ceiling (`class`: soft, past
          the setting; hard, past twice it). A first code admitted past the soft
          ceiling is not counted. Nothing else of the line is read.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.logger="auth.domain.text_caps"
          AND jsonPayload.msg="sms_codes_estate_ceiling"
          AND jsonPayload.outcome="refused"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.at, "^(offer|send)$")'
          class: 'REGEXP_EXTRACT(jsonPayload.ceiling, "^(soft|hard)$")'

      # The applicants' own pool (auth-notary a199649, at its head cbe9e57): an
      # Enroll registration's set-up codes past AUTH_SMS_CODES_REGISTRATION_PER_DAY,
      # refused, never the members'.
      auth_sms_codes_registration_ceiling:
        description: >-
          One per applicant's set-up code auth refused because the applicants'
          day is spent (`sms_codes_registration_ceiling`, outcome refused), by
          where it was refused (`code`: offer or send). Nothing else of the line
          is read.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.logger="auth.domain.text_caps"
          AND jsonPayload.msg="sms_codes_registration_ceiling"
          AND jsonPayload.outcome="refused"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.at, "^(offer|send)$")'

      # O244's F1 (auth-notary 4aced85, at its head cbe9e57): auth asks the full
      # breached-password list (AN-03) off its event loop under a two-second
      # deadline, and a lookup that does not answer (the deadline passed, or the
      # file read short or failed) is a refusal, never a pass: no password is set
      # and no session opens, auth answering 503 internal. Each writes one
      # `breach_corpus_unavailable` line at ERROR from logger
      # `auth.domain.credentials.password`, `outcome` refused, `at` set or login,
      # `cause` timeout or read. Only `at` and `cause` are read, each held to its
      # closed words.
      auth_breach_corpus_unavailable:
        description: >-
          One per breached-password lookup that gave auth no answer, so a sign-in
          or a password set was refused (`breach_corpus_unavailable`), by when
          (`code`: set or login) and why (`class`: timeout or read). Nothing else
          of the line is read.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="auth"
          AND jsonPayload.logger="auth.domain.credentials.password"
          AND jsonPayload.msg="breach_corpus_unavailable"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.at, "^(set|login)$")'
          class: 'REGEXP_EXTRACT(jsonPayload.cause, "^(timeout|read)$")'

      # #202 (TP-152; the review's R4: "monitoring-changed and
      # log-counters-changed exist only in the PHI project"): the same two
      # counters as the PHI project's, by the same names and filters. Here
      # the platform group holds roles/monitoring.editor (row 167 or 171),
      # which can make a new policy or channel, so a change nobody announced
      # is as much a finding as in the PHI project. By method alone.
      monitoring_changes:
        description: >-
          A change to this project's alert policies, notification channels or
          snoozes in the Admin Activity audit log: a policy created, updated
          or deleted, a channel created, updated, deleted or verified, a
          snooze created or updated. By method alone; the entry says who and
          what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="monitoring.googleapis.com"
          AND (protoPayload.methodName="google.monitoring.v3.AlertPolicyService.CreateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.UpdateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.DeleteAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.CreateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.UpdateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.DeleteNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.VerifyNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.CreateSnooze"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.UpdateSnooze")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

      log_metric_changes:
        description: >-
          A change to this project's log-based metrics in the Admin Activity
          audit log: a log metric created, updated or deleted. By method
          alone; the entry says who and what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="logging.googleapis.com"
          AND (protoPayload.methodName="google.logging.v2.MetricsServiceV2.CreateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.UpdateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.DeleteLogMetric")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

    # #202 (T-5080): an error group is a service's exception class alone
    # (the resource names the service or job), so one cause that fails many
    # operations is one group, not one each (10-30: records' catalogue
    # mismatch opened ten). The counters keep every label for the console.
    error_metrics:
      errors:
        group_by: [service, class]
        resource_types: [cloud_run_revision, cloud_run_job]
      auth_errors:
        group_by: [class]
        resource_types: [cloud_run_revision, cloud_run_job]

    alert_policies:
      audit-chain:
        display_name: "URGENT audit chain (auth)"
        tier: p1
        urgent: true
        subject: "auth audit chain: ${metric_or_resource.label.job_name}${metric_or_resource.label.job_id}"
        documentation: >-
          The issuer's audit chain did not verify, or the job that verifies or
          heads it could not run. A break is never assumed to be tampering or a
          bug: auth-notary runbook 7.12 tells them apart. Notify the compliance
          owner.
        conditions:
          - name: "audit verify printed BREAK"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_audit_break" AND resource.type = "cloud_run_job"
              group_by_fields: ["resource.label.job_name"]
          - name: "an audit job's execution failed"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
                AND metric.labels.result = "failed"
                AND resource.labels.job_name = one_of("auth-audit-head", "auth-audit-verify", "auth-audit-verify-monthly")
              group_by_fields: ["resource.label.job_name"]
          - name: "an audit job's schedule could not start it"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = one_of("auth-audit-head", "auth-audit-verify", "auth-audit-verify-monthly")
              group_by_fields: ["resource.label.job_id"]

      audit-reconcile:
        display_name: "URGENT membership reconcile (auth)"
        tier: p1
        urgent: true
        documentation: >-
          The issuer's membership reconcile found an audit-chain break it had
          not paged before, or found a membership or principal the chain
          doesn't explain or, since I-240 unit 4, a live credential, workload
          or workload key with no tag or one under an unpublished key id.
          Notify the compliance owner.
          A new break: auth-notary runbook 7.12 (a break is never assumed to
          be tampering or a bug). A finding: runbook 7.17; it pages every run
          while it stands. A `credential_tag_missing` finding right after a
          pin: runbook 04 §7.22 — the tag job was run out of order. The
          reconcile not running is `audit-reconcile-absent` (p2).
        conditions:
          - name: "a new audit-chain break"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_audit_chain_breaks_new" AND resource.type = "cloud_run_job"
              group_by_fields: ["metric.label.code"]
          - name: "the membership reconcile found something"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_audit_reconcile_findings" AND resource.type = "cloud_run_job"
              group_by_fields: ["metric.label.code"]

      # #202 (the review's row 19): the reconcile not running is its own
      # policy, p2. It opened whenever auth-sweeper was paused or broken
      # (10-15, 26 minutes, urgent); a break or a finding still pages above.
      audit-reconcile-absent:
        display_name: "membership reconcile not running (auth)"
        tier: p2
        documentation: >-
          The issuer's membership reconcile has not run for 90 minutes: the
          auth-sweeper job isn't being started, can't finish its tick, or
          can't read the audit key; its failed executions and its ERROR lines
          say which. Until it runs again nothing is watching the memberships,
          so a break or a finding it would page (`audit-reconcile`) waits too.
        conditions:
          - name: "the membership reconcile has not run for 90 minutes"
            absent:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_audit_reconciled" AND resource.type = "cloud_run_job"
                AND resource.labels.job_name = "auth-sweeper"
              duration: "5400s"

      audit-credential-tag:
        display_name: "URGENT credential or workload tag invalid (auth)"
        tier: p1
        urgent: true
        subject: "auth credential or workload tag invalid: ${metric_or_resource.label.code}"
        documentation: >-
          A stored factor, workload or key failed its tag at use, meaning a
          writer without the bearer key: a swapped password, a copied row, an
          inserted passkey or recovery code, a widened or re-pointed workload,
          or a swapped key (forgery or tampering). Read `sub`, `kind`, the row
          and `door` from the line; revoke it as the runbook says (auth-notary
          04 §5.5, I-240) and treat the runtime role's credentials as leaked.
          `untagged: true` in the first minutes after a pin is most likely a
          row the tag job hadn't reached (§7.22 run out of order); anywhere
          else, treat it as above.
        conditions:
          - name: "any increase of auth_credential_tag_invalid"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_credential_tag_invalid" AND resource.type = "cloud_run_revision"
              group_by_fields: ["metric.label.code"]
          - name: "any increase of auth_credential_tag_invalid in an auth job"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_credential_tag_invalid" AND resource.type = "cloud_run_job"
              group_by_fields: ["resource.label.job_name", "metric.label.code"]

      # T4 (2026-10-25, D-188; auth-notary 04 §7.33 and §7.34 step 0: the
      # platform pages "at normal urgency" on each): staff sign-in's pages. A
      # one-time sign-in is the fallback a TPA administrator hands out by phone
      # (OD-11: "audited, pages"), and a waiting laptop is the approval request
      # (OD-12, from the owner's R-8), so each pages normal; an approval or a
      # binding auth did not write pages URGENT, as a credential's failed tag
      # does (audit-credential-tag above). Each subject names nothing but what
      # happened: never a person, a laptop or a tenant.
      auth-sign-in-pass-issued:
        display_name: "staff sign-in: a one-time sign-in was issued"
        tier: p2
        documentation: >-
          A TPA administrator issued a one-time sign-in for a member of staff
          who could not use their passkey: it works once, for 15 minutes, and
          signs the person in for at most two hours, with no step-up and no
          admin page. First steps: read auth's audit trail for the
          `sign_in_pass.issued` fact (who issued it, for whom and why) and ask
          that administrator whether they called the person back on a number on
          file. If nobody can say, revoke it on the person's Users page and end
          the person's sessions.
        conditions:
          - name: "a one-time sign-in issued"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_passes" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "sign_in_pass_issued"

      auth-sign-in-pass-used:
        display_name: "staff sign-in: a one-time sign-in was used"
        tier: p3
        documentation: >-
          A member of staff signed in with a one-time sign-in an administrator
          issued. The session lasts at most two hours and refuses every step-up,
          reveal, high-risk action and admin page. First steps: confirm it
          follows an issue you know of (the `auth-sign-in-pass-issued` page, or
          auth's audit trail); if not, end the person's sessions on their Users
          page and ask them.
        conditions:
          - name: "a one-time sign-in used"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_passes" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "sign_in_pass_used"

      auth-device-pending:
        display_name: "staff laptop: a laptop is waiting for approval"
        tier: p2
        documentation: >-
          A member of staff signed in on a laptop no TPA administrator has
          approved: it reaches no member data until one does. First steps: a
          TPA administrator calls the person, reads back the six-character code
          the laptop shows against the one on Admin, Devices, and approves it
          there with a passkey (never their own laptop; two a person at most).
          A laptop nobody expected is a password and a second factor in someone
          else's hands: leave it waiting, remove it, and reset the person's
          sign-in.
        conditions:
          - name: "a laptop waiting for approval"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_staff_devices" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "device_pending"

      auth-device-approved-by-operator:
        display_name: "URGENT staff laptop: the first laptop was approved from the server"
        tier: p1
        urgent: true
        documentation: >-
          Someone with server access ran auth's first-approval command
          (`auth admin approve-first-device`), which approves a TPA
          administrator's laptop only while no TPA administrator of the tenant
          has one: the way in on the day the switch comes on, and the way back
          if every administrator's laptop is lost. First steps: confirm it was
          planned (the runbook's step, or the owner); if not, remove the laptop
          on Admin, Devices and find who ran the job.
        conditions:
          - name: "a laptop approved by the operator's command"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_staff_devices" AND resource.type = "cloud_run_job"
                AND metric.labels.code = "device_approved" AND metric.labels.outcome = "operator"

      auth-device-tag-mismatch:
        display_name: "URGENT staff laptop: an approval auth did not write"
        tier: p1
        urgent: true
        documentation: >-
          auth found a laptop approval, or a session's binding to its laptop,
          whose tag does not verify: written by something without the bearer
          key (a copied or inserted row, or tampering), or under a bearer key
          since retired. auth refused it, so nothing was reached. First steps:
          read `kind`, `sub` and `device` from the line, remove the device on
          Admin, Devices, end the person's sessions, and treat auth's database
          credentials as leaked unless a bearer key rotation explains it
          (auth-notary 04 §7.34 step 4: every laptop is approved again after a
          retirement).
        conditions:
          - name: "an approval or binding auth did not write"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_staff_devices" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "device_tag_mismatch"
          - name: "an approval or binding auth did not write, in an auth job"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_staff_devices" AND resource.type = "cloud_run_job"
                AND metric.labels.code = "device_tag_mismatch"
              group_by_fields: ["resource.label.job_name"]

      auth-device-cookie-superseded:
        display_name: "staff laptop: copied laptop cookies are being used"
        tier: p2
        documentation: >-
          More than three times in an hour a browser presented a laptop cookie
          another browser had already moved on from: one is a person who
          restored a browser profile; several mean a cookie copied off a
          laptop. auth gave each such browser a new, waiting laptop, so nothing
          was reached. First steps: read `sub` from the lines, look at that
          person's waiting laptops on Admin, Devices, and approve none you
          cannot account for.
        conditions:
          - name: "more than three in an hour"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_staff_devices" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "device_cookie_superseded"
              threshold_value: 3
              alignment_period: "3600s"

      # T5 (2026-10-26, D-189; auth-notary's A6 request, §1 item 7, and its 04
      # §7.35): repeated wrong proofs page at normal urgency. auth has already
      # ended the session, so nothing more is reached; a person reads who.
      # Still owed (the request's item 7, beside this one): the URGENT page on
      # `binding_tag_mismatch`, a `binding_refused` rate page, and the hosted
      # dashboard's charts (trellis-watchtower's W1b).
      auth-binding-guessed:
        display_name: "staff laptop: a session ended after wrong laptop proofs"
        tier: p2
        documentation: >-
          auth ended a member of staff's laptop-bound session after five
          refreshes in fifteen minutes proved the wrong key: a browser holding
          the session's cookies without the laptop that bound it tried to keep
          it alive. The bound cookie lasts ten minutes, so nothing was reached
          past that. First steps: read `sid` from auth's `binding_guessed` line,
          find the person through the session's `secret_mismatch` revocation in
          auth's audit trail, end their other sessions on their Users page, and
          ask them whether their laptop, browser profile or cookies were copied.
        conditions:
          - name: "a session ended after wrong proofs"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_bound_sessions" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "binding_guessed"

      # #202 (the review's row 28): three in five minutes, p2. One line paged
      # (10-27, five minutes); auth-db down pages on its own (`auth-db-down`,
      # `backend-down`, `inside-down: auth`, all p1).
      auth-database:
        display_name: "auth cannot reach its database"
        tier: p2
        documentation: >-
          auth's readiness check found auth-db unreachable (`not_ready`, reason
          `database`) three times or more in five minutes: sign-in is failing.
          Check the instance, then the Private Service Connect endpoint, then
          the IAM login. A database that is down pages on its own
          (`auth-db-down`).
        conditions:
          - name: "three or more not_ready for database in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_not_ready" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "database"
              threshold_value: 2
              group_by_fields: ["resource.label.service_name"]

      # 2026-10-11 (the auth reviewer, through the orchestrator): the lag is
      # the oldest unsent row of either kind, texts and emails alike, and is
      # written every five seconds while one waits, so one email on its retry
      # ladder (beta's `recipients_unavailable`, about five minutes) opens
      # this. Watching texts alone needs auth to write their lag apart
      # (docs/infra/monitoring.md §10; the request is in the lane's
      # trellis-security text). Off in beta while the publisher is.
      auth-messages-lag:
        display_name: "sign-in messages (texts and emails) waiting"
        tier: p2
        documentation: >-
          A person is waiting for a sign-in message, a text code or an email
          (an invitation, a reset, a code): the oldest unsent messages_outbox
          row, of either kind, is older than 30 s, or the sender has no
          instance. An email retrying after a vendor or recipients-list refusal
          opens it too. Check the vendor, the NAT path and the allowlist
          (auth-notary 04 §5.5), then the row's channel.
        conditions:
          - name: "messages_outbox lag above 30 s for two minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_messages_outbox_lag" AND resource.type = "cloud_run_revision"
              threshold_value: 30
              duration: "120s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_PERCENTILE_99"
              cross_series_reducer: "REDUCE_MAX"
          - name: "the sender has no instance"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/container/instance_count" AND resource.type = "cloud_run_revision"
                AND resource.labels.service_name = "auth-outbox-publisher"
              comparison: "COMPARISON_LT"
              threshold_value: 1
              duration: "120s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_MAX"
              cross_series_reducer: "REDUCE_SUM"
          # Summed over the service's revisions (2026-10-10): per revision,
          # every deploy ended the old revision's series and opened this for
          # good (beta: two incidents, one per instance state, still open
          # hours after auth-outbox-publisher-00002 took the traffic). By
          # service it still opens when no revision reports at all.
          - name: "the sender reports no instance count at all"
            absent:
              filter: >-
                metric.type = "run.googleapis.com/container/instance_count" AND resource.type = "cloud_run_revision"
                AND resource.labels.service_name = "auth-outbox-publisher"
              duration: "300s"
              cross_series_reducer: "REDUCE_SUM"
              group_by_fields: ["resource.label.service_name"]

      # #202 (the live read: the one long stall, 10-10, 11.6 hours, was a
      # normal alert nobody would have been woken for): a message waiting
      # pages. Off in beta while the publisher is (as `auth-messages-lag`).
      #
      # D-335 (the owner, 2026-11-12): re-based on the texted code's life.
      # Its old bar, above 900 s, could never be met: the counter's last
      # bound is 600 (bounds above), and Monitoring reads a percentile that
      # falls past the last bound as the bound itself, so every minute of
      # 2026-11-11's 28-minute wait read 600 and no more. A texted code dies
      # with its 300 s challenge (auth-notary auth/workers/messenger.py: a
      # message past `not_after` is never sent), and the messenger writes this
      # line only while a message waits, so on both texting outages the lag
      # climbed to about 300 s and stopped (2026-11-09: 330 s at most;
      # 2026-11-11 01:47-01:53Z: 301 s). Above 120 s (a bound: Monitoring
      # interpolates inside a bucket, and 120 to 300 s is one bucket, whose
      # p99 read 278 to 298 on both days) for two minutes is one message
      # waiting four minutes or more: four-fifths of a code's life. On the
      # minutes read it opens about 15:17Z on 11-09 and 01:52Z on 11-11,
      # after `sign-in-message-vendor`, as the backstop for a stall that
      # writes no vendor failure (a sender's own error, a claim that never
      # comes back). The line carries one lag for every row, so an email held
      # that long opens it too: the one other wait in the three weeks read,
      # an opening email held for records' word, 2026-11-11 01:16-01:44Z,
      # would have paged at about 01:20Z. A lag for texts alone is auth's to
      # write (trellis-security requests/2026-10-11-tpa-platform-to-auth-
      # notary-outbox-lag-by-channel.md, `lag_text`); with it this reads that.
      auth-messages-stalled:
        display_name: "URGENT sign-in messages stuck: one has waited about four minutes"
        tier: p1
        urgent: true
        documentation: >-
          A sign-in message (a texted code or an email: an invitation, a
          reset, a code) has waited more than two minutes to be sent, for two
          minutes running: the oldest has waited four minutes or more, and a
          texted code dies at five, so members and brokers asking for a code
          are not getting one. Read auth-outbox-publisher's lines first:
          `message_not_sent` (a vendor or the path: `sign-in-message-vendor`
          opens beside it), `message_send_failed` (the sender's own error, in
          auth's error group), or `opening_authority_unavailable` (an opening
          email held for records' word, which holds this line's lag too: not
          a sign-in outage if no text is waiting). Then the NAT path and the
          allowlist (auth-notary 04 §5.5); `auth-messages-lag` opened at 30 s
          beside it.
        conditions:
          - name: "messages_outbox lag above two minutes for two minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_messages_outbox_lag" AND resource.type = "cloud_run_revision"
              threshold_value: 120
              duration: "120s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_PERCENTILE_99"
              cross_series_reducer: "REDUCE_MAX"

      # D-314 (the owner, 2026-11-09): the event publisher, warm, watched as
      # the sender above is. It replaces the job's `jobs-failed` and missed
      # run: a line once a minute while batches complete, so its absence is a
      # publisher that is not publishing, whatever the reason. Its "no
      # instance" is the warm-service policy's (p2). Each absence is summed
      # by service, so a deploy that ends the old revision's series opens
      # nothing.
      auth-events-lag:
        display_name: "events waiting for the publisher (first sign-ins wait)"
        tier: p2
        documentation: >-
          auth's event publisher (the auth-event-publisher service) is behind: the
          oldest unpublished event is older than 30 s, or it has completed no
          batch for five minutes. Until it catches up a person signing in for
          the first time is refused `mirror_stale` ("we are catching up"), and
          a membership removed or changed has not reached records. Read its
          `publisher_batch_failed` lines (the database, the connector or the
          key service, by class), then its instances and `/health`; a poisoned
          row is `auth_outbox_poisoned_total` (auth-notary 04 §5.5).
        conditions:
          - name: "event outbox lag above 30 s for two minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_events_outbox_lag" AND resource.type = "cloud_run_revision"
              threshold_value: 30
              duration: "120s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_PERCENTILE_99"
              cross_series_reducer: "REDUCE_MAX"
          - name: "the publisher has completed no batch for five minutes"
            absent:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_events_publisher_alive" AND resource.type = "cloud_run_revision"
              duration: "300s"
              cross_series_reducer: "REDUCE_SUM"
              group_by_fields: ["resource.label.service_name"]

      # D-335: the lag condition's old bar, above 900 s, could never be met,
      # as auth-messages-stalled's could not: the counter's last bound is 600
      # and a percentile past it reads 600. Above 300 s (a bound) for ten
      # minutes keeps the quarter of an hour: an event five minutes old,
      # still unpublished ten minutes later. Five-minute windows, because the
      # line comes once a minute and a one-minute window can hold none. In
      # the three days read (2026-11-09 to -12) the lag never passed 30 s.
      auth-events-stalled:
        display_name: "URGENT events stuck for 15 minutes (first sign-ins refused)"
        tier: p1
        urgent: true
        documentation: >-
          auth's event publisher has published nothing for fifteen minutes, or
          its oldest unpublished event has been more than five minutes old for
          ten minutes: people signing in for the first time are refused
          `mirror_stale`, and memberships removed or changed in auth have not
          reached records. Read its `publisher_batch_failed` lines, its
          instances and `/health`, then auth-db and the key service;
          `auth-events-lag` opened at 30 s or five minutes beside it.
        conditions:
          - name: "event outbox lag above five minutes for ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_events_outbox_lag" AND resource.type = "cloud_run_revision"
              threshold_value: 300
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_PERCENTILE_99"
              cross_series_reducer: "REDUCE_MAX"
          - name: "the publisher has completed no batch for fifteen minutes"
            absent:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_events_publisher_alive" AND resource.type = "cloud_run_revision"
              duration: "900s"
              cross_series_reducer: "REDUCE_SUM"
              group_by_fields: ["resource.label.service_name"]

      iap-unknown-key:
        display_name: "URGENT IAP assertion under a key the image does not pin (auth, tpa-api)"
        tier: p1
        urgent: true
        subject: "IAP assertion under an unpinned key: ${metric_or_resource.label.service_name}"
        # An outage of the browser's way in, the owner's first urgent kind: once
        # Google retires the old key every portal request is refused (the
        # re-check, 2026-10-05).
        documentation: >-
          auth or tpa-api refused a browser request because IAP's assertion
          was signed by a key missing from the set pinned in its image
          (R187's header check). Google has most likely rotated IAP's keys:
          rebuild both images with the current set and deploy them, or the
          portals stop answering once the old key is retired. A refusal with
          no rotation behind it is a forged or replayed assertion: read the
          service's lines. Fires in report mode too (IAP option B: the same
          `reason` on an `iap_report` line, nothing refused), so the re-pin
          comes before enforce could refuse anyone.
        conditions:
          - name: "any iap_unknown_key refusal"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/iap_unknown_key" AND resource.type = "cloud_run_revision"
              group_by_fields: ["resource.label.service_name"]

      # IAP option B (T-5073; the option B review's F2, with T-5080's complaint
      # about alert noise in mind): three policies over iap_not_ok, beside
      # iap-unknown-key (unknown_key alone, urgent) and iap-refusals (enforce
      # alone, urgent). A forged or malformed assertion pages urgent in either
      # mode; one that is missing, old or for the other site opens one normal
      # incident a day per service and site; and once a day a summary says what
      # enforce would have refused (drop it at enforce, infra/README.md).
      iap-forgery:
        display_name: "URGENT a forged or malformed IAP assertion (auth, tpa-api)"
        tier: p1
        urgent: true
        subject: "forged or malformed IAP assertion: ${metric_or_resource.label.service_name}"
        # Somebody wrote an assertion IAP never signed, or one in a shape IAP
        # never writes: in report mode it was still served.
        documentation: >-
          auth or tpa-api read an X-Edge-Iap-Assertion that IAP never signed or
          that is not in IAP's shape (IAP option B): a bad signature, another
          algorithm, a critical header, no key id, another issuer, a malformed,
          oversized or repeated header, bad times, a lifetime past 660 seconds,
          or no sub and email. web writes the header only from IAP's own, and
          the edge strips a caller's copy, so a caller inside the network wrote
          it, or Google changed its format. In report mode it was served. Read
          the service's iap_report or iap_refused lines (`reason`, `site`,
          `forwarded`, `original`) and the request lines with the same
          request_id. An unknown key id is iap-unknown-key's, not this.
        conditions:
          - name: "any forgery word in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/iap_not_ok" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("signature", "algorithm", "critical_header", "no_key_id", "issuer", "malformed", "oversized", "repeated", "times", "lifetime", "no_identity")
              group_by_fields: ["resource.label.service_name", "metric.label.site"]

      iap-mismatch:
        display_name: "a browser request's IAP assertion was missing, old or for the other site (auth, tpa-api)"
        tier: p2
        subject: "IAP assertion missing or mismatched: ${metric_or_resource.label.service_name}, ${metric_or_resource.label.site}"
        # Told when it opens, never when it closes, and held open for a day of
        # quiet, so a chronic harmless source opens one incident a day per
        # service and site (T-5080).
        notification_prompts: ["OPENED"]
        auto_close: "86400s"
        documentation: >-
          auth or tpa-api found a browser request whose IAP assertion was
          missing, expired, not yet valid, for another backend, beside the
          other site's origin, or whose check raised (IAP option B). In report
          mode nothing was refused; in enforce it was a 401. Read the service's
          iap_report or iap_refused lines: `reason` is the word, `site` the
          backend the request's origin names, and `forwarded` and `original`
          which header names arrived (infra/README.md, "The header check
          behind it", says what each means). A missing assertion on a browser
          path is a real finding (a caller inside the network, or the hop
          losing the header again, I-525), never noise; a slow upload's expiry
          shows by route. One incident a day per service and site at most.
        conditions:
          - name: "a missing, expired or mismatched assertion"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/iap_not_ok" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("missing", "expired", "not_yet_valid", "audience", "origin_mismatch", "error")
              alignment_period: "900s"
              group_by_fields: ["resource.label.service_name", "metric.label.site"]

      iap-refusals:
        display_name: "URGENT browser requests refused by the IAP check (auth, tpa-api)"
        tier: p1
        urgent: true
        subject: "browser requests refused by the IAP check: ${metric_or_resource.label.service_name}"
        # An outage of the portals' way in, as iap-unknown-key is: in enforce
        # a broken hop or an unpinned key refuses everyone. Silent in report
        # mode, which refuses nothing.
        documentation: >-
          More than ten browser requests refused by auth's or tpa-api's IAP
          check in five minutes (IAP option B, enforce). If staff, testers or
          the synthetic sign-ins are among them, the way back is report mode:
          iap_header_check_mode = "report" and a targeted apply of module.auth
          and module.tpa_api by someone signed in to Google Cloud, only on the
          decider's word (no rollback is pre-approved). Read the iap_refused
          lines' `reason` first: unknown_key means re-pin both images.
        conditions:
          - name: "more than ten refusals in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/iap_not_ok" AND resource.type = "cloud_run_revision"
                AND metric.labels.outcome = "refused"
              threshold_value: 10
              group_by_fields: ["resource.label.service_name"]

      # The report week's one message a day (the option B review's F2), on
      # R380's perimeter_dry_run pattern (its `perimeter-violations`): one
      # series, the day's total across auth and tpa-api, read in one
      # ten-minute window a day and told when it opens. A single series has
      # no labels, so the subject names none; the breakdown by service, site
      # and word is the week's table query in infra/README.md. It is what
      # enforce would have refused. Drop it at enforce (infra/README.md).
      iap-report-daily:
        display_name: "IAP report mode: what enforce would have refused (the day's count)"
        tier: p2
        subject: "IAP report mode: requests enforce would have refused in the last 24 hours"
        notification_prompts: ["OPENED"]
        documentation: >-
          IAP option B in report mode: in the 24 hours before about 14:00 UTC
          auth or tpa-api found browser requests that were not ok, and enforce
          would have refused them (the notification's observed value is the
          day's total across auth and tpa-api; no service, site or word is in
          it). One notification a day, at about 14:00 UTC, none on a day with
          nothing, and the incident closes by itself within about twenty
          minutes, untold. The breakdown by service, site and word is the
          week's table query in infra/README.md, "The header check behind it",
          which also says what each word means. This policy is dropped at
          enforce.
        conditions:
          - name: "requests not ok in the 24 hours before 14:00 UTC"
            promql:
              query: >-
                sum(increase(logging_googleapis_com:user_iap_not_ok{monitored_resource="cloud_run_revision"}[24h])) > 0
                and on() (hour() == 14 and minute() < 10)
              evaluation_interval: "300s"

      iap-pinned-keys-stale:
        display_name: "IAP keys pinned in an image are stale (auth, tpa-api)"
        tier: p2
        subject: "IAP keys pinned in an image are stale: ${metric_or_resource.label.service_name}"
        documentation: >-
          auth or tpa-api warned that the IAP keys pinned in its image are
          stale (R187's header check). Rebuild both images with the current
          key set and deploy them before Google retires the old key, or every
          browser request is refused (in enforce; in report mode, logged).
        conditions:
          - name: "any iap_pinned_keys_stale"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/iap_pinned_keys_stale" AND resource.type = "cloud_run_revision"
              group_by_fields: ["resource.label.service_name"]

      auth-lockouts:
        display_name: "sign-in lockouts"
        tier: p2
        documentation: >-
          More than 20 `423 locked` answers in five minutes: credential
          stuffing, most often. Look at the refused sign-ins by address in
          auth's own lines.
        conditions:
          - name: "more than 20 lockouts in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_lockouts" AND resource.type = "cloud_run_revision"
              threshold_value: 20

      # #202 (the review's R4: "password spraying is invisible"): a few tries
      # at each of many accounts trips no account's pause and no lockout
      # count. The estate-wide rate of refused password sign-ins is what a
      # spray moves; no label may name the account or the address it came
      # from (auth's per-address allowance answers 423, `auth-lockouts`).
      auth-password-spray:
        display_name: "URGENT refused password sign-ins surging (a password spray)"
        tier: p1
        urgent: true
        documentation: >-
          auth refused more than 30 password sign-ins (POST /auth/login answering
          401) in ten minutes across the estate: a password list being tried
          against many accounts, a few tries each, which no account's pause
          sees. Read auth's refused sign-ins by address in its own lines and
          the load balancer's log, and block the sources at Cloud Armor if
          they are not people mistyping (a bulk import of new logins, a broken
          client).
        conditions:
          - name: "more than 30 refused password sign-ins in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_login_failures" AND resource.type = "cloud_run_revision"
              threshold_value: 30
              alignment_period: "600s"

      # #202 (the review's R4, counted and never alerted): refused step-ups.
      # Five in fifteen minutes revoke one session (CONTRACT §4); more across
      # the estate is someone working at stolen sessions.
      auth-stepup-failures:
        display_name: "refused step-ups surging"
        tier: p2
        documentation: >-
          auth refused more than five step-ups (POST /auth/step-up answering
          401: a wrong code, password or passkey) in fifteen minutes across the
          estate. Each session is revoked after five of its own, so more than
          that is several sessions, or one person repeatedly, being pushed past
          the second check. Read auth's step-up lines and the sessions' owners
          in Admin -> Users.
        conditions:
          - name: "more than five refused step-ups in fifteen minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_stepup_failures" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "401"
              threshold_value: 5
              alignment_period: "900s"

      # R5105, R5107: the per-account pages, Part A's five alerts of the
      # design (orchestrator plans/lockout-settings-alerts-DESIGN.md), beside
      # the estate-wide `auth-lockouts` above, which stays. The estate
      # administrators and the person are emailed by auth itself, under its
      # caps; these are the on-call half. Every one reads
      # `auth_sign_in_protection`, and every one is normal: the urgent set is
      # the owner's (tests/infra/test_monitoring_shape.py, URGENT), and the
      # design's "urgent for a staff account's 30-day pause" waits for the
      # decider's word.
      auth-sign-in-ceiling:
        display_name: "an account hit the 30-day second-step limit"
        tier: p2
        subject: "an account hit the 30-day second-step limit: ${metric_or_resource.label.class}"
        documentation: >-
          Somebody holding an account's password entered so many wrong
          second-step codes that auth paused its sign-in for up to 30 days, and
          emailed the person and the estate administrators. The password is
          known to whoever did it. Read Admin -> Users and the audit log
          (lockout.started); the way back before the 30 days is a two-person
          factor reset.
        conditions:
          - name: "a 30-day second-step pause of an outside account"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "factor_ceiling" AND metric.labels.class = "outside"
              group_by_fields: ["metric.label.class"]

      # #202 (the review's row 33, the design's parked "urgent for a staff
      # account's 30-day pause", the decider's "some security risk or
      # something I do want to know right away"): a staff account's pages.
      auth-sign-in-staff-ceiling:
        display_name: "URGENT a staff account hit the 30-day second-step limit"
        tier: p1
        urgent: true
        documentation: >-
          Somebody holding a member of staff's password entered so many wrong
          second-step codes that auth paused the account's sign-in for up to 30
          days, and emailed the person and the estate administrators. The
          staff password is known to whoever did it. Read Admin -> Users and
          the audit log (lockout.started); have the person change the password
          now; the way back before the 30 days is a two-person factor reset.
        conditions:
          - name: "a staff account's 30-day second-step pause"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "factor_ceiling" AND metric.labels.class = "staff"

      auth-sign-in-staff-codes:
        display_name: "URGENT second-step codes guessed on a staff account"
        tier: p1
        urgent: true
        documentation: >-
          auth paused a member of staff's second step after wrong codes that
          followed a correct password, so whoever did it holds the password.
          The person and the estate administrators were emailed; read Admin ->
          Users and the audit log (lockout.started).
        conditions:
          - name: "a staff account's second-step pause"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "factor" AND metric.labels.class = "staff"

      auth-sign-in-repeated:
        display_name: "URGENT one account's second step paused three times in a day"
        tier: p1
        urgent: true
        subject: "one account's second step paused three times in a day: ${metric_or_resource.label.class}"
        documentation: >-
          auth paused the same account's second step for the third time in a
          day, each after a correct password: somebody holding the password is
          working at it. The person and the estate administrators were
          emailed; read Admin -> Users and the audit log.
        conditions:
          - name: "a third second-step pause of one account in a day"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "factor_repeated"
              group_by_fields: ["metric.label.class"]

      auth-sign-in-staff-password:
        display_name: "wrong passwords paused a staff account"
        tier: p2
        documentation: >-
          auth paused a member of staff's sign-in after wrong passwords. Anybody
          who knows the address can cause this, so the person was not emailed;
          the estate administrators were. Read auth's refused sign-ins and the
          audit log (lockout.started) for the account.
        conditions:
          - name: "a staff account's password pause"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "account" AND metric.labels.class = "staff"

      auth-sign-in-code-surge:
        display_name: "URGENT five or more second-step pauses in an hour"
        tier: p1
        urgent: true
        documentation: >-
          Five or more accounts' second steps were paused within an hour, each
          after a correct password: a leaked password list being worked
          through. Read the accounts in Admin -> Users and the audit log
          (lockout.started), and auth's refused sign-ins by address.
        conditions:
          - name: "five or more second-step pauses in an hour"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sign_in_protection" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("factor", "factor_repeated", "factor_ceiling")
              threshold_value: 4
              alignment_period: "3600s"

      auth-unhandled:
        display_name: "auth answered 500 (unhandled)"
        tier: p3
        subject: "auth answered 500: ${metric_or_resource.label.class}"
        documentation: >-
          An exception reached auth's catch-all handler (`unhandled`). The line
          names the class; the error-tracking policies say whether it is new.
        conditions:
          - name: "any unhandled"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_errors" AND resource.type = "cloud_run_revision"
                AND metric.labels.operation = "unhandled"
              group_by_fields: ["metric.label.class"]

      # R380 (the owner, 2026-10-17: "226 yes 1,2,3"; I-605): twice in a row,
      # never once. Beta's 51 of these in a week were one-off failures the
      # next run healed (records answering one 500, a slow first connection).
      # The module writes the condition as PromQL per job, over a window of
      # two of its schedules (modules/monitoring, `failed_twice`); the audit
      # jobs' urgent `audit-chain` and the PHI project's protected jobs still
      # open on one.
      jobs-failed:
        display_name: "a job failed twice in a row"
        tier: p2
        subject: "job failed twice in a row: ${metric_or_resource.label.job_name}"
        documentation: >-
          The same Cloud Run job's last two executions both failed after their
          retries: within a window of two of its schedules (a day for a job a
          person runs), two failed runs and no successful one. One failed run
          opens nothing, and its next run's success closes it; the run's own
          lines say why it failed. For tpa-jobs a failed run is any tenant not
          `ok`, or a run that could not list its tenants (tpa-jobs.md §3): its
          alert records say which. auth's three attended jobs
          (auth-bootstrap, auth-tag-credentials, auth-retag-bearer-key; a
          person runs each, R176) are here too (2026-10-11): their person is
          told on the console, and whoever is on call learns of a second
          failure. The audit jobs are in the urgent audit-chain policy, which
          opens on one.
        conditions:
          - name: "the same job failed twice in a row"
            failed_twice:
              jobs: ["migrate-auth", "auth-sweeper", "auth-bootstrap", "auth-tag-credentials", "auth-retag-bearer-key", "tpa-jobs-erisa-clocks", "tpa-jobs-nightly-anomalies", "tpa-jobs-stoploss-surveillance", "tpa-jobs-accumulator-reconcile", "tpa-jobs-workload-audit", "tpa-jobs-member-access"]

      # #202 (T-5080; the live read: 30 of its 33 incidents were Cloud
      # Scheduler's own UNAVAILABLE starting `auth-publish`, every minute,
      # and the next minute's start worked; it leaves with the publisher's
      # job, D-314). Retry-aware by cadence: a
      # schedule every one or two minutes opens on three failed starts in
      # fifteen minutes, the fifteen-minute erisa-clocks on two in an hour,
      # and an hourly or daily schedule on one (each is a run skipped).
      # Grouped by the scheduler job alone, so a mix of codes is one count.
      scheduler-failed:
        display_name: "a schedule could not start its job"
        tier: p2
        subject: "schedule could not start its job: ${metric_or_resource.label.job_id}"
        documentation: >-
          Cloud Scheduler failed to start a job: three times in fifteen minutes
          for a schedule every minute or two (`auth-publish` while D-314's
          switch keeps the publisher's job, the reset drains), twice in an hour for erisa-clocks, once for an hourly or
          daily schedule. The attempt's status says why (the scheduler job's
          AttemptFinished entries); PERMISSION_DENIED means row 8 or row 74 of
          the inventory (row 205 for the administrator-feed importer's) is not
          what the gate thinks it is, and UNAVAILABLE or INTERNAL is Cloud
          Scheduler's own, worth a support case once it persists.
        conditions:
          - name: "three failed starts in fifteen minutes of a schedule every minute or two"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = one_of("auth-publish", "auth-reset-drain", "crm-reset-drain")
              threshold_value: 2
              alignment_period: "900s"
              group_by_fields: ["resource.label.job_id"]
          - name: "two failed starts in an hour of erisa-clocks"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = one_of("erisa-clocks")
              threshold_value: 1
              alignment_period: "3600s"
              group_by_fields: ["resource.label.job_id"]
          - name: "a failed start of an hourly or daily schedule"
            threshold:
              # feed-ingest-everon-sync: the importer's schedule on beta
              # (feedingest.tf; D-181), named here so a schedule that cannot
              # start it pages as every other schedule's does. It exists only
              # with feed_ingest_enabled, and a paused schedule makes no
              # attempt; production-full builds none.
              # auth-reset-drain and crm-reset-drain (R5106): beta's two
              # reset drains, each named so a schedule that cannot reach its
              # target pages as the others do. auth's is an HTTP target, so a
              # refusal by Cloud Run's ingress or auth's own 401/403/404/429/5xx
              # is a failed attempt too, and so is a pass that runs past the
              # 30 s deadline (Cloud Run's 504; rework 1's S1); each exists only
              # with its switch.
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = one_of("nightly-anomalies", "stoploss-surveillance", "accumulator-reconcile", "workload-audit", "member-access", "auth-sweep", "feed-ingest-everon-sync")
              group_by_fields: ["resource.label.job_id"]

      # #202 (T-5080; I-5198): the one policy that mixed compliance codes,
      # lags, operational faults and pure information is four, by what each
      # code means (tpa_jobs/registry.py). A code in none of them opens
      # nothing (a new code is added here when the registry gains it); the
      # paging codes are `jobs-alerts-paging`'s.
      #
      # Operational faults: told when raised, p2.
      jobs-alerts:
        display_name: "a job raised an alert"
        tier: p2
        subject: "tpa-jobs ${metric_or_resource.label.job} raised ${metric_or_resource.label.code}"
        documentation: >-
          A tpa-jobs run or drain tick raised an operational alert from its
          registry (tpa_jobs/registry.py): a dead letter (an outbox row or a CRM
          transition that will never be sent), the revocation mirror stale for
          a run, more abandoned sign-ups to end in one tenant than the
          member-access sweep may, a catalogue the CRM cannot take (too large
          or invalid), or a drain tick's failed tenant. The incident's labels
          are the job and the alert's name; the run's own line carries the
          rest, never a body. A scheduled run's failed tenants are told by
          `jobs-failed`, on the second failed run in a row (R380). Lags are
          `jobs-lagging`, the compliance codes `jobs-compliance`.
        conditions:
          - name: "from a scheduled run"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_job"
                AND metric.labels.code = one_of("mirror_stale_run", "outbox_dead_letter", "crm_transition_dead", "member_access_mass_registration_end", "catalogue_too_large", "catalogue_invalid")
              group_by_fields: ["metric.label.job", "metric.label.code"]
          - name: "from a drain tick"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("tenants_failed", "mirror_stale_run", "outbox_dead_letter", "crm_transition_dead", "member_access_mass_registration_end", "catalogue_too_large", "catalogue_invalid")
              group_by_fields: ["metric.label.job", "metric.label.code"]

      # Lags: a drain raises one every tick it is behind, so held thirty
      # minutes, p2.
      jobs-lagging:
        display_name: "a job stayed behind for thirty minutes"
        tier: p2
        subject: "tpa-jobs ${metric_or_resource.label.job} behind: ${metric_or_resource.label.code}"
        documentation: >-
          A tpa-jobs drain or run raised a lag alert in every five minutes for
          thirty: the outbox (messages and webhooks waiting), the CRM lane's
          transitions, or the cut-off freeze behind its schedule
          (tpa_jobs/registry.py). Something downstream is refusing or slow: read
          the job's lines for the tenant's oldest row and the destination's
          answers (connectors' dead letters, the CRM lane's refusals). A
          `cutoff_freeze_behind` whose every tick answers ok is most often a
          group's month waiting for a person (records' RS-406: its cut-off was
          written after the month's instant, so the drain never freezes it):
          the operations portal's billing lists the waiting months; freeze the
          month there ("Freeze now"), or hide the group if it is a test. It
          closes once no tick raises it.
        conditions:
          - name: "a lag raised in every five minutes for thirty, from a run"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_job"
                AND metric.labels.code = one_of("outbox_lag", "crm_transition_lag", "cutoff_freeze_behind")
              duration: "1800s"
              group_by_fields: ["metric.label.job", "metric.label.code"]
          - name: "a lag raised in every five minutes for thirty, from a drain tick"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("outbox_lag", "crm_transition_lag", "cutoff_freeze_behind")
              duration: "1800s"
              group_by_fields: ["metric.label.job", "metric.label.code"]

      # Compliance codes: a standing finding, told once while it stands. The
      # job raises `erisa_breach_count` every run a clock is past: the
      # incident stays open while any run in the last 24 hours 30 minutes
      # raised it, so it is told when it first appears and closes a day after
      # the last run that raised it. 24 hours 30 minutes is inside the 25
      # Google alerts over for a log metric, and holds two nights of a daily
      # job. D-315 (2026-11-09): `workload_orphan` is `jobs-information`'s
      # (p3) until workload_audit leaves out the workloads that hold no
      # records grant by design (TP-369): the two it reports every night on
      # the live site are the CRM copy's partner client and feed-ingest's
      # workload, registered in auth's Admin -> Clients and holding no scope
      # that records keeps a grant for, so it could only ever stand open.
      jobs-compliance:
        display_name: "a job raised a compliance finding (a deadline breached)"
        tier: p2
        subject: "tpa-jobs ${metric_or_resource.label.job} compliance finding: ${metric_or_resource.label.code}"
        documentation: >-
          A tpa-jobs run raised a compliance finding: `erisa_breach_count` (a
          statutory deadline clock past its date: erisa_clocks). It stays open
          while runs keep raising it, and is told once, when it opens. Read
          the run's own line for the rows (never in this alert), then act on
          the breached claim. It closes a day after the last run that raised
          it. An orphaned workload (`workload_orphan`) is not here until
          TP-369: it is `jobs-information`'s, in the console.
        conditions:
          - name: "a compliance finding raised in the last 24 hours 30 minutes"
            promql:
              query: >-
                sum by (job, code) (increase(logging_googleapis_com:user_tpa_jobs_alerts{monitored_resource="cloud_run_job", code=~"erisa_breach_count"}[24h30m])) > 0
                or sum by (job, code) (increase(logging_googleapis_com:user_tpa_jobs_alerts{monitored_resource="cloud_run_revision", code=~"erisa_breach_count"}[24h30m])) > 0
              evaluation_interval: "300s"

      # Information: kept for the console and the website, told nobody (p3).
      # D-315: and `workload_orphan` until TP-369 (above).
      jobs-information:
        display_name: "a job reported information (skipped tenants, member access, orphans)"
        tier: p3
        subject: "tpa-jobs ${metric_or_resource.label.job} reported ${metric_or_resource.label.code}"
        documentation: >-
          A tpa-jobs run reported a fact nobody needs to act on at once: tenants
          skipped by design (`tenants_skipped`), the member-access sweep's
          count of logins held and lifted (`member_access_swept`), or its dry
          run (`member_access_dry_run`); and, until workload_audit leaves out
          the workloads that hold no records grant by design (TP-369), a
          workload auth holds with no grant in records, or the reverse
          (`workload_orphan`: the run's line names the principal and its
          kind; auth's Admin -> Clients and the operations portal's Machine
          credentials show both sides). Read in the console beside the run's
          summary; never notified.
        conditions:
          - name: "from a scheduled run"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_job"
                AND metric.labels.code = one_of("tenants_skipped", "member_access_swept", "member_access_dry_run", "workload_orphan")
              group_by_fields: ["metric.label.job", "metric.label.code"]
          - name: "from a drain tick"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("tenants_skipped", "member_access_swept", "member_access_dry_run", "workload_orphan")
              group_by_fields: ["metric.label.job", "metric.label.code"]

      jobs-alerts-paging:
        display_name: "URGENT a job raised a paging alert"
        tier: p1
        urgent: true
        subject: "tpa-jobs ${metric_or_resource.label.job} raised ${metric_or_resource.label.code}"
        documentation: >-
          A tpa-jobs alert whose registry entry pages: an anomaly at the
          `freeze` level (a security freeze), a CRM lane signature failure (a
          key rotation went wrong), or more logins to hold in one tenant than the
          member-access sweep may, so none were held. tpa-jobs.md §5.2, §5.6, §5.8.
        conditions:
          - name: "from a scheduled run"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_job"
                AND metric.labels.code = one_of("anomaly_freeze", "crm_signature_failure", "member_access_mass_end")
              group_by_fields: ["metric.label.job", "metric.label.code"]
          - name: "from a drain tick"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_alerts" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = one_of("anomaly_freeze", "crm_signature_failure", "member_access_mass_end")
              group_by_fields: ["metric.label.job", "metric.label.code"]

      jobs-partial-recurring:
        display_name: "a job ran partial twice"
        tier: p2
        subject: "tpa-jobs ${metric_or_resource.label.job} ran partial twice"
        documentation: >-
          A job reported `partial` tenants twice within a day and a half hour
          (tpa-jobs.md §6: one slow run is a slow run, two is a capacity
          problem). The window is 24 h 30 min, inside the 25 hours Google
          alerts over for a log metric, so a daily job's two consecutive
          nights (24 hours apart) are both in it when the second ends: for
          stoploss_surveillance this is `stoploss_partial_recurring`, the
          tenant outgrowing its window (§5.3), told for the job, since no
          label may name the tenant. A sub-daily job opens on any two partial
          runs in the window.
        conditions:
          - name: "two partial runs in 24 hours 30 minutes"
            promql:
              query: >-
                sum by (job) (increase(logging_googleapis_com:user_tpa_jobs_alerts{monitored_resource="cloud_run_job", code="tenants_partial"}[24h30m])) >= 2
                or sum by (job) (increase(logging_googleapis_com:user_tpa_jobs_alerts{monitored_resource="cloud_run_revision", code="tenants_partial"}[24h30m])) >= 2
              evaluation_interval: "300s"

      drain-raised:
        display_name: "a drain tick raised"
        tier: p2
        subject: "drain tick raised: ${metric_or_resource.label.job} (${metric_or_resource.label.class})"
        documentation: >-
          Three or more ticks of tpa-jobs-drains raised instead of finishing
          in fifteen minutes: most often a scope never granted or an address
          that answers nothing. The loop
          keeps ticking and delivers nothing until it is fixed.
        conditions:
          # #202: three in fifteen minutes (a drain ticks every minute; one
          # transient raise opened it, 10-24 x4 in one outage).
          - name: "three or more ticks raised in fifteen minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_jobs_drain_raised" AND resource.type = "cloud_run_revision"
              threshold_value: 2
              alignment_period: "900s"
              group_by_fields: ["metric.label.job", "metric.label.class"]

      # tpa-jobs.md §5.5's "grows on three consecutive days" needs two days
      # of history; Google alerts on 25 hours of a log metric. So the night
      # is compared with the night before: the total open count the run left
      # above yesterday's. One night of growth, not three (docs/infra/
      # monitoring.md §6). Windows of 90 minutes around each run, offset 23
      # hours: 24 h 30 min of lookback in all.
      accumulator-backlog-growing:
        display_name: "accumulator reconciliations outstanding grew"
        tier: p3
        subject: "accumulator backlog grew: ${metric_or_resource.label.job}"
        documentation: >-
          accumulator_reconcile left more reconciliations open tonight than
          it did the night before (the sum of every tenant's open count).
          tpa-jobs.md §5.5 asks for growth on three consecutive days; Google
          keeps 25 hours of a log metric for alerting, so this compares two
          nights and opens on the first night of growth. Read the run's
          summary and the reconciliations in the operations portal. Quiet
          while an environment pauses the sweep's schedule.
        conditions:
          - name: "tonight's open count above last night's"
            promql:
              query: >-
                sum by (job) (increase(logging_googleapis_com:user_tpa_jobs_accumulator_backlog_sum{monitored_resource="cloud_run_job"}[90m]))
                > sum by (job) (increase(logging_googleapis_com:user_tpa_jobs_accumulator_backlog_sum{monitored_resource="cloud_run_job"}[90m] offset 23h))
              evaluation_interval: "300s"

      # 2026-10-11: the uptime checks on the IAP hosts end on Google's sign-in
      # page and never reach web, and `canary-5xx` needs five errors in five
      # minutes. At beta's traffic a service can be down for an hour with
      # neither opening. This opens when everything a core service answered
      # for ten minutes was a 5xx, whatever the volume (two at least). A
      # scale-to-zero service with no traffic at all is down for nobody; a
      # warm one is the module's `no_instance` policy (warm_services).
      # PC-OR-1 (2026-10-31, the review's L4): ops-web, the operations
      # portal's container, beside web; a root that builds none matches none.
      backend-down:
        display_name: "URGENT a core service answered only errors (web, ops-web, auth, tpa-api)"
        tier: p1
        urgent: true
        subject: "answering only errors: ${metric_or_resource.label.service_name}"
        documentation: >-
          Every request web, ops-web, auth or tpa-api answered in the last ten minutes
          was a 5xx (two or more, none answered otherwise): the service is
          down for whoever is using it, however few they are. Read the
          service's system log (`canary-startup`) and its ERROR lines; a
          502 or 504 from tpa-api is most often records or auth behind it
          (their own policies). The uptime checks cannot see this: behind IAP
          they end on Google's sign-in page.
        conditions:
          - name: "only 5xx for ten minutes, at least two"
            promql:
              query: >-
                sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name=~"web|ops-web|auth|tpa-api", response_code_class="5xx"}[10m])) >= 2
                unless sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name=~"web|ops-web|auth|tpa-api", response_code_class!="5xx"}[10m])) > 0
              evaluation_interval: "60s"

      tpa-api-latency:
        display_name: "tpa-api p95 latency above 2 s (its own request line)"
        tier: p3
        subject: "tpa-api p95 above 2 s"
        documentation: >-
          tpa-api's 95th percentile time to answer stayed above two seconds
          for ten minutes, read from its own request line without the streams,
          the file transfers and the rows that wait on the model
          (`tpa_api_latency`). `canary-latency` cannot see tpa-api in beta,
          which leaves it out for its streams. Check records' latency and the
          hop to it, then auth's exchange.
        conditions:
          - name: "p95 above 2000 ms for ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/tpa_api_latency" AND resource.type = "cloud_run_revision"
              threshold_value: 2000
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_PERCENTILE_95"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.service_name"]

      # 2026-10-11: Cloud SQL's own signals for auth-db (none were read
      # before). The instance by name, so a scratch instance never opens it.
      # Beta drops the down policy while the instance is stopped on purpose
      # (database_activation_policy NEVER, B8).
      auth-db-down:
        display_name: "URGENT auth-db is down"
        tier: p1
        urgent: true
        documentation: >-
          Cloud SQL reported auth-db not up for five minutes: nobody can sign
          in. Check the instance in the console (a maintenance or a failed
          restart), then its operations. auth's own `auth-database` opens
          beside it once auth's readiness check fails.
        conditions:
          - name: "database/up below 1 for five minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/up" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":auth-db")
              comparison: "COMPARISON_LT"
              threshold_value: 1
              duration: "300s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_MAX"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      auth-db-disk:
        display_name: "auth-db disk above 85%"
        tier: p2
        documentation: >-
          auth-db's disk has stayed above 85 percent full for ten minutes.
          Automatic growth stops at the instance's disk_autoresize_limit
          (var.sizing); raise the limit or the disk before it fills, when the
          instance stops taking writes.
        conditions:
          - name: "disk/utilization above 0.85 for ten minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/disk/utilization" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":auth-db")
              threshold_value: 0.85
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_MEAN"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      # D-147: the model vendor, as tpa-api's forms reach it. Only the vendor's
      # own failures (a 5xx, a 429, no answer, a 400); a refusal or an answer
      # the gateway's checks set aside is the model's content, not an outage.
      model-vendor-errors:
        display_name: "model-gateway: the model vendor is failing"
        tier: p2
        documentation: >-
          The model vendor failed three or more of model-gateway's calls, and
          more than a fifth of them, in fifteen minutes (vendor_error,
          vendor_busy, vendor_unavailable or vendor_rejected; the incident
          names none). The Ask lanes say "try again", New plan's papers
          reader fails. Read the vendor's status page, then the gateway's
          lines for the code; vendor_rejected is most often a request the
          vendor will not take (its size), vendor_busy its rate limit.
        conditions:
          - name: "vendor failures on three calls or more, over a fifth of calls, in fifteen minutes"
            promql:
              query: >-
                sum(increase(logging_googleapis_com:user_model_gateway_calls{monitored_resource="cloud_run_revision", code=~"vendor_.+"}[15m])) >= 3
                and sum(increase(logging_googleapis_com:user_model_gateway_calls{monitored_resource="cloud_run_revision", code=~"vendor_.+"}[15m]))
                > 0.2 * sum(increase(logging_googleapis_com:user_model_gateway_calls{monitored_resource="cloud_run_revision"}[15m]))
              evaluation_interval: "60s"

      # D-147: SendGrid (email) and the text vendor, as auth's messenger
      # reaches them. D-335 (the owner, 2026-11-12: "I need a way to ensure
      # 100% this works and we can get a critical alert if they cant"): p1,
      # at five where it was three. The ladder is 5, 10, 20, 40, 80 and 160 s
      # now (auth-notary auth/workers/messenger.py), so one message failing
      # three sends in a row is 15 s of trouble and five is 75 s: five is a
      # person who has waited over a minute with no code, or five people at
      # once, never one blip. On the two texting outages (2026-11-09
      # 15:10-15:18Z, 2026-11-11 01:47-01:53Z; every failure `unreachable` on
      # sms) the counter read 12 and 7, and reached five at the fifth send's
      # failure, 74 s after the first on both days; in the six weeks read
      # (from 2026-10-01) it read nothing else, on either lane.
      sign-in-message-vendor:
        display_name: "URGENT sign-in messages: the email or text vendor is failing"
        tier: p1
        urgent: true
        subject: "sign-in messages not going out: the ${metric_or_resource.label.lane} vendor is failing"
        documentation: >-
          auth's messenger had five or more sends refused or unanswered by a
          vendor or the network in fifteen minutes, on one channel (the
          incident's `lane`: sms is the text vendor, email SendGrid): members
          and brokers waiting for a texted sign-in code, an invitation or a
          reset are not getting it, and a texted code dies with its
          five-minute challenge. Read auth-outbox-publisher's
          `message_not_sent` lines for the reason: unreachable or no_answer
          is the path (the NAT, `nat-port-exhaustion`, and on sms the
          auth_twilio firewall rule); vendor_busy or vendor_unavailable the
          vendor's status page; vendor_refused with an HTTP 401 or 403 in the
          row's last error a revoked or narrowed key. `auth-messages-lag` and
          `auth-messages-stalled` may be open beside it.
        conditions:
          - name: "five vendor failures or more on a channel in fifteen minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_message_vendor_failures" AND resource.type = "cloud_run_revision"
              threshold_value: 4
              alignment_period: "900s"
              group_by_fields: ["metric.label.lane"]

      # R572 (I-838, I-843; the portal review's §5 items 6 and 7): the members'
      # day of texted codes is spent and auth is refusing codes, the cost lever
      # of SMS pumping once the portal is open. p2: the ceilings are already the
      # brake.
      auth-texted-codes-ceiling:
        display_name: "texted codes refused: the estate's daily ceiling is spent"
        tier: p2
        subject: "texted codes refused at the estate's ceiling: ${metric_or_resource.label.class}"
        documentation: >-
          auth refused a member's texted code because the estate's day is spent
          (auth's `sms_codes_estate_ceiling`, outcome refused; the incident's
          `class` says which ceiling). Soft: past auth_sms_codes_estate_per_day
          (auth's AUTH_SMS_CODES_ESTATE_PER_DAY, 2000 by default) only a
          person's first code of their UTC day still goes, so a member who
          signs in once still gets a code and a second code waits for the day
          to turn. Hard: past twice the setting no code goes, and only people
          with another method sign in until the day turns. Either a pumping run
          behind stuffed passwords (read auth-password-spray and
          auth-sign-in-code-surge beside it, the text vendor's console for the
          countries and spend, and auth's refused sign-ins by address) or real
          growth past the setting. The brake beyond the ceilings is IAP back on
          the portal host (infra/README.md, "Putting IAP back").
        conditions:
          - name: "any code refused at the estate's ceiling in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sms_codes_estate_ceiling" AND resource.type = "cloud_run_revision"
              alignment_period: "600s"
              group_by_fields: ["metric.label.class", "metric.label.code"]

      # auth-notary a199649 (head cbe9e57): the applicants' pool spent. Enroll's
      # applicants get no set-up code until the UTC day turns, and members are
      # untouched. p2: enrollment waits, nobody's data is at risk.
      auth-registration-codes-ceiling:
        display_name: "applicants' set-up codes refused: their daily ceiling is spent"
        tier: p2
        subject: "applicants' set-up codes refused at their ceiling: ${metric_or_resource.label.code}"
        documentation: >-
          auth refused an Enroll applicant's set-up code because the applicants'
          day is spent (auth's `sms_codes_registration_ceiling`;
          AUTH_SMS_CODES_REGISTRATION_PER_DAY, 500 by default). Until the UTC
          day turns, nobody can finish a registration that needs a texted code;
          members' codes count apart and still go. Either a run of fake
          registrations pumping texts (read Enroll's join host's request log and
          the text vendor's console) or real enrollment past the setting.
        conditions:
          - name: "any applicant's code refused at the ceiling in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_sms_codes_registration_ceiling" AND resource.type = "cloud_run_revision"
              alignment_period: "600s"
              group_by_fields: ["metric.label.code"]

      # O244's F1 (auth-notary 4aced85, head cbe9e57): while the breach list
      # gives no answer, nobody signs in and no password is set. p2 (PagerDuty at
      # low urgency, Slack): the refusal is the safe side, so it is an outage of
      # sign-in to fix promptly, not a breach.
      auth-breach-corpus-unavailable:
        display_name: "sign-ins refused: the breached-password list gives no answer"
        tier: p2
        subject: "breached-password list not answering: ${metric_or_resource.label.class}"
        documentation: >-
          auth's lookup in the full breached-password list gave no answer in two
          seconds, or its read failed (auth's `breach_corpus_unavailable`; the
          incident's `class`: timeout or read, and `code`: login or set). auth
          refuses rather than pass a password unchecked, so while this fires no
          one signs in with a password and no password is set: everyone sees
          auth's 503. Read auth's `/ready` (it holds the corpus file to the one
          the revision opened), the corpus mount and its bucket, and auth's
          request service's instances and memory; a new revision whose mount is
          missing or short is the first suspect.
        conditions:
          - name: "any lookup refused for want of an answer in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/auth_breach_corpus_unavailable" AND resource.type = "cloud_run_revision"
              alignment_period: "300s"
              group_by_fields: ["metric.label.class", "metric.label.code"]

      # #202 (TP-152): the PHI project's two change alarms, here too, p2 and
      # told when they open (every apply that touches monitoring opens each
      # once). Counted over thirty minutes, so one apply is one incident.
      monitoring-changed:
        display_name: "an alert policy or notification channel changed"
        tier: p2
        subject: "alert policy or channel changed: ${metric_or_resource.label.operation}"
        documentation: >-
          An alert policy or a notification channel in the app project was created,
          changed or deleted, a channel verified, or a snooze made or changed
          (the Admin Activity log; the incident's label is the method). The
          platform group may edit alerts here (roles/monitoring.editor, D-135),
          and an apply of the catalogue changes them too, so each apply opens
          this once, as expected. Read the project's Admin Activity log for the
          entry: who made it and what changed. A policy whose condition became
          a log match, a channel that is not the catalogue's, a snooze nobody
          announced, or this policy itself edited, snoozed or disabled is a
          finding; the next apply puts Terraform's policies back.
        conditions:
          - name: "a policy or channel change in the Admin Activity log"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/monitoring_changes" AND resource.type = "audited_resource"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a policy or channel change in the Admin Activity log (on global)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/monitoring_changes" AND resource.type = "global"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]

      log-counters-changed:
        display_name: "a log metric changed"
        tier: p2
        subject: "log metric changed: ${metric_or_resource.label.operation}"
        documentation: >-
          A log-based metric in the app project was created, changed or deleted (the
          Admin Activity log; the incident's label is the method). The counters
          are what this project's alerts read, so a counter whose filter was
          narrowed or emptied silences its alert; an apply of the catalogue
          changes them too. Read the project's Admin Activity log for the
          entry: who made it and what changed. A change nobody announced, or
          one to `monitoring_changes` or `log_metric_changes` themselves, is a
          finding; the next apply puts the catalogue's counters back.
        conditions:
          - name: "a log metric change in the Admin Activity log (on metric)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "metric"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on audited_resource)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "audited_resource"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on global)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "global"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]


  # ---------------------------------------------------------------------------
  # The PHI project: records and its jobs, connectors. Inside the perimeter, so
  # everything about them is made here and read here (docs/infra/monitoring.md
  # §1). No other project's scope includes this one.
  # ---------------------------------------------------------------------------
  phi:
    log_metrics:
      errors:
        description: >-
          ERROR lines of records, its jobs and connectors, one per line. The
          error group: service, exception class, catalogue operation, the
          CONTRACT §7 code and the SQLSTATE, the three exception facts the
          gateway permits and no fourth (records-service docs/04 §5.2).
        filter: |
          (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
          AND jsonPayload.service:*
          AND jsonPayload.level="ERROR"
        labels:
          service: 'EXTRACT(jsonPayload.service)'
          class: 'EXTRACT(jsonPayload.exc.class)'
          operation: 'EXTRACT(jsonPayload.op)'
          code: 'EXTRACT(jsonPayload.code)'
          sqlstate: 'EXTRACT(jsonPayload.exc.sqlstate)'

      records_refusals:
        description: >-
          Every refusal the gateway answers (records/gates `refused`): which
          gate, which CONTRACT §7 code, which operation. The canary's "gate
          failures that are not 403 denied or 401 token_expired" is this
          metric (docs/pipeline.md §5.1).
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="refused"
        labels:
          gate: 'EXTRACT(jsonPayload.gate)'
          code: 'EXTRACT(jsonPayload.code)'
          operation: 'EXTRACT(jsonPayload.op)'

      records_rate_limited:
        description: >-
          Gate 8's rate limiter refusing a call (`rate limited`), by operation.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="rate limited"
        labels:
          operation: 'EXTRACT(jsonPayload.op)'

      records_critical:
        description: >-
          The lines that mean the gateway is failing its promise: a refusal's
          audit rows did not land (`audit flush failed`), the database did not
          answer (`database unreachable`), and since the records limit
          (2026-10-24, D-180; records 624206d9, SPEC §7.3, §7.4) the meter
          could not count, so the call was refused (`velocity meter failed`),
          or a freeze's row could not be written, so the next call is judged
          again rather than refused by the stored freeze (`velocity freeze
          unwritten`). URGENT.
        filter: |
          (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
          AND jsonPayload.service="records"
          AND jsonPayload.message=~"^(audit flush failed|database unreachable|velocity meter failed|velocity freeze unwritten)$"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.message, "^(audit flush failed|database unreachable|velocity meter failed|velocity freeze unwritten)$")'

      records_mirror_problems:
        description: >-
          The mirror's warnings and errors: the JWKS fetch (gate 2), the event
          feed and the revocation feed (gate 3). For the "is it current"
          dashboard; the lag gauges records-service docs/04 §5.3 lists are not
          on any line yet.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND (jsonPayload.level="WARNING" OR jsonPayload.level="ERROR")
          AND (jsonPayload.gate=2 OR jsonPayload.gate=3)
          AND NOT jsonPayload.message="refused"
        labels:
          gate: 'EXTRACT(jsonPayload.gate)'

      # O137, RS-330, I-510: records' chain-head job logs `chain_head_exists`
      # at WARNING when the latest closed day's head was already in the vault
      # on the job's first attempt: somebody wrote it before this run
      # (records/audit/chain_head.py `_publish`, on records master since
      # 97f03648). Records writes its level as `level`, never `severity`, so
      # the filter reads jsonPayload.level, as RS-330 says it must. The
      # tenant on the line is never read.
      records_chain_head_exists:
        description: >-
          A chain head found already in the vault for the latest closed day on
          the records-chain-head job's first attempt (`code`
          `chain_head_exists` at `level` WARNING; the same code at INFO, for an
          earlier day, a retry or a backfill, is not counted).
        filter: |
          resource.type="cloud_run_job"
          AND resource.labels.job_name="records-chain-head"
          AND jsonPayload.code="chain_head_exists"
          AND jsonPayload.level="WARNING"

      # The records limit (2026-10-24, RS-02 slice 1; the owner's R-1 and R-7,
      # the orchestrator's OD-4, OD-6, OD-9 and OD-21 under the owner's "build
      # it"; records 624206d9, OWNER-R3-507, -508; the workspace's
      # security-watch SPEC §7; D-180). Records writes `level`, never
      # `severity`, and these filters read neither: each line is matched by its
      # `message`. Every label is a closed REGEXP_EXTRACT alternation, so a
      # value off its list reads empty: `role` is one of the twelve staff role
      # names records meters (records' `velocity.DEFAULT_ROLE_LIMITS`), never a
      # person (OD-4's (b): "The role name may be a metric label"). The
      # principal and tenant on each line are never read.
      records_velocity:
        description: >-
          A state change of the records limit (records' `velocity` line, SPEC
          §7.1): one staff person's reads crossed a line, and which (`code`:
          `velocity_flag`, `velocity_hold` or `velocity_freeze`), whether
          records enforced it or only reported it (`outcome`, the line's
          `decision`: `enforce` or `report`), and the role whose limit applied
          (`role`). Never the person, a member, the measure or the count.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="velocity"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.code, "^(velocity_flag|velocity_hold|velocity_freeze)$")'
          outcome: 'REGEXP_EXTRACT(jsonPayload.decision, "^(enforce|report)$")'
          role: 'REGEXP_EXTRACT(jsonPayload.role, "^(claims_examiner|claims_supervisor|eligibility_specialist|member_services|care_navigator|ops_agent|ops_supervisor|ops_admin|finance|tpa_admin|compliance_officer|plan_administrator)$")'

      records_velocity_settings_changes:
        description: >-
          A TPA administrator's saved change to the records limit (records'
          `velocity settings changed`, SPEC §7.2), one per changed field:
          which way it moves the limit (`direction`: `raise` loosens it, a
          figure or a multiplier up or the mode toward less enforcement;
          `lower` tightens it; RS-495), and the role a per-role figure belongs
          to (`role`, empty for a tenant setting). Never the value, the
          administrator or the tenant.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="velocity settings changed"
        labels:
          direction: 'REGEXP_EXTRACT(jsonPayload.direction, "^(raise|lower)$")'
          role: 'REGEXP_EXTRACT(jsonPayload.role, "^(claims_examiner|claims_supervisor|eligibility_specialist|member_services|care_navigator|ops_agent|ops_supervisor|ops_admin|finance|tpa_admin|compliance_officer|plan_administrator)$")'

      # T4 (PLAN §5, panels 4 and 11): two reads the hosted security page
      # charts, from records' "operation served" line (records/gates/
      # g8_bind.py), which names the operation, the door and the decision.
      records_reveals:
        description: >-
          A reveal records served (`operation served` for
          `eligibility.reveal` or `network.reveal_field`, the two operations
          that reveal), by operation. Who revealed what is in the audit chain
          and the ops portal's Access limits, never here.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="operation served"
          AND jsonPayload.op=~"^(eligibility[.]reveal|network[.]reveal_field)$"
        labels:
          operation: 'REGEXP_EXTRACT(jsonPayload.op, "^(eligibility\\.reveal|network\\.reveal_field)$")'

      records_staff_member_reads:
        description: >-
          A member read records served to staff (`operation served` at a staff
          door, `door_internal`, `door_agent`, `door_compliance` or
          `door_finance`, for one of the twelve operations whose records entry
          decides a read or a list of a member), by operation: the hosted
          security page's reads by hour, where night activity shows. Never
          the member, the person or the tenant; an after-hours flag on a
          tenant's own hours is a later slice's (S6).
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="records"
          AND jsonPayload.message="operation served"
          AND jsonPayload.door=~"^door_(internal|agent|compliance|finance)$"
          AND jsonPayload.op=~"^(eligibility[.]get_member|eligibility[.]list_members|eligibility[.]search_members|eligibility[.]member_coverage|eligibility[.]member_id_card|eligibility[.]member_card_view|claims[.]accumulators|claims[.]list_other_coverages|contactcenter[.]member|contactcenter[.]member_coverage|contactcenter[.]member_balances|implementations[.]enrollment_provenance)$"
        labels:
          operation: 'REGEXP_EXTRACT(jsonPayload.op, "^(eligibility\\.get_member|eligibility\\.list_members|eligibility\\.search_members|eligibility\\.member_coverage|eligibility\\.member_id_card|eligibility\\.member_card_view|claims\\.accumulators|claims\\.list_other_coverages|contactcenter\\.member|contactcenter\\.member_coverage|contactcenter\\.member_balances|implementations\\.enrollment_provenance)$")'

      connectors_passes:
        description: >-
          One per pass of the delivery loop: the line of pass counters
          (connectors/loop.py LoopStats.metrics()), matched whole. It is the
          loop's heartbeat, and the regex pins the line's format: a changed
          format stops matching, which trips the stalled alert instead of
          reading as zero (tests/connectors/test_monitoring_lines.py).
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="connectors"
          AND jsonPayload.outcome="pass"
          AND jsonPayload.message=~"^connectors_deliveries_total=[0-9]+ connectors_delivered_total=[0-9]+ connectors_duplicate_total=[0-9]+ connectors_retried_total=[0-9]+ connectors_dead_total=[0-9]+ connectors_claim_empty_total=[0-9]+ connectors_destination_refused_total=[0-9]+ connectors_envelope_unsigned_total=[0-9]+ connectors_paused_skipped_total=[0-9]+$"

      connectors_deliveries:
        description: >-
          One per send attempt (connectors.md §6 `deliveries_total`), by lane,
          outcome and error code. The destination label connectors.md lists is
          not carried: it is not on the label allowlist. The pass counters are
          cumulative since the process started, so the alerts count these
          lines instead.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="connectors"
          AND jsonPayload.message=~"^delivery lane=[a-z_]+ destination="
        labels:
          lane: 'REGEXP_EXTRACT(jsonPayload.message, "^delivery lane=([a-z_]+) ")'
          outcome: 'EXTRACT(jsonPayload.outcome)'
          code: 'EXTRACT(jsonPayload.reason)'

      connectors_dead_letters:
        description: >-
          One per row settled dead (`dead letter row=… destination=…`), by
          error code. The row and the destination on the line are never read.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.service="connectors"
          AND jsonPayload.outcome="dead"
          AND jsonPayload.message=~"^dead letter row="
        labels:
          code: 'EXTRACT(jsonPayload.reason)'

      perimeter_violations:
        description: >-
          A VPC Service Controls violation logged in this project, dry run or
          enforced: the reason, the service called and whether it was dry run.
          The same entries the audit sink sends to the vault.
        filter: |
          protoPayload.metadata."@type"="type.googleapis.com/google.cloud.audit.VpcServiceControlAuditMetadata"
        labels:
          code: 'EXTRACT(protoPayload.metadata.violationReason)'
          service: 'EXTRACT(protoPayload.serviceName)'
          outcome: 'EXTRACT(protoPayload.metadata.dryRun)'

      # D-138 (2026-10-11; TP-152): the PHI project's alert editors change and
      # silence existing policies and make nothing new (tpaAlertEditor, row
      # 168), and an edit of an existing policy is the residual: its condition
      # can still be rewritten. So every change to a policy or a channel
      # pages, from the Admin Activity audit log, which is always on, free and
      # copied to the vault. The method names are the filter; the method is
      # the one label (nine fixed strings), and who made the change, and
      # what it was, stay in the entry: no principal, caller or request field
      # is read (the module refuses them by name).
      # A snooze counts too (the re-review, 2026-10-11): silencing is the
      # step before an unseen edit, so a snooze made or changed pages, as
      # the edit does, except one that covers this alarm's own policy, which
      # silences the incident its own entry opens (docs/infra/monitoring.md
      # §7, the three silent changes). Snoozes have no delete: one ends by an update of its
      # interval, UpdateSnooze. CreateSnooze and UpdateSnooze are Admin
      # Activity entries (Cloud Monitoring's audit logging page); Get and
      # List are Data Access, never read here.
      monitoring_changes:
        description: >-
          A change to this project's alert policies, notification channels or
          snoozes in the Admin Activity audit log: a policy created, updated
          or deleted, a channel created, updated, deleted or verified, a
          snooze created or updated (an update is also how one is ended). By
          method alone; the entry says who and what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="monitoring.googleapis.com"
          AND (protoPayload.methodName="google.monitoring.v3.AlertPolicyService.CreateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.UpdateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.DeleteAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.CreateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.UpdateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.DeleteNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.VerifyNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.CreateSnooze"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.UpdateSnooze")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

      # D-142 (the owner, 2026-10-11: "Yes, with an alert"): grp-platform-admin
      # adds and changes this project's log metrics (tpaLogMetricWriter, row
      # 174), and every change sends an alert so it is always visible. The
      # three Admin Activity methods of MetricsServiceV2 (Cloud Logging's
      # audit logging page: CreateLogMetric, UpdateLogMetric, which also
      # creates one that does not exist, and DeleteLogMetric) are the filter,
      # and the method the one label, as monitoring_changes'. Who and what
      # stay in the entry. An apply of this catalogue opens it too.
      log_metric_changes:
        description: >-
          A change to this project's log-based metrics in the Admin Activity
          audit log: a log metric created, updated or deleted. By method
          alone; the entry says who and what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="logging.googleapis.com"
          AND (protoPayload.methodName="google.logging.v2.MetricsServiceV2.CreateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.UpdateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.DeleteLogMetric")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

      scheduler_failures:
        description: >-
          A Cloud Scheduler attempt in this project that finished in error, by
          status code; the scheduler job is the resource's job_id.
        filter: |
          resource.type="cloud_scheduler_job"
          AND jsonPayload."@type"="type.googleapis.com/google.cloud.scheduler.logging.AttemptFinished"
          AND severity>=ERROR
        labels:
          code: 'EXTRACT(jsonPayload.status)'

    error_metrics:
      errors:
        group_by: [service, class]
        resource_types: [cloud_run_revision, cloud_run_job]

    alert_policies:
      records-critical:
        display_name: "URGENT records: audit flush failed or database unreachable"
        tier: p1
        urgent: true
        subject: "records: ${metric_or_resource.label.code}"
        documentation: >-
          The gateway logged `audit flush failed` (a refusal's audit rows did
          not land: the chain has a hole) or `database unreachable` (tpa-db did
          not answer). Check tpa-db, its Private Service Connect endpoint and
          the IAM login; then the refusals around the time for the hole.
        conditions:
          - name: "from the service"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_critical" AND resource.type = "cloud_run_revision"
              group_by_fields: ["metric.label.code"]
          - name: "from a job"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_critical" AND resource.type = "cloud_run_job"
              group_by_fields: ["metric.label.code", "resource.label.job_name"]

      audit-chain:
        display_name: "URGENT audit chain (records)"
        tier: p1
        urgent: true
        documentation: >-
          records-chain-head writes each tenant's closed-day chain head into
          the vault, create-only (records-service docs/04 §6.1). It failed or
          its schedule could not start it, so a closed day's head is not in
          the vault, and nothing yet compares a head with the chain (RS-04).
          The command is on records master since 97f03648; an image older
          than that has no `chain-head` and fails every run. A head found
          already there is `chain-head-exists` (normal), not this.
        conditions:
          - name: "the chain head's execution failed"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
                AND metric.labels.result = "failed"
                AND resource.labels.job_name = "records-chain-head"
          - name: "its schedule could not start it"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = "records-chain-head"

      # 2026-10-11 (the alert-gaps review, finding 3): out of the urgent
      # audit-chain into a normal policy of its own. Records logs it at
      # WARNING whenever a run's first attempt finds the latest closed day's
      # head already written, which a person's rerun of the job without
      # --date also does, for every tenant at once; urgent, that rerun paged.
      chain-head-exists:
        display_name: "a chain head was already in the vault"
        tier: p2
        documentation: >-
          records-chain-head found the latest closed day's head already in the
          vault on its first attempt (records' `chain_head_exists` at WARNING;
          O137, RS-330). Either somebody wrote it before this run, which is
          what O137 watches for, or a person reran the job (without --date it
          finds every tenant's head it wrote that morning), or it is the
          autumn clock change, when a Pacific-time tenant's latest closed day
          repeats. Check who ran the job and when before treating it as
          tampering; nothing yet compares a head with the chain (RS-04).
        conditions:
          - name: "the latest day's head was already in the vault"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_chain_head_exists" AND resource.type = "cloud_run_job"

      # The records limit's pages (2026-10-24, D-180; OD-4: a freeze pages
      # URGENT on the PHI project's "TPA beta · Member records" escalation; a
      # hold pages normal; a flag pages nobody; OD-9 as amended for RS-495 and OD-21: a
      # raise pages URGENT, a lowering normal). A freeze is the owner's
      # "security freeze" (docs/infra/monitoring.md §9, 2026-09-24). Each page
      # names a role at most, never a person or a member: who and why are in
      # the ops portal's Compliance → Access limits, behind records' own rules.
      records-velocity-freeze:
        display_name: "URGENT records limit: a staff account was frozen"
        tier: p1
        urgent: true
        subject: "records limit: a ${metric_or_resource.label.role} account was frozen"
        documentation: >-
          Records froze one staff person in one tenant: their reads reached
          twice their role's limit (or a role whose limit is 0 opened a
          member), and records now refuses every call they make, on every
          instance, until two people clear it. First steps: open the ops
          portal's Compliance, Access limits to see who, which measure and
          when. Until records ends their sessions at auth itself (a later
          slice), suspend the login in the ops portal (Admin, the person,
          Suspend). Ask the person's supervisor whether the reads were their
          work. To clear it, a TPA administrator and a compliance officer,
          neither of them the frozen person, each sign their half on Access
          limits with a reason.
        conditions:
          - name: "a freeze, enforced"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_velocity" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "velocity_freeze" AND metric.labels.outcome = "enforce"
              group_by_fields: ["metric.label.role"]

      records-velocity-hold:
        display_name: "records limit: a staff account is held"
        tier: p2
        subject: "records limit: a ${metric_or_resource.label.role} account is held"
        documentation: >-
          Records held one staff person in one tenant: their reads reached one
          and a half times their role's limit, so members they have not opened
          today show without details, and lists, searches, downloads and
          reveals are refused until the window slides or a supervisor lifts it.
          (In report mode, a freeze records would have made is told here too.)
          First steps: open the ops portal's Compliance, Access limits to see
          who and which measure. If it is their work, their supervisor, never
          the person, lifts it for an hour with a reason; if not, watch for the
          freeze.
        conditions:
          - name: "a hold"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_velocity" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "velocity_hold"
              group_by_fields: ["metric.label.role"]
          - name: "a freeze, reported only"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_velocity" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "velocity_freeze" AND metric.labels.outcome = "report"
              group_by_fields: ["metric.label.role"]

      records-velocity-raised:
        display_name: "URGENT records limit: a limit was raised"
        tier: p1
        urgent: true
        documentation: >-
          A TPA administrator saved a looser records limit: a role's figure or
          a multiplier went up, a lift got longer or more frequent, or the mode
          moved toward less enforcement. One administrator may do it alone,
          their own role's limits included (RS-495), so this page is the
          check. First steps: open the ops portal's Admin, Security limits to
          see what changed and who saved it; ask that administrator why; if
          nobody can say, put the limit back (a lowering pages normal) and
          suspend the login that saved it.
        conditions:
          - name: "a limit raised"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_velocity_settings_changes" AND resource.type = "cloud_run_revision"
                AND metric.labels.direction = "raise"

      records-velocity-lowered:
        display_name: "records limit: a limit was lowered"
        tier: p3
        documentation: >-
          A TPA administrator saved a tighter records limit: a role's figure or
          a multiplier went down, or a lift got shorter or rarer. People may
          now be held or frozen sooner. First steps: open the ops portal's
          Admin, Security limits to see what changed and who saved it, and
          confirm it was meant; a limit set to 0 freezes that role on its next
          member opened.
        conditions:
          - name: "a limit lowered"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_velocity_settings_changes" AND resource.type = "cloud_run_revision"
                AND metric.labels.direction = "lower"

      # #202 (I-5197): the nightly export to the vault and the restore drill
      # are backups, and a failed one pages (p1): beta's export failed three
      # nights running (10-10 to 10-12) and once more on 10-25 among ~38
      # emails a day. A person runs migrate-tpa and seed-tpa and sees their
      # failure on the console: p3, kept for the record.
      backup-jobs-failed:
        display_name: "URGENT a backup job failed (the export to the vault, the restore drill)"
        tier: p1
        urgent: true
        subject: "backup job failed: ${metric_or_resource.label.job_name}"
        documentation: >-
          The nightly export of tpa-db to the vault (`tpa-db-export`) or the
          restore drill (`restore-drill`) failed after its retries: tonight's
          copy of the member database is not in the vault, or a restore was
          not proved. Read the execution's own lines (the export's refusal, the
          bucket's write path, the drill's import), fix it, and run the export
          again by hand the same day (gcloud run jobs execute tpa-db-export);
          point-in-time recovery still covers the database meanwhile.
        conditions:
          - name: "a failed execution of a backup job"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
                AND metric.labels.result = "failed"
                AND resource.labels.job_name = one_of("tpa-db-export", "restore-drill")
              group_by_fields: ["resource.label.job_name"]

      jobs-failed:
        display_name: "a protected job's execution failed"
        tier: p3
        subject: "protected job failed: ${metric_or_resource.label.job_name}"
        documentation: >-
          A Cloud Run job in the PHI project that a person runs failed after
          its retries: the migration (`migrate-tpa`) or beta's seed of made-up
          data (`seed-tpa`, 2026-10-11). Its person sees it on the console, so
          it notifies nobody (p3). The export and the drill page in
          `backup-jobs-failed`; the chain head is in audit-chain.
        conditions:
          - name: "a failed execution"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
                AND metric.labels.result = "failed"
                AND resource.labels.job_name = one_of("migrate-tpa", "seed-tpa")
              group_by_fields: ["resource.label.job_name"]

      # #202 (I-5197): the export's or the drill's schedule refused is a
      # backup that did not start: p1, as the job failing.
      scheduler-failed:
        display_name: "URGENT a backup schedule could not start its job"
        tier: p1
        urgent: true
        subject: "backup schedule could not start its job: ${metric_or_resource.label.job_id} (${metric_or_resource.label.code})"
        documentation: >-
          Cloud Scheduler's attempt to start the nightly export to the vault or
          the restore drill finished in error, so tonight's backup did not
          start. Cloud Scheduler is outside the perimeter's restricted services
          (network-and-perimeter.md §5.5): a refusal here may be the perimeter.
          Run the export by hand once the cause is fixed (gcloud run jobs
          execute tpa-db-export).
        conditions:
          - name: "a failed attempt"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
                AND resource.labels.job_id = one_of("tpa-db-export", "restore-drill")
              group_by_fields: ["resource.label.job_id", "metric.label.code"]

      connectors-dead-letters:
        display_name: "connectors: a dead letter"
        tier: p2
        subject: "connectors dead letter: ${metric_or_resource.label.code}"
        documentation: >-
          A row was settled dead: it will never be sent. The code says why
          (a lane mismatch or an unknown destination is a bug; a 4xx is the
          destination's). Runbook: connectors.md §7.3, replay dead letters.
        conditions:
          - name: "any dead letter"
            threshold:
              # OWNER-EMAIL-1: an address no mail can reach is a member's data, not
              # a fault here; it is counted, and nobody needs waking.
              filter: >-
                metric.type = "logging.googleapis.com/user/connectors_dead_letters" AND resource.type = "cloud_run_revision"
                AND metric.label.code != "undeliverable_address"
              group_by_fields: ["metric.label.code"]

      connectors-destination-refused:
        display_name: "URGENT connectors: a destination was refused"
        tier: p1
        urgent: true
        subject: "connectors destination refused: ${metric_or_resource.label.lane}"
        documentation: >-
          The egress client refused a destination that is not on the
          allowlist: a configuration error, or something worse (connectors.md
          §6). Nothing was sent.
        conditions:
          - name: "any refused destination"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/connectors_deliveries" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "destination_refused"
              group_by_fields: ["metric.label.lane"]

      connectors-envelope-unsigned:
        display_name: "connectors: an envelope arrived unsigned"
        tier: p2
        subject: "connectors envelope unsigned: ${metric_or_resource.label.lane}"
        documentation: >-
          A claimed row carried no signature header: a gateway bug, not a
          network one. The row was settled dead unsent (connectors.md §6).
        conditions:
          - name: "any unsigned envelope"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/connectors_deliveries" AND resource.type = "cloud_run_revision"
                AND metric.labels.code = "envelope_unsigned"
              group_by_fields: ["metric.label.lane"]

      connectors-stalled:
        display_name: "connectors: no delivery pass for five minutes"
        tier: p2
        documentation: >-
          The delivery loop wrote no pass line for five minutes: it is stuck,
          down, or its pass line changed format. Nothing is being delivered, so
          every row's lag is growing: this is the five-minute lag alert of
          connectors.md §6 as far as the logs can tell it. The true lag (the
          oldest unsettled row) is on no line yet (docs/infra/monitoring.md §6).
        conditions:
          # By service, not by revision: a deploy is not a stalled loop
          # (2026-10-10, auth-messages-lag's lesson).
          - name: "no pass line for five minutes"
            absent:
              filter: >-
                metric.type = "logging.googleapis.com/user/connectors_passes" AND resource.type = "cloud_run_revision"
              duration: "300s"
              cross_series_reducer: "REDUCE_SUM"
              group_by_fields: ["resource.label.service_name"]

      perimeter-violations:
        display_name: "perimeter violation"
        tier: p2
        subject: "perimeter violation: ${metric_or_resource.label.service} (${metric_or_resource.label.code})"
        documentation: >-
          VPC Service Controls logged a violation. In dry run nothing was
          refused: read it against network-and-perimeter.md §5.5 before the
          flip. Enforced, something was refused. The incident's labels are the
          reason, the service and whether it was dry run.
        conditions:
          # VPC Service Controls writes its violation entries on the
          # audited_resource type, and Google refuses an alert filter with no
          # resource.type (the first beta apply, 2026-10-09).
          - name: "any violation"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/perimeter_violations" AND resource.type = "audited_resource"
              group_by_fields: ["metric.label.code", "metric.label.service", "metric.label.outcome"]

      # D-138 (2026-10-11): the detective half of row 168's narrowing. Normal
      # routing: a change is to be read, not an outage. An apply of this
      # catalogue opens it too.
      monitoring-changed:
        display_name: "an alert policy or notification channel changed"
        tier: p2
        subject: "alert policy or channel changed: ${metric_or_resource.label.operation}"
        documentation: >-
          An alert policy or a notification channel in the PHI project was
          created, changed or deleted, a channel verified, or a snooze made or
          changed (D-138). Its alert editors (row 168) may change and snooze
          existing policies and make nothing new, and an apply of the
          catalogue changes them too: beta's between-sessions stop and start
          (staffed-apply.md S1, S2) delete and recreate policies here, so each
          opens this once, as expected. Read the project's Admin Activity log
          for the entry (the incident's label is the method): who made it and
          what changed. A policy whose condition became a log match, a channel
          that is not the catalogue's, a snooze nobody announced, or this
          policy itself edited, snoozed or disabled is a finding; the next
          apply puts Terraform's policies back.
        conditions:
          # Cloud Monitoring writes its audit entries on audited_resource, as
          # VPC Service Controls does (UNVERIFIED until read: infra/README.md's
          # "before you apply" reads one entry's type from the 2026-10-09
          # apply's own entries before this is applied).
          - name: "a policy or channel change in the Admin Activity log"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/monitoring_changes" AND resource.type = "audited_resource"
              group_by_fields: ["metric.label.operation"]

      # D-142 (the owner, 2026-10-11: "Yes, with an alert"): the log metrics'
      # own change alarm, beside monitoring-changed. Normal routing (a
      # WARNING): a change is to be read, not an outage.
      log-counters-changed:
        display_name: "a log metric changed"
        tier: p2
        subject: "log metric changed: ${metric_or_resource.label.operation}"
        documentation: >-
          A log-based metric in the PHI project was created, changed or
          deleted (D-142). Its log metric writers (row 174, grp-platform-admin)
          may add and change them, and every change sends this alert so it is
          always visible; an apply of the catalogue changes them too. The
          counters are what the PHI project's alerts read, so a counter whose
          filter was narrowed or emptied silences its alert. Read the
          project's Admin Activity log for the entry (the incident's label is
          the method): who made it and what changed. A change nobody
          announced, or one to `monitoring_changes` or `log_metric_changes`
          themselves, is a finding; the next apply puts the catalogue's
          counters back.
        # One condition per resource type the counter's series can land on,
        # any of them opening the policy (the re-review's "land after",
        # 2026-10-11). A condition's filter must name one resource type
        # (Google refuses one without; the module's validation), and the
        # filter grammar takes one type per comparison, so three conditions
        # rather than one: `metric`, the type Cloud Logging writes a log
        # metric's audit entries on (Logging's resource list: "Metric Type",
        # labels project_id and name); `audited_resource`, the generic type
        # Cloud Audit Logs and Cloud Monitoring share; and `global`, where a
        # series goes whose entry's type Cloud Monitoring does not hold. A
        # condition on a type with no series never opens. The metric's name is
        # the project's alone, so no condition reads another counter.
        # UNVERIFIED which one carries it: infra/README.md reads the entry's
        # type before the apply and the series' type after it.
        conditions:
          - name: "a log metric change in the Admin Activity log (on metric)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "metric"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on audited_resource)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "audited_resource"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on global)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "global"
              group_by_fields: ["metric.label.operation"]

      # Its own key since 2026-10-11, when `canary-sql` became the shared
      # list's (the proxy's refusals, in every project): the same key here
      # would replace the shared one in production-full's merge.
      records-sql-errors:
        display_name: "records: database connection errors"
        tier: p2
        subject: "records database connection errors: ${metric_or_resource.label.sqlstate}"
        documentation: >-
          records logged three or more errors whose SQLSTATE is a connection
          exception (class 08) in ten minutes: it reached the proxy and the
          connection still failed or broke. The canary's "Cloud SQL connection errors: zero"
          (docs/pipeline.md §5.1), beside the proxy's own refusals
          (`canary-sql`). Check tpa-db (`tpa-db-down`), then the proxy's lines.
        conditions:
          # #202: three in ten minutes (one broken connection at a
          # maintenance opened it; tpa-db down is its own p1).
          - name: "three or more SQLSTATE class 08 on records lines in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/errors" AND resource.type = "cloud_run_revision"
                AND metric.labels.sqlstate = starts_with("08")
              threshold_value: 2
              alignment_period: "600s"
              group_by_fields: ["metric.label.sqlstate"]

      # 2026-10-11: records' liveness at low traffic, as `backend-down` is the
      # app tier's. records answers tpa-api, the jobs and connectors only.
      records-down:
        display_name: "URGENT records answered only errors"
        tier: p1
        urgent: true
        documentation: >-
          Every request records answered in the last ten minutes was a 5xx
          (two or more, none answered otherwise): the gateway is down for
          tpa-api and the jobs. A refusal is a 4xx and never counts here. Read
          records' system log (`canary-startup`), its `records-critical` lines
          and tpa-db (`tpa-db-down`).
        conditions:
          - name: "only 5xx for ten minutes, at least two"
            promql:
              query: >-
                sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="records", response_code_class="5xx"}[10m])) >= 2
                unless sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="records", response_code_class!="5xx"}[10m])) > 0
              evaluation_interval: "60s"

      # Cloud SQL's own signals for tpa-db, by name, so the restore drill's
      # scratch instances (tpa-db-drill-*) never open them. Beta drops the
      # down policy while the instance is stopped on purpose (B8).
      tpa-db-down:
        display_name: "URGENT tpa-db is down"
        tier: p1
        urgent: true
        documentation: >-
          Cloud SQL reported tpa-db not up for five minutes: records cannot
          answer, and its `database unreachable` (`records-critical`) opens
          beside this. Check the instance in the console (a maintenance or a
          failed restart), then its operations.
        conditions:
          - name: "database/up below 1 for five minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/up" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":tpa-db")
              comparison: "COMPARISON_LT"
              threshold_value: 1
              duration: "300s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_MAX"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      tpa-db-disk:
        display_name: "tpa-db disk above 85%"
        tier: p2
        documentation: >-
          tpa-db's disk has stayed above 85 percent full for ten minutes.
          Automatic growth stops at the instance's disk_autoresize_limit
          (var.sizing); raise the limit or the disk before it fills, when the
          instance stops taking writes.
        conditions:
          - name: "disk/utilization above 0.85 for ten minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/disk/utilization" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":tpa-db")
              threshold_value: 0.85
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_MEAN"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      # D-147: the email and text vendors, as records' message lane reaches
      # them through connectors. connectors_deliveries carries no destination
      # (not on the label allowlist), so the two vendors are one lane here. A
      # refused destination and an unsigned envelope are ours and have their
      # own policies.
      message-vendor-errors:
        display_name: "connectors: the email or text vendor is failing (the message lane)"
        tier: p2
        documentation: >-
          Five or more of the message lane's sends, and more than a quarter of
          them, failed at the vendor in thirty minutes (settled retry,
          unknown or dead): members' notices by email or text are not
          arriving. Read the vendors' status pages and the lane's codes in
          connectors' lines, then the NAT path (`nat-port-exhaustion`). An
          `unknown` is never sent again (R-I): it may have arrived.
        conditions:
          - name: "five failures or more, over a quarter of the lane's sends, in thirty minutes"
            promql:
              query: >-
                sum(increase(logging_googleapis_com:user_connectors_deliveries{monitored_resource="cloud_run_revision", lane="message", outcome=~"retry|unknown|dead", code!~"destination_refused|envelope_unsigned"}[30m])) >= 5
                and sum(increase(logging_googleapis_com:user_connectors_deliveries{monitored_resource="cloud_run_revision", lane="message", outcome=~"retry|unknown|dead", code!~"destination_refused|envelope_unsigned"}[30m]))
                > 0.25 * sum(increase(logging_googleapis_com:user_connectors_deliveries{monitored_resource="cloud_run_revision", lane="message"}[30m]))
              evaluation_interval: "60s"

      # #202 (the review's R4: counted, never alerted): records' refusals, its
      # reveals and its revocation mirror, each p2. A refusal at the identity
      # gates (1 caller, 2 token, 3 liveness) is a caller records does not
      # know or a token it will not take: probing, a few at a time; any
      # refusal at a hundred in ten minutes is a flood. A reveal is a logged
      # staff act (an SSN or a bank field shown), and a burst is harvesting
      # the records limit's freeze (p1) may not yet have stopped. The mirror
      # is records' copy of auth's keys and revocations; a stale one fails
      # closed (503 mirror_stale), so it can wait for the morning.
      records-refusals-surge:
        display_name: "records refusals surging"
        tier: p2
        subject: "records refusals surging: gate ${metric_or_resource.label.gate}"
        documentation: >-
          records refused more than ten calls at its identity gates (1 caller,
          2 token, 3 liveness) in ten minutes, or more than a hundred at any
          gate: somebody inside the network calling records as a caller it does
          not list or with tokens it will not take, or a client broken after a
          deploy. Read records' `refused` lines by gate, code and operation;
          the caller's identity is in the request's audit entry.
        # The gate is a text label holding a digit. Monitoring reads a quoted
        # digit inside `one_of` as a number and refuses the policy ("Function
        # 'one_of' takes only string arguments"), so the three gates are a
        # full-match pattern.
        conditions:
          - name: "more than ten refusals at the identity gates in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_refusals" AND resource.type = "cloud_run_revision"
                AND metric.labels.gate = monitoring.regex.full_match("[123]")
              threshold_value: 10
              alignment_period: "600s"
              group_by_fields: ["metric.label.gate"]
          - name: "more than a hundred refusals at any gate in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_refusals" AND resource.type = "cloud_run_revision"
              threshold_value: 100
              alignment_period: "600s"
              group_by_fields: ["metric.label.gate"]

      records-reveals-surge:
        display_name: "records reveals surging"
        tier: p2
        subject: "records reveals surging: ${metric_or_resource.label.operation}"
        documentation: >-
          records served more than twenty reveals (`eligibility.reveal`, an
          SSN; `network.reveal_field`, a bank field) in an hour across the
          estate: each is a logged staff act, and a burst is somebody
          harvesting. Read the operations portal's Access limits and records'
          audit chain for who revealed what (never in this alert); the records
          limit freezes a person who reads twice their role's limit.
        conditions:
          - name: "more than twenty reveals in an hour"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_reveals" AND resource.type = "cloud_run_revision"
              threshold_value: 20
              alignment_period: "3600s"
              group_by_fields: ["metric.label.operation"]

      records-mirror-problems:
        display_name: "records' copy of auth's keys or revocations is failing"
        tier: p2
        subject: "records mirror failing: gate ${metric_or_resource.label.gate}"
        documentation: >-
          records' mirror wrote more than three warnings or errors in every
          fifteen minutes for fifteen: the JWKS fetch (gate 2), or the event or
          revocation feed (gate 3). A stale mirror fails closed (records answers
          503 mirror_stale and refuses people), and a revocation not yet
          mirrored is a revoked session records still takes until it is. Read
          records' mirror lines, then auth's /revocations and /events and the
          path between them.
        conditions:
          - name: "more than three mirror problems in every fifteen minutes for fifteen"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/records_mirror_problems" AND resource.type = "cloud_run_revision"
              threshold_value: 3
              duration: "900s"
              alignment_period: "900s"
              group_by_fields: ["metric.label.gate"]


  # ---------------------------------------------------------------------------
  # The CRM project: the CRM's engine and its document renderer. The CRM is
  # the other product; this is only what the TPA needs to see of it.
  # ---------------------------------------------------------------------------
  crm:
    log_metrics:
      errors:
        description: >-
          ERROR lines of the CRM's services. Their formatter writes the whole
          formatted exception to `exc`, so only the exception line's class is
          read (the first line after the last frame, a dotted name ending as
          an exception class does), and nothing else; any other shape gives
          no class.
        filter: |
          resource.type="cloud_run_revision"
          AND jsonPayload.logger:*
          AND (jsonPayload.level="ERROR" OR jsonPayload.level="error")
        labels:
          # Anchored to a line's start, as the call centre's (the review's
          # finding 4; the dashboard reviewer, 2026-10-11): unanchored, a
          # message running onto "...for Jane Doe" read the class "Doe", a
          # person's name in a label that reaches PagerDuty, email and the
          # dashboards.
          # The review of P129 (2026-10-13): the class is now a subject line's
          # "which", so it is read only where Python writes it, the first line
          # after the last frame (`  File ...` and its indented code lines),
          # and only a dotted name ending as an exception class does (Error,
          # Exception, Warning, Exit, Interrupt, Timeout, Violation, Failure,
          # Shutdown, Canceled, Cancelled, Detected, Iteration). A message's own
          # later lines ("member not found" then "M1234567") are never that
          # line, and anything else (a number, an address, a sentence, a class
          # past the set) gives no class.
          class: 'REGEXP_EXTRACT(jsonPayload.exc, "^[\\s\\S]*\\n  File [^\\n]*\\n(?: {4}[^\\n]*\\n)*((?:[A-Za-z_][A-Za-z0-9_]*\\.)*[A-Za-z_][A-Za-z0-9_]*(?:Error|Exception|Warning|Exit|Interrupt|Timeout|Violation|Failure|Shutdown|Canceled|Cancelled|Detected|Iteration))(?::|\\n|$)")'

      # 2026-10-12 (the owner, paged seven times in an evening: "Figure out why
      # i keep getting paged this"): `canary-latency` opened on the engine every
      # time, at about 323 000 ms. Its ledger stream (`GET /api/v1/ledger/stream`)
      # stays open while a tab shows the CRM, until Cloud Run's 300 s request
      # timeout, and Cloud Run's request metric cannot tell a stream from a slow
      # request. Beta leaves the engine out of that query while the CRM copy is
      # built (main.tf, latency_excluded_services), as it does web, tpa-api and
      # model-gateway, and reads its latency here instead, from its own request
      # line: logger `network.request` (the CRM's engine/app/middleware.py: one
      # line per request, `method`, `path`, `status`, `duration_ms`, timed to the
      # last byte of the answer, so a stream's whole life and a file's whole
      # transfer are in it). Left out by path, matched and never read into a
      # label: every route that answers with a StreamingResponse in the CRM's
      # engine/app/routers, each held to that source by
      # tests/infra/test_engine_latency.py. The long-lived streams: the ledger's
      # and a teammate run's. The model's own streams: Jarvis's answer and
      # voice, the teammate's answer, the Coach's live assist. The file
      # transfers: a document's content and its PDF preview, a mail attachment, a proposal's
      # preview, the public proposal document, a booking page's logo, a feedback
      # screenshot and its public image (the end-of-round suite, 2026-11-11: the
      # CRM retired `/public/sign/{token}/document` with its old signing door, so
      # that path left the list, and its booking page's logo,
      # `/public/book/brand/{logo_token}`, streams from stored files, so it
      # joined). And `/api/v1/health` (the review,
      # 2026-10-12): Cloud Run's probes and the CRM host's uptime check read it,
      # about three lines in four, and their quick answers watered the p95 down.
      engine_latency:
        description: >-
          The time the CRM's engine took to finish each answer (`duration_ms`
          on its `request` line, logger `network.request`), as a distribution
          in milliseconds, without its long-lived streams (the ledger's, a
          teammate run's), the model's own streams (Jarvis, the teammate's
          answer, the Coach's live assist), its file transfers and its health
          probe (`/api/v1/health`). No label: the path selects and is never
          read into a series.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="engine"
          AND jsonPayload.logger="network.request"
          AND jsonPayload.duration_ms:*
          AND NOT jsonPayload.path="/api/v1/health"
          AND NOT jsonPayload.path=~"^/api/v1/(ledger/stream|teammate/runs/[^/]+/stream|teammate/answer|jarvis/say|jarvis/speak|coach/live/sessions/[^/]+/assist/stream)$"
          AND NOT jsonPayload.path=~"^/api/v1/(documents/[^/]+/(content|preview)|mail/attachments/[^/]+|proposals/[^/]+/preview|public/proposals/[^/]+/document|public/book/brand/[^/]+|reviewer-feedback/[^/]+/screenshot|public/reviewer-feedback/images/[^/]+)$"
        value_extractor: 'EXTRACT(jsonPayload.duration_ms)'
        unit: "ms"
        bounds: [25, 50, 100, 250, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000]

      # R5107 (the decider, 2026-10-28: "190 yes. for number 4 can you explain
      # it a bit further? Does this offere the same secuirty to require
      # password change vs suspension? what elements are they required to have
      # to change the password?"; orchestrator/plans/
      # lockout-settings-alerts-DESIGN.md B3): the CRM's own sign-in pauses,
      # per account, from the CRM's worker pass
      # (engine/app/services/sign_in_protection.py, run by every pass of the
      # forgot-password drain: beta's `crm-reset-drain` job). One line per
      # pause, logger `network.auth`, message "sign-in paused", with two closed
      # fields: `pause` (the design's code; the engine's log filter redacts any
      # field named `code`, a second-step code being a credential) and `class`.
      # Nothing else on the line: no address, id or code. In a project the CRM
      # shares (beta's app project, R282) the shared filter
      # (main.tf, crm_shared_filter) also names the CRM's two services, which
      # leaves this job's lines out until that local admits the job: the
      # policies below fire there once it does (a .tf change, not made here).
      crm_sign_in_protection:
        description: >-
          One per sign-in pause the CRM's worker pass handled that names an
          account (an address with no account writes no line; the door's
          refusals count it): which pause (`code`: account, factor,
          factor_ceiling, factor_repeated) and whose account (`class`: staff
          for an owner or admin of any business, else outside), each a closed
          alternation; nothing about who.
        filter: |
          ((resource.type="cloud_run_job" AND resource.labels.job_name="crm-reset-drain")
           OR (resource.type="cloud_run_revision" AND resource.labels.service_name="engine"))
          AND jsonPayload.logger="network.auth"
          AND jsonPayload.message="sign-in paused"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.pause, "^(account|factor|factor_ceiling|factor_repeated)$")'
          class: 'REGEXP_EXTRACT(jsonPayload.class, "^(staff|outside)$")'

      # R5107: the CRM's existing refusal line at the door ("sign-in
      # throttled", the request path's own), by its closed reason: the
      # one-minute speed limit's four budgets and the three pauses. An
      # estate-wide surge is credential stuffing or a leaked list at work. The
      # line's other fields (the address's domain, the caller's address) are
      # never read.
      crm_sign_in_throttled:
        description: >-
          One per sign-in the CRM's engine refused for a spent budget or a
          pause, by its closed reason (`code`); the line's domain and caller's
          address are never read.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="engine"
          AND jsonPayload.logger="network.auth"
          AND jsonPayload.message="sign-in throttled"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.reason, "^(pair_budget|account_addresses|account_budget|address_accounts|account_paused|factor_paused|factor_ceiling_paused)$")'

      # R572 (the CRM review's §4, credential stuffing; §6 item 4): the CRM's
      # own "failed login" line (engine/app/services/auth.py, one per wrong
      # password at the door, known address or not), the spray auth's
      # `auth_login_failures` counts for the portal. `crm_sign_in_throttled`
      # counts only spent budgets and pauses, which a few tries at each of many
      # accounts never reaches. The line's address domain and caller's address
      # are never read.
      crm_login_failures:
        description: >-
          One per password the CRM's engine refused at its sign-in door
          ("failed login"). Nothing of the line is read: no domain, address
          or account.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="engine"
          AND jsonPayload.logger="network.auth"
          AND jsonPayload.message="failed login"

    error_metrics:
      errors:
        group_by: [class]
        resource_types: [cloud_run_revision]

    alert_policies:
      # 2026-10-11: the CRM's two jobs, each run by a person (beta's copy,
      # crm.tf: migrate-crm and seed-crm). production-full's CRM jobs are its
      # own repository's to deploy (row 14 keeps `migrate-crm` reserved), and
      # a listed name no job carries never opens anything. In a project the
      # CRM shares this takes its role's prefix (`crm-jobs-failed`), as the
      # root's renaming does. R380 (I-605): twice in a row, as the app
      # project's own `jobs-failed`, which it sits beside in beta.
      jobs-failed:
        display_name: "a CRM job failed twice in a row"
        tier: p3
        subject: "CRM job failed twice in a row: ${metric_or_resource.label.job_name}"
        documentation: >-
          One of the CRM's jobs failed twice in a row within a day, with no
          successful run between: its migration (`migrate-crm`) or its
          made-up data seed (`seed-crm`), each run by a person, who sees each
          failure on the console. Read the executions' own lines.
        conditions:
          - name: "the same job failed twice in a row"
            failed_twice:
              jobs: ["migrate-crm", "seed-crm"]

      # 2026-10-12: the engine's own p95 from its request line, without its
      # streams and file transfers (`engine_latency` above), beside the
      # generic `canary-latency`, which leaves the engine out in beta while
      # the CRM copy is built. Beta makes both only with the copy
      # (crm_enabled); routed as `tpa-api-latency` is (normal).
      engine-latency:
        display_name: "engine p95 latency above 2 s (its own request line)"
        tier: p3
        subject: "engine p95 above 2 s"
        documentation: >-
          The CRM engine's 95th percentile time to answer stayed above two
          seconds for ten minutes, read from its own request line without its
          streams (the ledger's, a teammate run's, the model's), and its file
          transfers (`engine_latency`). `canary-latency` cannot see the engine
          in beta, which leaves it out for its ledger stream, held open until
          Cloud Run's 300 s timeout by every tab that shows the CRM. Check
          crm-db first (`crm-db-down`, its CPU and connections), then the
          engine's instances and its ERROR lines.
        conditions:
          - name: "p95 above 2000 ms for ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/engine_latency" AND resource.type = "cloud_run_revision"
              threshold_value: 2000
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_PERCENTILE_95"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.service_name"]

      # R5107 (B3's table, the CRM's half): per-account sign-in pauses, from
      # the worker pass's line (`crm_sign_in_protection`). All normal: the
      # design asked for a staff account's 30-day pause to be urgent, but the
      # urgent kinds are the owner's own list (outage, security freeze, audit
      # chain), so that waits for the owner. The emails to the person and to
      # the estate business's owners are the CRM's, not these.
      crm-sign-in-ceiling:
        display_name: "a CRM account's sign-in paused for 30 days"
        tier: p2
        subject: "CRM sign-in paused for 30 days: ${metric_or_resource.label.class} account"
        documentation: >-
          A hundred wrong second-step codes in thirty days paused one CRM
          account's sign-in for thirty days: somebody holds that account's
          password (or a reset link to its inbox) and has been guessing its
          second step. The person has been emailed and owes a new password at
          their next sign-in; the estate business's owners have the account's
          id. Nothing unlocks it early. Read the worker's lines and the
          `failed mfa` lines before it; tell the person if the owners have not.
        conditions:
          - name: "a 30-day pause"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_protection" AND resource.type = "cloud_run_job"
                AND metric.labels.code = "factor_ceiling"
              group_by_fields: ["metric.label.class"]

      crm-sign-in-staff:
        display_name: "a CRM owner's or administrator's sign-in paused"
        tier: p2
        subject: "CRM staff sign-in paused: ${metric_or_resource.label.code}"
        documentation: >-
          Sign-in to an owner's or administrator's CRM account was paused
          after ten wrong passwords (`account`; anybody with the address can
          cause it). The estate business's owners have the account's id by
          email; the pause ends on its own. A second-step pause is
          `crm-sign-in-staff-codes` (p1).
        conditions:
          - name: "a staff account's sign-in paused for wrong passwords"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_protection" AND resource.type = "cloud_run_job"
                AND metric.labels.class = "staff" AND metric.labels.code = "account"
              group_by_fields: ["metric.label.code"]

      # #202 (the review's rows 76 to 78): a staff account's second step
      # paused means its password is known: p1. Wrong passwords alone, which
      # anybody with the address can cause, wait (crm-sign-in-staff, p2).
      crm-sign-in-staff-codes:
        display_name: "URGENT second-step codes guessed on a CRM owner's or administrator's account"
        tier: p1
        urgent: true
        subject: "CRM staff second step paused: ${metric_or_resource.label.code}"
        documentation: >-
          A CRM owner's or administrator's second step was paused after ten
          wrong codes that followed a correct password (`factor`), or for the
          third time in a day (`factor_repeated`): somebody holds the password.
          The estate business's owners have the account's id by email; the
          person owes a new password at their next sign-in. Read the CRM's
          audit log for the account and its recent sign-ins.
        conditions:
          - name: "a staff account's second step paused"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_protection" AND resource.type = "cloud_run_job"
                AND metric.labels.class = "staff" AND metric.labels.code = one_of("factor", "factor_repeated")
              group_by_fields: ["metric.label.code"]

      crm-sign-in-repeated:
        display_name: "URGENT a CRM account's second step paused three times in a day"
        tier: p1
        urgent: true
        documentation: >-
          One CRM account's second step was paused three times in 24 hours
          (`factor_repeated`): somebody holding its password keeps coming back.
          The person has been emailed and owes a new password; the estate
          business's owners have the account's id.
        conditions:
          - name: "a third second-step pause in a day"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_protection" AND resource.type = "cloud_run_job"
                AND metric.labels.code = "factor_repeated"

      crm-sign-in-list:
        display_name: "URGENT five or more CRM second-step pauses in an hour"
        tier: p1
        urgent: true
        documentation: >-
          Five or more CRM accounts' second steps were paused within an hour:
          a leaked or phished list of passwords being worked through. Each
          person has been emailed and owes a new password. Look for the
          addresses the `failed mfa` and `sign-in throttled` lines share.
        conditions:
          - name: "five factor pauses in an hour"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_protection" AND resource.type = "cloud_run_job"
                AND metric.labels.code = one_of("factor", "factor_repeated")
              threshold_value: 4
              alignment_period: "3600s"

      crm-sign-in-surge:
        display_name: "CRM sign-in refusals surging"
        tier: p2
        documentation: >-
          More than twenty sign-ins refused at the CRM's door in five minutes,
          for a spent budget or a pause (`crm_sign_in_throttled`): credential
          stuffing, most often. Read the engine's `sign-in throttled` lines
          by reason and address.
        conditions:
          - name: "more than 20 refusals in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_sign_in_throttled" AND resource.type = "cloud_run_revision"
              threshold_value: 20

      # R572: auth-password-spray's twin for the CRM host, which leaves IAP.
      # #202's "a password spray" is one of the decider's p1 kinds (account
      # compromise in progress), as auth's is. The same bar as auth's, to tune
      # on the open host's first days.
      crm-password-spray:
        display_name: "URGENT refused CRM password sign-ins surging (a password spray)"
        tier: p1
        urgent: true
        documentation: >-
          The CRM's engine refused more than 30 passwords at its sign-in door
          in ten minutes: a password list being tried against many accounts,
          a few tries each, which no account's pause and no spent budget sees
          (crm-sign-in-surge counts those). Read the engine's "failed login"
          lines by address and the load balancer's log, and block the sources
          at Cloud Armor if they are not people mistyping; the brake that
          always fits is IAP back on the CRM host (infra/README.md, "Putting
          IAP back").
        conditions:
          - name: "more than 30 refused passwords in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/crm_login_failures" AND resource.type = "cloud_run_revision"
              threshold_value: 30
              alignment_period: "600s"

      # crm-db exists whatever beta's crm_enabled says (main.tf, sql_crm), so
      # its signals are read whether or not the copy runs. Beta drops the
      # down policy while the instance is stopped on purpose (B8).
      crm-db-down:
        display_name: "URGENT crm-db is down"
        tier: p1
        urgent: true
        documentation: >-
          Cloud SQL reported crm-db not up for five minutes: the CRM cannot
          read or write. Check the instance in the console (a maintenance or a
          failed restart), then its operations.
        conditions:
          - name: "database/up below 1 for five minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/up" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":crm-db")
              comparison: "COMPARISON_LT"
              threshold_value: 1
              duration: "300s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_MAX"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      crm-db-disk:
        display_name: "crm-db disk above 85%"
        tier: p2
        documentation: >-
          crm-db's disk has stayed above 85 percent full for ten minutes.
          Automatic growth stops at the instance's disk_autoresize_limit;
          raise the limit or the disk before it fills.
        conditions:
          - name: "disk/utilization above 0.85 for ten minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/disk/utilization" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":crm-db")
              threshold_value: 0.85
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_MEAN"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

  # ---------------------------------------------------------------------------
  # Beta's call-centre project (2026-10-11; callcentre.tf's monitoring_cc, beta
  # alone: production-full has no call-centre project and reads only app, phi
  # and crm). svc-voice always; svc-ops, svc-twilio-rest, cc-db and migrate-cc
  # with the staffed desk or the relay. call-center's lines write `severity`
  # themselves (services/privacy/log_setup.py JsonLineFormatter: `severity`,
  # `message`, `logger`, `exception`), which Cloud Logging maps, so its error
  # counter reads severity; the relay writes only uvicorn's text, so its
  # failures are its 5xx (and, since I-5117, its own twilio_upstream_failed
  # line). The voice host's uptime check expects armor-voice's 404 on /health
  # (R114, D-147) and never reaches svc-voice: it proves the edge alone, and
  # opening /health is a new ruling (I-5140, NEEDS-OWNER); svc-voice's
  # liveness is Cloud Run's own (its instance count, while warm; its 5xx) and,
  # since R5077, its stall alarm.
  # ---------------------------------------------------------------------------
  cc:
    log_metrics:
      errors:
        description: >-
          call-center's lines at ERROR or above (svc-voice, svc-ops,
          migrate-cc), one per line. Its formatter writes the redacted
          traceback to `exception`, so only the exception line's class is read
          (the first line after the last frame, a dotted name ending as an
          exception class does), and nothing else of it. Any other shape (no
          frame, free text, a number) gives no class rather than a word of it.
        filter: |
          (resource.type="cloud_run_revision" OR resource.type="cloud_run_job")
          AND jsonPayload.logger:*
          AND severity>=ERROR
        labels:
          # Anchored to a line's start (the alert-gaps review, finding 4): the
          # unanchored form took the last word of any last line ("...\ncaller
          # said Jane Doe" gave "Doe").
          # The review of P129: the CRM's expression, on call-center's field
          # (its redacted traceback keeps every real `  File` line).
          class: 'REGEXP_EXTRACT(jsonPayload.exception, "^[\\s\\S]*\\n  File [^\\n]*\\n(?: {4}[^\\n]*\\n)*((?:[A-Za-z_][A-Za-z0-9_]*\\.)*[A-Za-z_][A-Za-z0-9_]*(?:Error|Exception|Warning|Exit|Interrupt|Timeout|Violation|Failure|Shutdown|Canceled|Cancelled|Detected|Iteration))(?::|\\n|$)")'

      # The stall alarm (R5077, 2026-10-21; I-5133: on beta's first calls
      # after a long idle svc-voice's event loop was starved, a 300 ms timer
      # firing 4.5 s late and 157 s with nothing processed). svc-voice's
      # watchdog writes one value-free `voice_loop_lag` line when its own
      # timer fires late: `lag_ms`, how late, an integer, and `where`, a closed
      # code. Nothing of a call is on the line, and only `where` becomes a
      # label, through a code word's shape alone. The two threshold counters
      # are what the alert reads; the count and the distribution are for
      # reading the stall afterwards.
      voice_loop_lag:
        description: >-
          Every `voice_loop_lag` line svc-voice writes (its event-loop
          watchdog: the loop's own timer fired late), by its closed `where`
          code. One per late timer.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND jsonPayload.event="voice_loop_lag"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.where, "^([a-z][a-z0-9_]{0,31})$")'

      voice_loop_lag_ms:
        description: >-
          How late svc-voice's event-loop timer fired, in milliseconds, as a
          distribution (each `voice_loop_lag` line's `lag_ms`).
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND jsonPayload.event="voice_loop_lag"
        value_extractor: 'EXTRACT(jsonPayload.lag_ms)'
        unit: "ms"
        bounds: [100, 250, 500, 1000, 2000, 5000, 10000, 30000, 60000, 120000]

      voice_loop_lag_over_1s:
        description: >-
          The `voice_loop_lag` lines whose `lag_ms` is 1000 or more: the loop
          held a second or longer. The alert's three-in-five-minutes count.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND jsonPayload.event="voice_loop_lag"
          AND jsonPayload.lag_ms>=1000

      voice_loop_lag_over_5s:
        description: >-
          The `voice_loop_lag` lines whose `lag_ms` is 5000 or more: a stall a
          caller hears as dead air. One opens the alert.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND jsonPayload.event="voice_loop_lag"
          AND jsonPayload.lag_ms>=5000

      # A stall that never ends writes no `voice_loop_lag` line (the loop must
      # come back to write it), so the watchdog's other half is counted too:
      # faulthandler's C timer writes every thread's stack to stderr once the
      # loop has not beaten for five seconds and a tick (call-center ef3ad77,
      # `voice_gateway.loop_watch`), each thread's header "Thread 0x... (most
      # recent call first):" one plain-text entry. Python's own tracebacks say
      # "most recent call last", never this. Nothing of the dump is read: file
      # names and line numbers stay in the entry.
      voice_stack_dumps:
        description: >-
          svc-voice's faulthandler stack dumps, one per thread header ("most
          recent call first"): its event loop had not beaten for five seconds
          and more, whether or not it ever came back.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND textPayload:"most recent call first"

      # The watchdog's warm-up (call-center ef3ad77, `voice_gateway.keep_warm`):
      # one value-free `voice_keep_warm_failed` line when a step fails or times
      # out, its `warm_step` a closed code (`imports`, `dialog_client`,
      # `member_tools`, `envelope`, `registry`, `line_settings`, `ledger`,
      # `standing_token`) and `warm_error` an exception's type name, not read.
      voice_keep_warm_failures:
        description: >-
          svc-voice's failed keep-warm steps, by the step's closed code. A
          failing step leaves that path cold for the next call.
        filter: |
          resource.type="cloud_run_revision"
          AND resource.labels.service_name="svc-voice"
          AND jsonPayload.event="voice_keep_warm_failed"
        labels:
          code: 'REGEXP_EXTRACT(jsonPayload.warm_step, "^([a-z][a-z0-9_]{0,31})$")'

      # #202 (TP-152; the review's R4: "monitoring-changed and
      # log-counters-changed exist only in the PHI project"): the same two
      # counters as the PHI project's, by the same names and filters. Here
      # the platform group holds roles/monitoring.editor (row 167 or 171),
      # which can make a new policy or channel, so a change nobody announced
      # is as much a finding as in the PHI project. By method alone.
      monitoring_changes:
        description: >-
          A change to this project's alert policies, notification channels or
          snoozes in the Admin Activity audit log: a policy created, updated
          or deleted, a channel created, updated, deleted or verified, a
          snooze created or updated. By method alone; the entry says who and
          what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="monitoring.googleapis.com"
          AND (protoPayload.methodName="google.monitoring.v3.AlertPolicyService.CreateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.UpdateAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.AlertPolicyService.DeleteAlertPolicy"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.CreateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.UpdateNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.DeleteNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.NotificationChannelService.VerifyNotificationChannel"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.CreateSnooze"
            OR protoPayload.methodName="google.monitoring.v3.SnoozeService.UpdateSnooze")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

      log_metric_changes:
        description: >-
          A change to this project's log-based metrics in the Admin Activity
          audit log: a log metric created, updated or deleted. By method
          alone; the entry says who and what.
        filter: |
          log_id("cloudaudit.googleapis.com/activity")
          AND protoPayload.serviceName="logging.googleapis.com"
          AND (protoPayload.methodName="google.logging.v2.MetricsServiceV2.CreateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.UpdateLogMetric"
            OR protoPayload.methodName="google.logging.v2.MetricsServiceV2.DeleteLogMetric")
        labels:
          operation: 'EXTRACT(protoPayload.methodName)'

    error_metrics:
      errors:
        group_by: [class]
        resource_types: [cloud_run_revision, cloud_run_job]

    alert_policies:
      # The phone line's liveness when something calls it. Its warm instance
      # is the module's `no_instance` (callcentre.tf passes svc-voice while
      # its minimum is one or more).
      voice-down:
        display_name: "URGENT svc-voice answered only errors"
        tier: p1
        urgent: true
        documentation: >-
          Every request svc-voice answered in the last ten minutes was a 5xx
          (two or more, none answered otherwise): calls to the test line fail.
          A refused webhook signature is a 4xx and never counts here. Read
          svc-voice's system log (`canary-startup`) and its ERROR lines. The
          voice host's uptime check expects its edge's 404 on `/health` (R114,
          D-147) and never reaches svc-voice: it proves the edge alone.
        conditions:
          - name: "only 5xx for ten minutes, at least two"
            promql:
              query: >-
                sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="svc-voice", response_code_class="5xx"}[10m])) >= 2
                unless sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="svc-voice", response_code_class!="5xx"}[10m])) > 0
              evaluation_interval: "60s"

      # D-147: the phone AI's model vendor (R189: Anthropic's API), from the
      # error counter's class, the last line of call-center's redacted
      # traceback. The vendor SDK's exceptions are named under `anthropic`
      # (a turn that failed, services/voice_gateway/server.py "turn failed").
      voice-model-errors:
        display_name: "svc-voice: the model vendor is failing"
        tier: p2
        subject: "svc-voice model vendor failing: ${metric_or_resource.label.class}"
        documentation: >-
          svc-voice logged three or more errors whose exception is the model
          vendor's (a class under `anthropic`) in ten minutes: callers to the
          test line hear the fallback, not the AI. Read the vendor's status
          page, then svc-voice's ERROR lines for the class (a rate limit, an
          overload, a refused key).
        conditions:
          - name: "three vendor exceptions or more in ten minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/errors" AND resource.type = "cloud_run_revision"
                AND resource.labels.service_name = "svc-voice"
                AND metric.labels.class = starts_with("anthropic")
              threshold_value: 2
              alignment_period: "600s"
              group_by_fields: ["metric.label.class"]

      # R5142: svc-voice runs concurrency 40 on its one instance (I-309), so
      # the shared run-concurrency-high (72, of the default 80) never opens for
      # it. 32 is 80 percent of its own 40: a call is a socket and its
      # callbacks, so the member line's ten and the test line's couple sit
      # well below it, and a sustained 32 is traffic past what was sized.
      voice-concurrency-high:
        display_name: "svc-voice: its one instance near its request concurrency"
        tier: p2
        subject: "svc-voice near its concurrency of 40"
        documentation: >-
          svc-voice's one instance served 32 or more requests at once (80
          percent of its concurrency of 40) at the 99th percentile for five
          minutes: past that, Cloud Run holds new requests, a caller's socket
          or webhook among them, and a second instance is never started
          (max_instances 1, I-309). Read the calls at once on the Phone line
          page against limits.system_at_once (12), then svc-voice's request
          mix (sockets, webhooks, status callbacks) for a flood armor-voice's
          throttles let through.
        conditions:
          - name: "p99 of peak concurrency at 32 or more for five minutes"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/container/max_request_concurrencies" AND resource.type = "cloud_run_revision"
                AND resource.labels.service_name = "svc-voice"
              threshold_value: 31.5
              duration: "300s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_PERCENTILE_99"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.service_name"]

      # R5077's stall alarm (I-5133): the event-loop watchdog's lines, through
      # the two threshold counters above. Normal routing (Slack, email and
      # PagerDuty as WARNING), the other call-centre alerts' channels: beta's
      # callers are the testers alone (R149), and voice-down stays the outage.
      voice-loop-stall:
        display_name: "svc-voice: its event loop stalled"
        tier: p2
        subject: "svc-voice event loop stalled"
        auto_close: "1800s"
        documentation: >-
          svc-voice's event-loop watchdog saw its own timer fire five seconds
          or more late once, or a second or more late three times, in five
          minutes, or wrote its stack dump (the loop had not beaten for five
          seconds, a stall that may not have ended): while the loop is held
          nothing on any call is processed, and a caller hears silence (the
          2026-10-21 stall, I-5133). Read the stack dump just before the line:
          svc-voice's stderr entries "Thread 0x... (most recent call first)"
          just before its `voice_loop_lag` line, whose `where` code names the
          kind of stall; then svc-voice's CPU and the database connects
          through its proxy in the same minutes (`canary-sql`). A dump with
          no line after it is a loop that never came back: the instance needs
          replacing. The line and the metrics carry no call.
        conditions:
          - name: "a lag of five seconds or more in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/voice_loop_lag_over_5s" AND resource.type = "cloud_run_revision"
              threshold_value: 0
              alignment_period: "300s"
          - name: "three lags of a second or more in five minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/voice_loop_lag_over_1s" AND resource.type = "cloud_run_revision"
              threshold_value: 2
              alignment_period: "300s"
          - name: "a stack dump: the loop had not beaten for five seconds"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/voice_stack_dumps" AND resource.type = "cloud_run_revision"
              threshold_value: 0
              alignment_period: "300s"

      # The warm-up keeps the first call's cold path warm (call-center
      # ef3ad77); a step failing again and again means the next call pays for
      # it on the loop. A warning, by the step.
      voice-keep-warm-failing:
        display_name: "svc-voice: a keep-warm step keeps failing"
        tier: p3
        subject: "svc-voice keep-warm failing: ${metric_or_resource.label.code}"
        documentation: >-
          One of svc-voice's keep-warm steps failed or timed out more than
          three times in fifteen minutes, so the next call's first use of it
          is cold and may stall the loop (I-5133). Read svc-voice's
          `voice_keep_warm_failed` lines for the step (`imports`,
          `dialog_client`, `member_tools`, `envelope`, `registry`,
          `line_settings`, `ledger` or `standing_token`) and their
          `warm_error`, then what that step reaches (cc-db through the proxy,
          tpa-api, the model vendor).
        conditions:
          - name: "more than three failures of one step in fifteen minutes"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/voice_keep_warm_failures" AND resource.type = "cloud_run_revision"
              threshold_value: 3
              alignment_period: "900s"
              group_by_fields: ["metric.label.code"]

      jobs-failed:
        display_name: "a call-centre job execution failed"
        tier: p3
        subject: "call-centre job failed: ${metric_or_resource.label.job_name}"
        documentation: >-
          migrate-cc, cc-db's schema migration, failed (staffed desk only; a
          person runs it, row 134). It is read, never retried: read the
          execution's own lines before running it again.
        conditions:
          - name: "a failed execution"
            threshold:
              filter: >-
                metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
                AND metric.labels.result = "failed"
                AND resource.labels.job_name = one_of("migrate-cc")
              group_by_fields: ["resource.label.job_name"]

      # cc-db exists with the staffed desk alone; callcentre.tf drops both
      # policies without it, and the down policy while the instance is
      # stopped between sessions (database_activation_policy.cc_db NEVER).
      cc-db-down:
        display_name: "URGENT cc-db is down"
        tier: p1
        urgent: true
        documentation: >-
          Cloud SQL reported cc-db not up for five minutes: the staffed desk
          and svc-voice's hand-off ledger cannot be read. Check the instance in
          the console, then its operations.
        conditions:
          - name: "database/up below 1 for five minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/up" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":cc-db")
              comparison: "COMPARISON_LT"
              threshold_value: 1
              duration: "300s"
              alignment_period: "60s"
              per_series_aligner: "ALIGN_MAX"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]

      cc-db-disk:
        display_name: "cc-db disk above 85%"
        tier: p2
        documentation: >-
          cc-db's disk has stayed above 85 percent full for ten minutes.
          Automatic growth stops at the instance's disk_autoresize_limit
          (var.sizing); raise the limit or the disk before it fills.
        conditions:
          - name: "disk/utilization above 0.85 for ten minutes"
            threshold:
              filter: >-
                metric.type = "cloudsql.googleapis.com/database/disk/utilization" AND resource.type = "cloudsql_database"
                AND resource.labels.database_id = ends_with(":cc-db")
              threshold_value: 0.85
              duration: "600s"
              alignment_period: "300s"
              per_series_aligner: "ALIGN_MEAN"
              cross_series_reducer: "REDUCE_MAX"
              group_by_fields: ["resource.label.database_id"]


      # #202 (TP-152): the PHI project's two change alarms, here too, p2 and
      # told when they open (every apply that touches monitoring opens each
      # once). Counted over thirty minutes, so one apply is one incident.
      monitoring-changed:
        display_name: "an alert policy or notification channel changed"
        tier: p2
        subject: "alert policy or channel changed: ${metric_or_resource.label.operation}"
        documentation: >-
          An alert policy or a notification channel in the call-centre project was created,
          changed or deleted, a channel verified, or a snooze made or changed
          (the Admin Activity log; the incident's label is the method). The
          platform group may edit alerts here (roles/monitoring.editor, D-135),
          and an apply of the catalogue changes them too, so each apply opens
          this once, as expected. Read the project's Admin Activity log for the
          entry: who made it and what changed. A policy whose condition became
          a log match, a channel that is not the catalogue's, a snooze nobody
          announced, or this policy itself edited, snoozed or disabled is a
          finding; the next apply puts Terraform's policies back.
        conditions:
          - name: "a policy or channel change in the Admin Activity log"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/monitoring_changes" AND resource.type = "audited_resource"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a policy or channel change in the Admin Activity log (on global)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/monitoring_changes" AND resource.type = "global"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]

      log-counters-changed:
        display_name: "a log metric changed"
        tier: p2
        subject: "log metric changed: ${metric_or_resource.label.operation}"
        documentation: >-
          A log-based metric in the call-centre project was created, changed or deleted (the
          Admin Activity log; the incident's label is the method). The counters
          are what this project's alerts read, so a counter whose filter was
          narrowed or emptied silences its alert; an apply of the catalogue
          changes them too. Read the project's Admin Activity log for the
          entry: who made it and what changed. A change nobody announced, or
          one to `monitoring_changes` or `log_metric_changes` themselves, is a
          finding; the next apply puts the catalogue's counters back.
        conditions:
          - name: "a log metric change in the Admin Activity log (on metric)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "metric"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on audited_resource)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "audited_resource"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]
          - name: "a log metric change in the Admin Activity log (on global)"
            threshold:
              filter: >-
                metric.type = "logging.googleapis.com/user/log_metric_changes" AND resource.type = "global"
              alignment_period: "1800s"
              group_by_fields: ["metric.label.operation"]

# =============================================================================
# The synthetic checks' journeys (the owner's Q2 and Q3, 2026-10-11, the orchestrating
# session: "Yes (Recommended)" and "Yes, job creates them
# (Recommended)"; docs/infra/monitoring.md §5c). A section of its own, read by
# beta's root alone (synthetics.tf): its metric while any journey is built,
# paused or not (local.synthetic_log_metrics: a PromQL policy is refused over
# a log metric with no series, so the metric outlives a pause), its policies
# once per running journey, built, not paused and with every database it
# needs running (local.synthetic_policies). With every switch off nothing here
# reaches a plan. The app project receives the runner's lines.
#
# `__JOB__` in a policy is the journey's Cloud Run job (`synthetics-<journey>`),
# written in by the root once per running journey, and each policy's key
# there is `<key>-<journey>`. `urgent` is the journey's own (J1 and J2
# urgent, J3 normal; main.tf, local.synthetic_journeys), never this file's.
# No condition is a log match: the incident carries the job's name alone.
# =============================================================================
synthetics:
  log_metrics:
    synthetic_results:
      description: >-
        One per synthetic journey run: the runner's one result line
        (trellis-watchtower synthetics/, `synthetic_result`), by its Cloud Run
        job, its outcome (pass, fail, skipped, or error when the runner itself
        broke, was misconfigured or never got its own network path), its closed code and the last answer's
        status class. The line carries no token, cookie, id, number or body,
        and only those four are read; its `step` is a field, never a label.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name=~"^synthetics-"
        AND jsonPayload.message="synthetic_result"
      labels:
        job: 'EXTRACT(resource.labels.job_name)'
        outcome: 'REGEXP_EXTRACT(jsonPayload.outcome, "^(pass|fail|skipped|error)$")'
        code: 'REGEXP_EXTRACT(jsonPayload.code, "^([a-z][a-z0-9_]{0,39})$")'
        status_class: 'REGEXP_EXTRACT(jsonPayload.status_class, "^([1-5]xx)$")'

  alert_policies:
    # Three failures and no pass in sixteen minutes (#202; the live read:
    # most of its seven incidents, six to twelve minutes each, were a deploy
    # or an apply): three runs of a five-minute journey, so one or two bad
    # runs never page and a recovery closes it. The runner
    # never retries (a retry replays a TOTP step). A failure is a verdict about
    # the estate (the runner exits 0); a broken runner is `synthetic-broken`
    # and the journey's own `synthetic-job-failed` (it exits 1; the app
    # project's `jobs-failed` names its jobs one by one, never these).
    synthetic-failing:
      display_name: "synthetic journey failing: __JOB__"
      tier: p2
      documentation: >-
        The synthetic journey `__JOB__` failed three times in sixteen minutes
        with no pass between: a person signing in the same way would fail too. The
        incident names the job alone; the runner's result lines (Logs, the
        job's executions) carry the failing step's code and the answer's
        status class and the step it failed at, never a body. `credentials`
        or `locked` is the test login's (a wrong secret version, or auth's
        lockout: read auth-synthetic-principals in docs/infra/monitoring.md
        §5c before rotating); `iap` is the sign-in gate's; a 5xx class is
        the service's.
        The journey is paused, and this policy gone, while a database it needs
        is stopped on purpose (§5b).
      conditions:
        - name: "three failed runs and no pass in sixteen minutes"
          promql:
            query: >-
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="fail"}[16m])) >= 3)
              unless on(job_name)
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="pass"}[16m])) > 0)
            evaluation_interval: "60s"

    # The runner itself is broken or misconfigured (outcome `error`: code
    # `runner`, an unexpected exception; `config`, a bad setting or an
    # unusable credentials file; `iap_token`, no identity token; `egress`, its
    # own network path never opened within SYNTHETICS_EGRESS_WAIT_S). Not a verdict about the estate, so normal
    # routing whatever the journey's; the journey's `synthetic-job-failed`
    # opens beside it (exit 1). Since R380 (2026-10-17) a failed run is a run,
    # so errors run after run add no missed run: that is a journey that did
    # not run at all (900 s with no execution).
    synthetic-broken:
      display_name: "synthetic journey broken: __JOB__"
      tier: p2
      documentation: >-
        The synthetic journey `__JOB__`'s runner reported `error` in the last
        eleven minutes: it is broken (code `runner`), misconfigured (code
        `config`: a missing or bad setting, or a credentials file it cannot
        use; code `iap_token`: the metadata server gave its account no
        identity token), or never got its own network path (code `egress`:
        no two fresh connections in a row to the load balancer within its
        wait, SYNTHETICS_EGRESS_WAIT_S), so it is not checking anything.
        Read the job's last execution and its result line,
        then the job's environment and its pinned credentials version
        (synthetic_credentials_versions). For `egress`, the line's
        `steps_ms.egress` is how long it waited: a fresh Cloud Run job task's
        Direct VPC egress through Cloud NAT can pass no traffic for 30 s or
        more after it starts (Google's documented cold start), so one such
        run is the job's network still warming; run after run is the job's
        network or its firewall rules (1450 and 1460), unless the edge's own
        uptime checks are failing beside it. The journey's
        `synthetic-job-failed` opens beside this (an `error` exits 1); its
        missed run opens only if the job stops running at all (900 s with no
        execution, failed or not).
      conditions:
        - name: "an error result in eleven minutes"
          promql:
            query: >-
              sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="error"}[11m])) > 0
            evaluation_interval: "60s"

    # No result line at all for fifteen minutes from a journey that is not
    # paused ("synthetic checks not running"): three runs missed or mute. The
    # ten-minute hold covers the first run after the policy is made, as at an
    # unpause: the schedule's next five-minute mark, the runner's egress
    # warm-up (at most 120 s as each job sets it), the run, and Cloud
    # Logging's delay before the metric counts its line (the orchestrating
    # session's ruling, 2026-10-12: six minutes could open on a slow
    # warm-up). When it opens it is normal routing: email, Slack and
    # PagerDuty at WARNING, never a text. Beside it, the module's missed run
    # (900 s), also normal.
    synthetic-blind:
      display_name: "synthetic checks not running: __JOB__"
      tier: p2
      documentation: >-
        The synthetic journey `__JOB__` has written no result line for
        fifteen minutes and its schedule is not paused: nothing is checking
        that people can sign in. Read the job's executions (a missed run
        opens beside this one) and its Cloud Scheduler job, then the runner's
        own lines; a run that ended without its result line is the runner's
        fault, not the service's.
      conditions:
        - name: "no result line for fifteen minutes"
          promql:
            query: >-
              absent_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__"}[15m])
            duration: "600s"
            evaluation_interval: "60s"

    # The job itself failed (exit 1: the runner broke, or its line could not
    # be written). The app project's `jobs-failed` names its jobs one by one,
    # so each journey's own copy is here, and leaves with its journey; a
    # failed check is a verdict (exit 0) and never opens it.
    synthetic-job-failed:
      display_name: "synthetic job failed: __JOB__"
      tier: p3
      documentation: >-
        An execution of the synthetic journey's job `__JOB__` failed in the
        last ten minutes: the runner broke or could not write its result line
        (a failed check is a verdict and never fails the job). Read the
        execution's own lines; `synthetic-broken` is open beside this when
        the runner wrote its `error` line.
      conditions:
        - name: "a failed execution in ten minutes"
          promql:
            query: >-
              sum by (job_name) (increase(run_googleapis_com:job_completed_execution_count{monitored_resource="cloud_run_job", job_name="__JOB__", result="failed"}[10m])) > 0
            evaluation_interval: "60s"

# =============================================================================
# The sign-in robots (SR-OR-1, the owner, 2026-11-12: "What are we doing to
# ensure that we can have members and brokers sign into trellis? I need a way
# to ensure 100% this works and we can get a critical alert if they cant";
# "Yes the speed is good" for two failed runs in eleven minutes; D-336). A
# section of its own, read by beta's root alone (signinrobots.tf). The robots'
# result lines are the synthetics section's `synthetic_results` (their jobs are
# `synthetics-member-sign-in` and `synthetics-broker-sign-in`, inside its
# `^synthetics-` filter), which the root makes while any journey or robot is
# built, paused or not.
#
# The first five policies are written once per running robot (built, not
# paused, auth-db running): `__JOB__` is its job and `__WHO__` "Members" or
# "Brokers", and each key there is `<key>-<robot>`. `signin-checks-off` is p3
# here and a notice in the app project (the root's tier override: email and
# Slack, never PagerDuty). The last three and their two counters are written
# once, while the robots' two secrets exist (local.signin_robot_once_policies):
# `signin-robot-secret-read`, and over auth's `sign_in_robot_foreign` line
# `signin-robot-foreign-password` and `signin-robot-foreign-guess`. No
# condition is a log match: an incident carries the job's name or the
# counter's closed words alone, and each documentation says where to read who.
# =============================================================================
signin_robots:
  log_metrics:
    signin_robot_secret_read:
      description: >-
        One per read of a version of a sign-in robot's secret (signin-robot-member-credentials or signin-robot-broker-credentials) by anyone but sa-signin-robots itself, from the Data Access audit log: a refused read too, since the deny policy signin-robots-locks refuses every other reader, and a read as sa-signin-robots by a person or account acting as it (its delegation names a first-party principal, which a Cloud Run mount never does). The entry says who.
      filter: |
        log_id("cloudaudit.googleapis.com/data_access")
        AND protoPayload.serviceName="secretmanager.googleapis.com"
        AND protoPayload.methodName=~"AccessSecretVersion$"
        AND protoPayload.resourceName=~"/secrets/signin-robot-(member|broker)-credentials(/|$)"
        AND NOT (protoPayload.authenticationInfo.principalEmail=~"^sa-signin-robots@[a-z0-9-]+-tpa-app[.]iam[.]gserviceaccount[.]com$" AND NOT protoPayload.authenticationInfo.serviceAccountDelegationInfo.firstPartyPrincipal.principalEmail:*)

    # auth-notary 30a1e743 (the independent review's M1; SR-03): auth writes
    # one `sign_in_robot_foreign` line (logger auth.domain.sign_in_robots) per
    # sign-in robot attempt it refuses for coming from anywhere but the runner
    # (its address, the public portal, its own role): `level` ERROR when
    # `proved` (the robot's right password at /auth/login, or a live challenge
    # of its answered at /auth/mfa/verify: a secret that left its one reader),
    # WARNING when not (a wrong password at the robot's address). The line's
    # other fields are `outcome` refused, `reason` robot_foreign, `robot`,
    # `door` and `sub`; `sub` (the robot's prn_) is never read, and the line
    # carries no address, email, origin or password. A rename of the line or
    # its fields is class 2 with auth-notary (its invariant 52's note). Each
    # label is a closed REGEXP_EXTRACT alternation: `code` the level, `class`
    # the robot, `operation` the door.
    signin_robot_foreign:
      description: >-
        One per sign-in robot attempt auth refused for coming from anywhere but the robots' runner (auth's `sign_in_robot_foreign` line): `code` ERROR when it was proved (the robot's right password, or its live challenge answered, from elsewhere: a robot secret that left its one reader), WARNING when it was a wrong password at a robot's address; by robot (`class`, member or broker) and door (`operation`, login or verify). Never the robot's id, an address, an email or an origin.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.domain.sign_in_robots"
        AND jsonPayload.msg="sign_in_robot_foreign"
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.level, "^(ERROR|WARNING)$")'
        class: 'REGEXP_EXTRACT(jsonPayload.robot, "^(member|broker)$")'
        operation: 'REGEXP_EXTRACT(jsonPayload.door, "^(login|verify)$")'

  alert_policies:
    # The owner's two failed runs and no pass in eleven minutes. Runs are five
    # minutes apart and never retried, so it opens five to ten minutes after
    # the first failure, and a pass closes it. A failure is the runner's
    # verdict about the estate (it exits 0); its own fault is `error`
    # (signin-robot-broken). Ordinary deploys keep the robots on: two failed
    # runs in a rollout are two minutes members could not sign in.
    signin-failing:
      display_name: "URGENT sign-in failing: __JOB__"
      subject: "__WHO__ cannot sign in to the portal: two failed checks in 11 minutes"
      tier: p1
      urgent: true
      documentation: >-
        The sign-in robot `__JOB__` failed to sign in on the portal twice in eleven minutes with no pass between, at least one of them not a lockout: a person signing in the same way would fail too. The incident names the job alone; the robot's result lines (Logs, the job's executions) carry the failing step, its code and the answer's status class, never a body. `credentials` at `login` or `mfa_verify` is the robot's login (a wrong pinned version: read infra/README.md, "Sign-in robots", before rotating); `denied` is auth refusing the robot for a reason but the switch; `widened` is `/auth/me` naming more than the robot's one role (stop and read auth's audit); `connect`, `tls`, `timeout` or `status` before `login` is the portal's load balancer, certificate, Cloud Armor or web; a 5xx class is the service's. Two lockouts alone are `signin-robot-locked-out`. For a planned outage pause the robots first (signin_robots_paused).
      conditions:
        - name: "two failed runs and no pass in eleven minutes"
          promql:
            query: >-
              ((sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="fail"}[11m])) >= 2)
              and on(job_name)
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="fail", code!~"locked|rate_limited"}[11m])) > 0))
              unless on(job_name)
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="pass"}[11m])) > 0)
            evaluation_interval: "60s"

    # The robot locked out (423) or rate limited (429), twice in eleven
    # minutes with no pass, and no other failure among them (that is
    # `signin-failing`'s). Its own policy, so the page says which (SR-01,
    # point 3: a page an outsider can cause must not read as "members cannot
    # sign in"). p1 all the same, decided: an outsider cannot cause either on
    # the robots' own path. auth charges a robot's sign-in from any address but
    # the NAT's to its own `robot_foreign` bucket, never to the bucket the
    # robots' runs are checked against (SR-OR-1 blocker 1, the security review's
    # point 4), and Cloud Armor's and auth's rate limits key on the client's
    # address, which only the robots' NAT presents (armor-web's log, read
    # 2026-11-12: the rate-limit key is the NAT address). So a lockout here is
    # auth's buckets broken, a workload inside the network forging the address
    # (SR-18, accepted), or our own runs: and while it lasts the robot sees no
    # real outage. Lower it to p2 (one word) if auth's bucket ever lands
    # without that rule.
    signin-robot-locked-out:
      display_name: "URGENT sign-in check locked out: __JOB__"
      subject: "__WHO__' sign-in check is locked out or rate limited: two in 11 minutes"
      tier: p1
      urgent: true
      documentation: >-
        The sign-in robot `__JOB__` was refused twice in eleven minutes with `locked` (423) or `rate_limited` (429) and no pass, so it cannot see whether people can sign in. An outsider's guesses are charged to auth's separate robot bucket and cannot cause this on the robot's own path: read auth's lockout and rate-limit lines for the robot's login and the NAT addresses (a workload inside the network writing the robots' address, or auth's buckets broken), and armor-web's log for the NAT addresses. Do not rotate until the cause is known.
      conditions:
        - name: "two locked-out runs and no pass in eleven minutes"
          promql:
            query: >-
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="fail", code=~"locked|rate_limited"}[11m])) >= 2)
              unless on(job_name)
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="pass"}[11m])) > 0)
            evaluation_interval: "60s"

    # No result line at all for sixteen minutes: three runs missed or mute. A
    # robot auth has switched off still writes `disabled`, so this is our
    # scheduler, the job or the logs, not a switch. No line in six minutes,
    # held ten: sixteen after the last line, and at an unpause the first run
    # (the schedule's next mark, the egress warm-up, the run and Logging's
    # delay) lands inside the hold, as the orchestrating session ruled for the
    # journeys on 2026-10-12.
    signin-silent:
      display_name: "URGENT sign-in check not reporting: __JOB__"
      subject: "__WHO__' sign-in check has not reported for 16 minutes"
      tier: p1
      urgent: true
      documentation: >-
        The sign-in robot `__JOB__` has written no result line for sixteen minutes and it is not paused: nothing is checking that people can sign in. Read the job's executions and its Cloud Scheduler entry, then the runner's own lines; a run that ended without its result line is the runner's fault, not sign-in's.
      conditions:
        - name: "no result line for sixteen minutes"
          promql:
            query: >-
              absent_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__"}[6m])
            duration: "600s"
            evaluation_interval: "60s"

    # The robot's own fault (outcome `error`: `config`, `secrets`, `egress`,
    # `passkey` or `runner`): not a verdict about sign-in, so it can wait.
    signin-robot-broken:
      display_name: "sign-in check broken: __JOB__"
      subject: "__WHO__' sign-in check is broken (its own fault, not sign-in)"
      tier: p2
      documentation: >-
        The sign-in robot `__JOB__` reported `error` in the last eleven minutes: it is broken (`runner`), misconfigured (`config`, or a credentials file it cannot use), could not sign the passkey (`passkey`), or never got its own network path (`egress`: no two fresh connections in a row to the portal's load balancer within SYNTHETICS_EGRESS_WAIT_S; one such run is Cloud NAT warming, run after run is the job's network or rules 1452 and 1462). It is not checking anything until fixed. Read the job's last execution and its result line, then its environment and its pinned version (signin_robot_versions).
      conditions:
        - name: "an error result in eleven minutes"
          promql:
            query: >-
              sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="error"}[11m])) > 0
            evaluation_interval: "60s"

    # Switched off at auth for a day: a day of `disabled` and no pass. A
    # notice in the app project (email and Slack), never a page.
    signin-checks-off:
      display_name: "sign-in check switched off for a day: __JOB__"
      subject: "__WHO__' sign-in check has been switched off for a day"
      tier: p3
      documentation: >-
        The sign-in robot `__JOB__` has been refused by auth's switch (`skipped` / `disabled`) with no pass for a day: nothing has checked that people can sign in since. Turn it back on (signin_robot_principals_enabled) once its reason is done; after an off for doubt about a secret, rotate first (infra/README.md, "Sign-in robots").
      conditions:
        - name: "a day of disabled runs and no pass"
          promql:
            query: >-
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", code="disabled"}[24h])) > 0)
              unless on(job_name)
              (sum by (job_name) (sum_over_time(logging_googleapis_com:user_synthetic_results{monitored_resource="cloud_run_job", job_name="__JOB__", outcome="pass"}[24h])) > 0)
            evaluation_interval: "300s"

    # Any read of a robot's secret by anyone but the robots' own account, the
    # deny policy's refusals included: whoever reads one holds a robot login.
    signin-robot-secret-read:
      display_name: "URGENT someone but the sign-in robots read a robot's secret"
      subject: "Someone other than the sign-in robots read a sign-in robot's secret"
      tier: p1
      urgent: true
      documentation: >-
        A principal other than sa-signin-robots read, or tried to read, a version of signin-robot-member-credentials or signin-robot-broker-credentials, or someone acting as sa-signin-robots read one (the Data Access audit log; the deny policy signin-robots-locks refuses every other reader, so a refused try opens this too). Read the entry for who. If it is not ours: turn the robots off at auth (signin_robot_principals_enabled false), then rotate both logins (infra/README.md, "Sign-in robots").
      conditions:
        # The three resource types secret-version-disabled reads: Secret
        # Manager's audit entries land on `audited_resource` (live beta,
        # 2026-10-11 and 2026-11-12).
        - name: "a robot's secret read by another principal (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/signin_robot_secret_read" AND resource.type = "audited_resource"
        - name: "a robot's secret read by another principal (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/signin_robot_secret_read" AND resource.type = "global"
        - name: "a robot's secret read by another principal (on the secret)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/signin_robot_secret_read" AND resource.type = "secretmanager.googleapis.com/Secret"

    # auth's `sign_in_robot_foreign` at ERROR (auth-notary 30a1e743, asked by
    # its request `2026-11-12-auth-notary-to-tpa-platform-sign-in-robots-
    # phase-1.md` §F): a robot's right password at /auth/login, or a live
    # challenge of its answered at /auth/mfa/verify, from anywhere but its
    # runner. Only the runner holds either, so any one is a robot secret that
    # left its one reader (SR-03): p1, beside signin-robot-secret-read. auth
    # refused it, so nothing was signed in. Any one in five minutes.
    signin-robot-foreign-password:
      display_name: "URGENT a sign-in robot's password used from elsewhere"
      subject: "A sign-in robot's right password or live challenge was used from outside its runner: ${metric_or_resource.label.class}"
      tier: p1
      urgent: true
      documentation: >-
        auth refused a sign-in robot's right password at /auth/login, or the robot's live sign-in challenge at /auth/mfa/verify, because it came from somewhere other than the robots' runner (the app network's NAT addresses, the portal's own origin, the robot's own role): somebody holds what only the robots' account can read. Nothing was signed in (auth answered as for a wrong password, or with the challenge's 410). The subject names which robot (the counter's `class`), and the counter's `operation` which door; auth's audit chain holds a refused sign-in's address. Turn the robots off at auth (signin_robot_principals_enabled false), read the robots' secrets' Data Access entries (signin-robot-secret-read) and auth's audit, then rotate both logins (infra/README.md, "Sign-in robots"). The runner itself opens this only from an address auth was not given (the NAT's addresses changed before auth's revision took the new list) or off the portal's origin, and signin-failing opens beside it then. auth's own error counters count this line too (an ERROR of auth.domain.sign_in_robots), so its error alerts may open beside this one.
      conditions:
        - name: "a robot's right password or live challenge from elsewhere"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/signin_robot_foreign" AND resource.type = "cloud_run_revision" AND metric.labels.code = "ERROR"
            # One incident per robot: the subject names which.
            group_by_fields: ["metric.label.class"]

    # The same line at WARNING: a wrong password at a robot's address, from
    # anywhere but the runner. The bar is one line in fifteen minutes, from
    # what an internet scan does: a scan or a credential-stuffing list tries
    # addresses it has, and a robot's address is 128 random bits under
    # `sign-in-check.invalid`, published nowhere (no event, no admin list, no
    # mail), so a scan writes none of these lines at all; only someone who
    # learned the address (from a secret version or auth-db) can. And auth
    # charges every such try to the robot's foreign bucket and writes no line
    # once it is shut (its lock is five to ten tries in a fifteen- to
    # sixty-minute window), so a "burst" bar above one could be walked under
    # by pacing, and above five might never be reachable. p2, not p1: a guess
    # holds no password, auth refused it, and the robots' own sign-ins never
    # meet that bucket.
    signin-robot-foreign-guess:
      display_name: "someone tried a sign-in robot's login from elsewhere"
      subject: "Someone outside the runner tried a sign-in robot's login with a wrong password: ${metric_or_resource.label.class}"
      tier: p2
      documentation: >-
        auth refused a wrong password at a sign-in robot's own address, from somewhere other than the robots' runner, at least once in fifteen minutes. A robot's address is 128 random bits under sign-in-check.invalid and is published nowhere, so no internet scan reaches this: somebody learned the address from a robot's secret or from auth's database. Nothing was signed in, and the robots' own sign-ins are unaffected (auth charges these tries to the robot's separate foreign bucket). The subject names which robot (the counter's `class`); auth's audit chain holds each refused sign-in's address. Read the robots' secrets' Data Access entries (signin-robot-secret-read) and who can read auth-db; on any doubt, turn the robots off at auth (signin_robot_principals_enabled false) and rotate both logins (infra/README.md, "Sign-in robots").
      conditions:
        - name: "a wrong password at a robot's address from elsewhere in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/signin_robot_foreign" AND resource.type = "cloud_run_revision" AND metric.labels.code = "WARNING"
            alignment_period: "900s"
            group_by_fields: ["metric.label.class"]

# D-158 (the owner's R5040 and R5041, 2026-10-13): beta's text codes, the
# code sender in connectors (docs/services/connectors.md §4.6;
# docs/infra/monitoring.md §13). Read by beta's textcodes.tf alone, into the
# project the PHI role lives in (which receives connectors' logs), and only
# while var.beta_text_codes_enabled builds the sender: production-full reads
# none of it, and with the switch off beta makes none of it.
#
# The sender's lines carry ids and closed codes only: the challenge id, the
# outcome, the vendor's own id for the text and the vendor's numeric error
# code. Never a phone number, the code, the sentence or the vendor's words.
# No filter or extractor here reads anything but the service, the line's
# opening words, its outcome, its closed reason, its status and the vendor's
# five-digit error number; the challenge id on a line is never read.
beta_text_codes:
  log_metrics:
    connectors_beta_codes:
      description: >-
        One per code beta's text sender handled, and one when it reaches its
        ceiling for the day (connectors/lanes/beta_codes.py): by outcome
        (delivered or failed for a text it sent; refused for a code it would
        not send; held for the ceiling) and by the sender's closed code
        (`not_on_the_list`, `not_a_us_number`, `daily_ceiling`,
        `duplicate_claim`, a transport or status code of connectors.md §3.2).
        The challenge id on the line is never read.
      filter: |
        resource.type="cloud_run_revision"
        AND jsonPayload.service="connectors"
        AND jsonPayload.message=~"^(beta code |beta's code sender reached its ceiling for the day)"
      labels:
        outcome: 'EXTRACT(jsonPayload.outcome)'
        code: 'EXTRACT(jsonPayload.reason)'

    connectors_beta_code_vendor_refusals:
      description: >-
        One per text the vendor answered with a refusal (an HTTP status of 400
        or above on the sender's `beta code … outcome=failed` line), by the
        vendor's own five-digit error number where its answer named one
        (60410 is its fraud guard blocking a destination's number prefix,
        trellis-security TP-181). The number is from the vendor's published
        list; its words, which repeat the phone number, are never logged, and
        the sender writes only a number of five digits.
      filter: |
        resource.type="cloud_run_revision"
        AND jsonPayload.service="connectors"
        AND jsonPayload.message=~"^beta code "
        AND jsonPayload.outcome="failed"
        AND jsonPayload.status>=400
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.message, " vendor_code=([0-9]{5})")'

  alert_policies:
    # The callers list at the last hop refused a code: records handed out a
    # code for a number that is not on the phone line's callers list (or is
    # on it and is not a US number). Nothing was texted. On beta every made-up
    # member carries the seed's one phone (R250), so this means that phone is
    # not on the list, or the list changed under it.
    beta-text-off-list:
      display_name: "beta text codes: a code was not texted, its number is not on the callers list"
      tier: p3
      subject: "text code not texted, its number is off the callers list: ${metric_or_resource.label.code}"
      documentation: >-
        Beta's text sender claimed a one-time code and did not text it,
        because the number records handed out is not on the phone line's
        callers list (`not_on_the_list`) or is on it and is not a US number
        (`not_a_us_number`). Nothing left the platform, and the code was
        settled failed; the caller hears that a code was sent and receives
        none. Compare the callers list (voice_allowed_callers in beta's
        tfvars, which is also svc-voice's ALLOWED_CALLERS) with the phone the
        seed wrote on beta's made-up members (the secret seed-owner-phone):
        they must agree. The sender's line names the challenge id only.
      conditions:
        - name: "a code refused at the callers list"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_beta_codes" AND resource.type = "cloud_run_revision"
              AND metric.labels.code = one_of("not_on_the_list", "not_a_us_number")
            group_by_fields: ["metric.label.code"]

    # Wall 9 of the sender (D-231, the code lane): records answered the claim of
    # the challenge a lane row named with another challenge. Nothing was texted;
    # it can only be a fault in records' claim, so it pages, at p2.
    beta-text-not-the-named:
      display_name: "beta text codes: records handed out a challenge the code lane did not name"
      tier: p2
      subject: "text code not sent, records handed out a challenge the lane did not name"
      documentation: >-
        Beta's text sender heard records' code lane name one challenge, claimed
        it by its id, and was handed a different challenge. It did not text
        it: the code was settled failed (`not_the_named_challenge`) and the
        lane's row settled done. Records hands out only the challenge a claim
        names, so this is a fault in records' claim (its R7,
        `contactcenter.claim_code_delivery` with `challenge_id`), not a
        caller's: read records' lines for the request ids around it, and
        switch the sender off (beta_text_codes_enabled = false, or take
        records:deliver_code off the sender's grant row) until it is
        understood. The sender's line names the two challenge ids alone.
      conditions:
        - name: "a code handed out for another challenge than the one named"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_beta_codes" AND resource.type = "cloud_run_revision"
              AND metric.labels.code = "not_the_named_challenge"

    # The vendor answered a text with a refusal. 60410 is the Verify product's
    # fraud guard (TP-181): about six verifications to one number inside a
    # minute, none approved, and it blocked the number's whole prefix for
    # about twelve hours (the Orchestrator's probes of the real account,
    # 2026-10-13). The sender never tells the vendor a code was confirmed
    # (records checks it), so every one counts; the listed numbers go on the
    # vendor's Verify Safe List before "verify" is switched on.
    beta-text-vendor-refused:
      display_name: "beta text codes: the text vendor refused a code"
      tier: p2
      subject: "text vendor refused a text, its error number: ${metric_or_resource.label.code}"
      documentation: >-
        The text vendor answered one of beta's code texts with a refusal (an
        HTTP 4xx or 5xx). The incident's code is the vendor's own error
        number, to look up in the vendor's published list. 60410 is the
        Verify product's fraud guard: it blocked the destination's number
        prefix after several codes in a minute that nobody confirmed (seen on
        this account 2026-10-13, about six in a minute, blocked for about
        twelve hours). Stop test calls to that number, put the callers list's
        numbers on the vendor's Verify Safe List if they are not there, and
        wait the block out or lift it on the vendor's account. A 401 or 403
        with another number is usually the restricted key (the secret
        notify-sms-api-key's pinned version) or what the key may do. No
        number means the answer named none: read the sender's line for its
        status. The code was settled failed and is never sent again; the
        caller asks for another.
      conditions:
        - name: "a text the vendor refused"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_beta_code_vendor_refusals" AND resource.type = "cloud_run_revision"
            group_by_fields: ["metric.label.code"]

    # The sender's own ceiling for the day is spent: thirty texts at most
    # (beta_text_codes_daily_ceiling). It claims nothing more until the UTC
    # day turns, so no code leaves records either.
    beta-text-ceiling:
      display_name: "beta text codes: the day's ceiling is reached"
      tier: p2
      subject: "text codes: the day's ceiling is reached"
      documentation: >-
        Beta's text sender has started as many texts today as its ceiling
        allows (beta_text_codes_daily_ceiling, thirty at most) and claims no
        more codes until the UTC day turns: callers are told a code was sent
        and receive none. Thirty a day is more than testing needs, so read who
        is calling before raising nothing: the ceiling cannot be raised past
        thirty, and a restart of the sender starts its count again (records'
        own thirty a day still holds).
      conditions:
        - name: "the ceiling line"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_beta_codes" AND resource.type = "cloud_run_revision"
              AND metric.labels.code = "daily_ceiling"

    # connectors-stalled's twin for a connectors built as the code sender
    # alone (that policy follows the outbox lanes' own switch). The delivery
    # loop writes its pass line whatever it claims, and a sender that dies
    # takes the process with it, so no pass line means no sender.
    beta-text-sender-stalled:
      display_name: "beta text codes: the sender wrote no pass line for five minutes"
      tier: p2
      subject: "text codes: the sender wrote no pass line for five minutes"
      documentation: >-
        connectors, which is beta's text sender, wrote no pass line for five
        minutes: it is down, stuck or was refused at start (a setting, the
        mounted key, or the project it runs in), so no code is texted. Read
        its revision's lines first: a refusal at start names the variable at
        fault and never a value.
      conditions:
        # By service, not by revision: a deploy is not a stalled loop.
        - name: "no pass line for five minutes"
          absent:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_passes" AND resource.type = "cloud_run_revision"
            duration: "300s"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["resource.label.service_name"]

# =============================================================================
# The text sender's SNI proxy (R504, the owner, 2026-11-02: "48 strict"; R505,
# "51 b."; D-236): beta's sniproxy.tf, read by beta's root alone, into the
# project the PHI role lives in, which runs the proxy and receives its lines,
# and only while var.beta_text_codes_proxy_enabled builds it (a plan with it
# off is today's). The proxy's lines are Envoy's own JSON access log
# (services/sni-proxy/envoy/*.yaml), sent by the VM's docker log driver
# (gcplogs: log `gcplogs-docker-driver`, the line in jsonPayload.message, the
# resource `gce_instance`). Its tripwire is a connection no filter chain took:
# a server name that is not the one host, none, or plain TCP. The SNI on the
# line is never read into a label (it is whatever the caller sent). The
# sender's own alerts (beta_text_codes, above) already catch a send the proxy
# could not carry.
# =============================================================================
sni_proxy:
  log_metrics:
    sni_proxy_refused:
      description: >-
        One per connection the text sender's SNI proxy refused: Envoy's
        listener wrote `sni_proxy_refused` (response flag NR, no filter chain
        matched), so the TLS server name asked for was not the one host the
        proxy passes, or there was none. A counter with no label: the server
        name, the caller's address and the flags on the line are never read
        into one.
      filter: |
        resource.type="gce_instance"
        AND logName:"gcplogs-docker-driver"
        AND jsonPayload.message:"sni_proxy_refused"

  alert_policies:
    # The tripwire (the design's option D): connectors' client dials the proxy
    # for its product's one host alone, with that server name, so nothing it
    # sends is ever refused. A refusal is something else on connectors'
    # subnet, or connectors itself, asking for another host.
    sni-proxy-refused:
      display_name: "URGENT the text sender's SNI proxy refused a connection"
      tier: p1
      urgent: true
      subject: "the text sender's SNI proxy refused a connection for another host"
      documentation: >-
        The SNI proxy in beta's member-data project closed a connection whose
        TLS server name was not the one vendor host it passes (or that had
        none). Only connectors' own subnet can reach it, and connectors asks
        for its product's host alone, so this is connectors, or something
        running in its subnet, trying to leave for another site. Read the
        proxy's lines (log gcplogs-docker-driver on the sni-proxy VM, event
        sni_proxy_refused) for the server name and the caller's address, then
        connectors' own lines around that time. If it is not explained by a
        deploy, switch the sender off (beta_text_codes_enabled = false) and
        treat it as an incident: nothing left, but something asked.
      conditions:
        - name: "a refused connection"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sni_proxy_refused" AND resource.type = "gce_instance"

    # The VM is gone or stopped: Compute Engine reports a running instance's
    # uptime every minute, and the proxy is one instance. Envoy itself is
    # restarted on the VM by systemd and its watchdog; a VM that stays down
    # takes every text with it (each fails closed and the caller asks again).
    sni-proxy-down:
      display_name: "beta text codes: the SNI proxy's VM has reported nothing for ten minutes"
      tier: p2
      subject: "the text sender's SNI proxy VM is down"
      documentation: >-
        The sni-proxy VM in beta's member-data project has reported no uptime
        for ten minutes: it is stopped, being replaced, or gone. While it is
        down no code is texted (connectors dials the proxy alone, R504), and
        each send fails closed. Read the instance's state in the console
        (Compute Engine, sni-proxy) and its serial and system logs; an apply
        that changed the proxy's image, host or OS image replaces the VM and
        takes a minute or two. Starting it again is an apply, or the
        console's start.
      conditions:
        - name: "no uptime for ten minutes"
          absent:
            filter: >-
              metric.type = "compute.googleapis.com/instance/uptime" AND resource.type = "gce_instance"
              AND metric.labels.instance_name = "sni-proxy"
            duration: "600s"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["metric.label.instance_name"]

# =============================================================================
# S2 on beta (R430, the owner's teammate, 2026-10-21: "yes won deals
# information can go from crm to tpa automatically"; R434: "ship with s2 off
# for now and then spin up sub agents to get it built on beta"): the CRM beta
# copy's sender job, crm-lane-send (beta's crm.tf). Read by beta's root alone,
# into the project the CRM's role lives in (beta's app project), and only
# while var.crm_lane_send_enabled opens S2 (a plan with it off is today's).
# Its missed run is the module's (crm.tf, crm_lane_send_missed_runs). The
# pass's lines are the CRM's: its drain's (engine/app/partner/drain.py, logger
# `network.partner.drain`) and its job module's (engine/app/partner/
# send_once.py, logger `network.partner.send_once`: a pass that raised), each
# `msg` and a closed `outcome`; a pass's own report line (`tpa outbox pass`,
# and send_once's JSON report on stdout, counts and an idle word) is never
# read into a label.
# =============================================================================
crm_lane_send:
  log_metrics:
    crm_lane_send_errors:
      description: >-
        One per error line of the CRM beta copy's sender job: its drain's (the
        lane on and not configured, `not_configured`; no workload token or
        identity token to send with, `unavailable`: auth, the metadata server
        or the copy's registration; a queued row off its schema, dead and never
        signed, `schema_refused`) and its job module's (a pass that raised,
        `failed`, the exception's type alone). By that closed outcome alone;
        the row's transition id and path, and the exception's type, on the
        line are never read.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="crm-lane-send"
        AND (jsonPayload.logger="network.partner.drain" OR jsonPayload.logger="network.partner.send_once")
        AND jsonPayload.level="ERROR"
      labels:
        outcome: 'REGEXP_EXTRACT(jsonPayload.outcome, "^(not_configured|unavailable|schema_refused|failed)$")'

  alert_policies:
    # R380's twice in a row (the app project's `jobs-failed`), as a policy of
    # its own so the catalogue's lists stay what they were while S2 is off.
    crm-lane-send-failed:
      display_name: "the CRM copy's won-deal sender failed twice in a row"
      tier: p2
      subject: "CRM copy's won-deal sender failed twice in a row: ${metric_or_resource.label.job_name}"
      documentation: >-
        The CRM beta copy's sender job (crm-lane-send, one pass of its outbox
        drain for won deals, every few minutes) failed twice in a row with no
        successful run between. A pass fails when the lane is not configured
        or it holds no credentials to send with (auth's workload token for the
        copy's partner registration, or an identity token); a delivery the TPA
        refused or could not take is retried or dead-lettered by the pass
        itself and does not fail it. Read the executions' own lines (their
        `tpa outbox pass` line counts, their error lines name an outcome),
        then auth's (the registration, R430's in-person step) and tpa-api's.
        Waiting won deals stay queued in the copy and go in order once it
        recovers.
      conditions:
        - name: "the sender failed twice in a row"
          failed_twice:
            jobs: ["crm-lane-send"]

    crm-lane-send-refused:
      display_name: "the CRM copy's won-deal sender could not send"
      tier: p3
      subject: "CRM copy's won-deal sender could not send: ${metric_or_resource.label.outcome}"
      documentation: >-
        The CRM beta copy's sender job wrote an error line: `unavailable` (no
        workload token from auth, or no identity token: the copy's partner
        registration, auth's caller list or its endpoint), `not_configured`
        (the job's settings are short of the send shape: read its revision's
        environment names, never their values), `schema_refused` (a queued
        won deal that is off the lane's schema, dead-lettered unsigned; the
        copy's admin "TPA lane" page shows it, and its replay route resends it
        once fixed) or `failed` (the pass raised: its line names the
        exception's type alone, so read the execution's other lines; crm-db
        through the proxy is the first suspect). Nothing more was sent for
        that pass; a row is never sent twice.
      conditions:
        - name: "an error line"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_lane_send_errors" AND resource.type = "cloud_run_job"
            group_by_fields: ["metric.label.outcome"]

# =============================================================================
# S4 on beta (R441, the owner, 2026-10-23: "can you spin up as many sub agents
# as you need to for you to build s3/s4 in the next 2 hours"; its ruling:
# S3 and S4 built on beta switched off, every class 3, cost or in-person item
# on the owner's list): the CRM beta copy's commission pass, the job
# crm-lane-comp (beta's crm.tf), and the sender's statement replies. Read by
# beta's root alone, into the project the CRM's role lives in, crm_lane_comp
# while var.crm_lane_comp_enabled builds the pass and crm_lane_statements
# while var.crm_lane_send_statements_enabled has the sender send statements
# (a plan with either off is today's). The pass's missed run is the module's
# (crm.tf, crm_lane_comp_missed_runs). Every line read is the CRM's own, by
# its logger and its level (the S2 review's lesson, c27a1cba): on the pass,
# its job module's (engine/app/partner/comp_once.py, logger
# `network.partner.comp_once`: a pass that raised, "a TPA lane commission
# pass failed"; the CRM's S4 commit, not yet at its 293d7ff1), the sweep's
# (engine/app/services/comp_calc.py, `network.comp_calc`: "a commission
# calculation failed", one invoice) and the builder's
# (engine/app/services/comp_statements.py, `network.comp_statements`: "a
# commission statement could not be built", one payee's month); on the
# sender, comp_statements' reply lines (`network.comp_statements`: "the TPA
# rejected a commission statement" at WARNING with its `alert`, and its two
# ERRORs). A label is the logger's last word (`operation`) or the line's fixed
# sentence (`outcome`, one of three), never a field the line carries (an id, a
# period, a code).
# =============================================================================
crm_lane_comp:
  log_metrics:
    crm_lane_comp_errors:
      description: >-
        One per error line of the CRM beta copy's commission pass job: its job
        module's (a pass that raised, `comp_once`), the nightly calculation's
        (an invoice whose commission could not be calculated, `comp_calc`; the
        next night retries it) and the statement builder's (a payee's month
        whose statement could not be built, `comp_statements`; its earnings
        wait). By the line's logger alone; the invoice id, the period and the
        payee kind on the line are never read; `operation` is the logger's
        last word.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="crm-lane-comp"
        AND (jsonPayload.logger="network.partner.comp_once" OR jsonPayload.logger="network.comp_calc" OR jsonPayload.logger="network.comp_statements")
        AND jsonPayload.level="ERROR"
      labels:
        operation: 'REGEXP_EXTRACT(jsonPayload.logger, "^network[.](?:partner[.])?(comp_once|comp_calc|comp_statements)$")'

  alert_policies:
    # R380's twice in a row, as S2's sender's: a policy of its own, so the
    # catalogue's lists stay what they were while S4 is off.
    crm-lane-comp-failed:
      display_name: "the CRM copy's commission pass failed twice in a row"
      tier: p2
      subject: "CRM copy's commission pass failed twice in a row: ${metric_or_resource.label.job_name}"
      documentation: >-
        The CRM beta copy's commission pass (crm-lane-comp, the CRM's own
        nightly commission step for its lane business, every hour at :40,
        doing its work once a night after 01:00 and 01:30 of the business's
        day) failed twice in a row with no successful run between. A pass
        fails when it raised (its `a TPA lane commission pass failed` line
        names the exception's type alone) or when the lane's business is not
        configured; one invoice or one statement that fails is a line of its
        own and does not fail the pass. Read the executions' own lines (the
        JSON report on stdout counts and an idle word), then crm-db through
        the proxy, the first suspect. The night's claim is taken before the
        work, so a crashed calculation or build is not retried that night;
        calculation also runs on each paid invoice's receipt, so only the
        statements wait a day.
      conditions:
        - name: "the pass failed twice in a row"
          failed_twice:
            jobs: ["crm-lane-comp"]

    crm-lane-comp-errors:
      display_name: "the CRM copy's commission pass wrote an error line"
      tier: p3
      subject: "CRM copy's commission pass wrote an error line: ${metric_or_resource.label.operation}"
      documentation: >-
        The CRM beta copy's commission pass wrote an error line: `comp_once`
        (the pass raised; its line names the exception's type alone),
        `comp_calc` (one paid or reversed invoice's commission could not be
        calculated; the next night's sweep tries it again) or
        `comp_statements` (one payee's month could not be built into a
        statement; its earnings wait for the next night). Read the job's
        executions' lines in the CRM's project; nothing left the copy because
        of it.
      conditions:
        - name: "an error line"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_lane_comp_errors" AND resource.type = "cloud_run_job"
            group_by_fields: ["metric.label.operation"]

crm_lane_statements:
  log_metrics:
    crm_lane_statement_replies:
      description: >-
        One per line the CRM beta copy's sender job writes about a
        commission statement's reply from the TPA: the TPA rejected a
        statement (records' business rejection, at WARNING with its alert
        comp_statement_rejected), or the reply could not be placed (it names
        no statement the copy sent, or answers one under another id; at
        ERROR). By the line's fixed sentence alone, the label `outcome` one
        of the three; the statement's reference,
        its rejection code and the transition id on the line are never read.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="crm-lane-send"
        AND jsonPayload.logger="network.comp_statements"
        AND (jsonPayload.alert="comp_statement_rejected" OR jsonPayload.level="ERROR")
      labels:
        outcome: 'REGEXP_EXTRACT(jsonPayload.msg, "^(the TPA rejected a commission statement|a statement reply names no statement this business sent|the TPA answered a statement under another id)$")'

  alert_policies:
    crm-lane-statement-replies:
      display_name: "the TPA rejected or misplaced a CRM copy's statement"
      tier: p2
      subject: "CRM copy's commission statement: ${metric_or_resource.label.outcome}"
      documentation: >-
        The CRM beta copy's sender job sent a commission statement and wrote
        one of three lines about the TPA's answer: "the TPA rejected a
        commission statement" (records checked it against what the TPA
        invoiced and was paid and refused it, with a closed rejection code:
        invoice_not_paid, sponsor_mismatch, count_mismatch, amount_mismatch,
        cap_exceeded, total_mismatch, parts_mismatch or
        superseded_after_paid; the copy's admin pages show which statement and
        why), "a statement reply names no statement this business sent", or
        "the TPA answered a statement under another id" (the copy and the TPA
        disagree about which statement this is: read records' statement for
        the copy's reference before any resend). Nothing is sent twice; a
        rejected statement is rebuilt by the copy once its facts are fixed.
      conditions:
        - name: "a statement reply line"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_lane_statement_replies" AND resource.type = "cloud_run_job"
            group_by_fields: ["metric.label.outcome"]

# =============================================================================
# The PHI project's perimeter while it is in dry run (R380, the owner,
# 2026-10-17: "226 yes 1,2,3"; I-604). Read by beta's root alone: while
# var.perimeter_dry_run is true it puts this policy in place of the PHI
# project's per-violation `perimeter-violations` above, under the same key, so
# the policy is changed in place and never made beside it; enforced, the
# per-violation policy comes back exactly as written. A dry-run perimeter
# refuses nothing, and beta's logged 500 and more a day once it was created,
# almost all people's own console, gcloud and Terraform reads while its
# break-glass level is off (I-347, D143): one notification each buried every
# other alert. Nothing about the violations themselves changes: the same
# counter (`perimeter_violations`), the same entries in Cloud Logging and,
# through the audit sinks, in the vault. production-full reads none of it.
# =============================================================================
perimeter_dry_run:
  alert_policies:
    perimeter-violations:
      display_name: "perimeter violations in dry run (the day's count)"
      tier: p3
      subject: "perimeter dry run: violations in the last 24 hours"
      # Opened once a day and told then; its close, a few minutes later, is
      # not told (Cloud Monitoring's AlertStrategy).
      notification_prompts: ["OPENED"]
      documentation: >-
        The PHI project's perimeter is in dry run: it refused nothing, and it
        logged the violations counted here in the 24 hours before about 14:00
        UTC (the notification's observed value is the count; no reason or
        service is in it). One notification a day, at about 14:00 UTC (09:00
        in Chicago in summer, 08:00 in winter), none on a day with no
        violation, and the incident closes by itself within about twenty
        minutes, untold. Read the day's entries in the PHI project's logs (the
        VpcServiceControlAuditMetadata entries, dry run) against
        network-and-perimeter.md §5.5 before the flip: NO_MATCHING_ACCESS_LEVEL
        on a person's own console, gcloud or Terraform read is expected while
        the break-glass level is off (D143); a service account's entry, or
        RESOURCES_NOT_IN_SAME_SERVICE_PERIMETER, is what to read first.
        Enforced, the per-violation policy is back.
      conditions:
        # The day's count, read in one ten-minute window a day: true from
        # 14:00 to 14:10 UTC when the 24 hours before held any violation, so
        # one incident opens at the first evaluation in it and closes once it
        # ends (Google closes a PromQL incident twice the evaluation interval
        # after the condition was last met). Inside the 25 hours Google alerts
        # over for a log metric; five minutes is the interval, twice in the
        # window.
        - name: "violations in the 24 hours before 14:00 UTC"
          promql:
            query: >-
              sum(increase(logging_googleapis_com:user_perimeter_violations{monitored_resource="audited_resource"}[24h])) > 0
              and on() (hour() == 14 and minute() < 10)
            evaluation_interval: "300s"

# =============================================================================
# The administrator-feed importer on beta (OWNER-EV-10, OWNER-EV-12: "51.8
# sure", Cloud Monitoring alerts until the staff alert lane delivers records'
# own alert; the importer review's F7; and the owner, 2026-11-01: "Also ensure
# we have alerting enabled, if an api pull fails for any reason I want to
# know about it. Also if the api runs but doesn't seem to pull the right
# amount of data i should be informed also."). Beta's alone and only with
# var.feed_ingest_enabled (beta's feedingest.tf), but for the count of
# records' source_sync.alert lines, which beta makes whatever the switch says
# (D-181: the monitoring website charts it, and a chart over a counter that
# does not exist is a failed query); production-full reads none of it.
# `feed_ingest` and `feed_ingest_volume` are the app role's (the project that
# runs the job and receives its logs); `feed_ingest_records` is the PHI
# role's (the project that receives records' logs). Codes and counts only: no
# run id, tenant, employer, member or person is read into a label, and no
# count of people reaches a notification (the volume policies' value is a
# ratio, this run's count over the earlier runs'). The missed-run policy is
# the module's own, from beta's local.feed_ingest_missed_runs (79200s, 22
# hours, beside the 19 hours between 12:00 and the next day's 07:00, 20 on
# the night the clocks go back), while the schedule is unpaused. A schedule
# that cannot start the job is `feed-ingest-start-failed` below (p1), beside
# the app project's shared `scheduler-failed` (p2), which names it too. Every
# other line read here is the importer's own summary line
# (feed-ingest feeds/everon/summary.py: one JSON line a run on stdout,
# `message` "everon.run.summary", which names its own `severity`, so the
# entry's severity is the line's: ERROR for a run that exited 1 or 2,
# WARNING for one that held anything back, INFO for a whole run).
# =============================================================================
feed_ingest:
  log_metrics:
    # A live run that did not end whole: the summary line at WARNING or
    # above. summary.py's `_severity`: ERROR when the run exited 1 or 2 (it
    # failed, was refused, locked or stopped: `feed-ingest-failed` opens on
    # its execution too); WARNING when it exited 0 having held anything back
    # (a hold beyond an employers-only run's own, an employer refused or not
    # applied, people held, a member-id collision); INFO for a whole run, and
    # for one whose only holds are employers a person blocked in records.
    # Beside it the fallback line summary.py prints when the line itself
    # could not be built (`{"message":"everon.run.summary","severity":"ERROR",
    # "outcome":"summary_failed"}`, no mode), which never changes the run's
    # exit status. The outcome is summary.py's own closed word (ok, hold,
    # refused, locked, stopped, summary_failed, ...); nothing else is read.
    everon_runs_not_whole:
      description: >-
        One per live run of the Everon importer that did not end whole: its
        summary line (everon.run.summary) at WARNING or ERROR, or the line's
        own fallback when it could not be built. By the run's outcome word
        alone; no count, run id, employer or person is read.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="feed-ingest-everon-sync"
        AND jsonPayload.message="everon.run.summary"
        AND (jsonPayload.mode="live" OR jsonPayload.outcome="summary_failed")
        AND severity>=WARNING
      labels:
        outcome: 'EXTRACT(jsonPayload.outcome)'

    # The volume check's two counts, one point a run: the employers in scope
    # and the people built from them, as the summary line of a live
    # whole-book run (the schedule's `--scheduled`, or the job run by hand
    # with its own arguments) that exited 0 counts them. A run that exited 1
    # or 2 is left out: its counts are zeros or partial, and its failure is
    # `feed-ingest-failed`'s and `feed-ingest-not-whole`'s to tell. Values,
    # never labels; the buckets are only the distribution's shape (the
    # policies read `_sum` and `_count`, the run's own value and that it ran).
    everon_book_employers:
      description: >-
        The employers in scope of each live whole-book run of the Everon
        importer that exited 0 (its summary line's employers_in_scope), one
        point a run, for the volume check. No label.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="feed-ingest-everon-sync"
        AND jsonPayload.message="everon.run.summary"
        AND jsonPayload.mode="live"
        AND jsonPayload.scope="whole_book"
        AND jsonPayload.exit_code=0
      value_extractor: 'EXTRACT(jsonPayload.employers_in_scope)'
      unit: "1"
      bounds: [1, 2, 5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 150, 200, 300, 500, 1000]

    everon_book_people:
      description: >-
        The people built from the employers in scope of each live whole-book
        run of the Everon importer that exited 0 (its summary line's people),
        one point a run, for the volume check. No label.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="feed-ingest-everon-sync"
        AND jsonPayload.message="everon.run.summary"
        AND jsonPayload.mode="live"
        AND jsonPayload.scope="whole_book"
        AND jsonPayload.exit_code=0
      value_extractor: 'EXTRACT(jsonPayload.people)'
      unit: "1"
      bounds: [1, 10, 100, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 5000, 7500, 10000, 25000, 50000, 100000]

  alert_policies:
    feed-ingest-failed:
      display_name: "URGENT the Everon importer's run failed"
      tier: p1
      urgent: true
      subject: "Everon importer run failed: ${metric_or_resource.label.job_name}"
      documentation: >-
        An execution of the administrator-feed importer's scheduled Everon sync
        (feed-ingest-everon-sync, 07:00 and 12:00 Chicago time, never retried)
        failed. One failure opens it: each run is the book's next
        reconciliation. A run fails when it raised, when records or auth
        refused it (a refused mint, a 403, records not ready), when records
        still held another run open (its `run.skipped.run_open` alarm), when
        it ran out of its 2h10m, or while feed-ingest's RECORDS_READY or
        RECORDS_EXPIRES_AT is still False (each refuses before reading). Read
        the execution's own lines in Cloud Logging (its everon.run.summary
        line last: codes and counts; no member, employer or key is ever in
        them), then the ops portal's sync runs and data issues pages
        (list_sync_runs, list_data_issues) for the run and its issues.
        `feed-ingest-not-whole` opens beside this for the same run. The next
        slot runs on its own; pause the schedule (feed_ingest_paused) to stop
        it.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "a failed execution"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
              AND metric.labels.result = "failed"
              AND resource.labels.job_name = "feed-ingest-everon-sync"
            group_by_fields: ["resource.label.job_name"]

    # Cloud Scheduler could not start the importer: the app project's shared
    # `scheduler_failures` counter (an AttemptFinished entry at ERROR, by the
    # attempt's status) for this one job, one failed start opening it, as
    # `scheduler-failed`'s condition for an hourly or daily schedule reads it.
    # The shared policy names the job too and keeps its own tier (p2); this
    # one is the importer's alone, at p1, so a failed start is told at once
    # and not only by the missed run 22 hours later (the owner, 2026-11-01:
    # a pull that fails "for any reason").
    feed-ingest-start-failed:
      display_name: "URGENT Cloud Scheduler could not start the Everon importer"
      tier: p1
      urgent: true
      subject: "Everon importer could not be started: ${metric_or_resource.label.job_id}"
      documentation: >-
        Cloud Scheduler tried to start the administrator-feed importer's
        scheduled Everon sync (feed-ingest-everon-sync, 07:00 and 12:00
        Chicago time) and the attempt failed: no execution ran, so this slot's
        pull did not happen, and the scheduler does not retry it (the next
        slot is the retry). The scheduler job's AttemptFinished entry in Cloud
        Logging (resource cloud_scheduler_job, job_id feed-ingest-everon-sync)
        gives the status: PERMISSION_DENIED means the scheduler's invoker grant
        on the job (inventory row 205) is not what the gate holds; NOT_FOUND
        that the Cloud Run job is gone or renamed; UNAVAILABLE or INTERNAL is
        Cloud Scheduler's own and worth a support case once it persists. Then
        the job's executions (none for the slot), and the ops portal's sync
        runs and data issues pages (list_sync_runs, list_data_issues), where
        the slot's run is missing. A person may run the job by hand (gcloud run
        jobs execute feed-ingest-everon-sync) once the cause is fixed.
        `scheduler-failed` opens beside this for the same attempt.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "a failed start of the importer's schedule"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/scheduler_failures" AND resource.type = "cloud_scheduler_job"
              AND resource.labels.job_id = "feed-ingest-everon-sync"
            group_by_fields: ["resource.label.job_id"]

    # One run that did not end whole is told: each run is the book's next
    # reconciliation, and a run held back at WARNING still exits 0, so
    # `feed-ingest-failed` never sees it. One incident an outcome word.
    feed-ingest-not-whole:
      display_name: "URGENT an Everon importer live run did not end whole"
      tier: p1
      urgent: true
      subject: "Everon importer run did not end whole: ${metric_or_resource.label.outcome}"
      documentation: >-
        A live run of the Everon importer (feed-ingest-everon-sync) ended with
        its summary line at WARNING or ERROR, or could not write its summary
        at all (outcome summary_failed). The incident's label is the run's
        outcome word: hold (an employer held back or not applied, people held,
        a member-id collision; the execution still exited 0), refused, locked
        or stopped (the execution failed too, so `feed-ingest-failed` opens
        beside this). A whole run, and one whose only holds are employers a
        person blocked in records, is INFO and opens nothing. Read the run's
        everon.run.summary line in Cloud Logging (the execution's last line:
        its employer_codes, run_codes, employers_by_outcome and
        digest_differs, all codes and counts), then the ops portal's sync
        runs and data issues pages (list_sync_runs, list_data_issues) for the
        run's employers and issues. The next slot runs on its own.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "a live run's summary at WARNING or above"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/everon_runs_not_whole" AND resource.type = "cloud_run_job"
            group_by_fields: ["metric.label.outcome"]

# =============================================================================
# The volume check (the owner, 2026-11-01: "if the api runs but doesn't seem
# to pull the right amount of data i should be informed also"). Four PromQL
# policies over `feed_ingest`'s two distributions, each a live whole-book run
# that exited 0 compared with the run before it (the most of the runs in the
# earlier window, in practice that one run). Beta's feedingest.tf writes each
# __NAME__ from its local
# feed_ingest_volume (the windows and the three thresholds, one place to
# change them) and makes these only while var.feed_ingest_volume_alerts: a
# second apply, once a run has written the counters' first points, because
# Cloud Monitoring refuses a PromQL policy over a log metric with no series
# yet (synthetics.tf's lesson, 400 "The following PromQL metric(s) are
# invalid").
#
# How a run reads in PromQL (checked on beta, read only, 2026-11-01, against
# tpa_api_latency, a DELTA distribution log metric like these): each
# per-minute point holds that minute's own delta (count_over_time, a point a
# minute; sum_over_time the minutes' sum; increase the window's), not a
# running total, and a minute with an entry is followed by a few zero points.
# A run writes one entry, so its minute's point is `_sum` = its count and
# `_count` = 1, and the zero points after it are `_sum` = 0, `_count` = 0.
# So:
# - this run: max_over_time(_sum[__RUN_WINDOW__]), guarded by
#   max_over_time(_count[__RUN_WINDOW__]) >= 1, so the zero points a run
#   just outside the window left behind never read as a run of nothing;
# - the runs before it: max_over_time(_sum[__BASELINE_RANGE__] offset
#   __BASELINE_OFFSET__), the most of every run in that window, which zero
#   points cannot raise.
# The window for this run is shorter than the offset, so the two never
# share a point. The schedule is 07:00 and 12:00 Chicago time, so runs are 5
# and 19 hours apart (18 and 20 on the nights the clocks move) and a run
# lasts at most 2h10m: the run window (90 minutes) holds one run alone
# (the least gap between two runs' ends is 5h less 2h10m), and the earlier
# window reaches 22h30m to 24h back from the run's end, so it always holds
# the run before (the most is 20h plus 2h10m). The run before that, 24 hours
# back, sits at the window's edge and is in it only rarely (about 3 percent of
# the time over two years of slots, the review of 2026-11-01), so in practice
# each run is compared with the one before it. 24 hours in all, inside the 25
# hours Google alerts on for a user log metric.
# tests/infra/test_beta_feed_ingest.py holds the windows to the schedule.
# Each is true while the run is in its window (up to 90 minutes), then closes
# by itself, which is not a recovery: each notifies when it opens alone
# (`notification_prompts`, as the backup-missing policy does), p1 (the owner's
# choice of 2026-11-01: PagerDuty and email), and a person resolves it.
# Where it is blind: with no earlier qualifying run in the window (the first
# run, after a gap, or after a run that exited 1 or 2, which the counters
# leave out) the three comparisons are quiet and the read-nothing policy
# still reads the run alone; and a by-hand whole-book run within 90 minutes
# of a scheduled one shares its run window, where the higher of the two hides
# a drop in the other.
# =============================================================================
feed_ingest_volume:
  alert_policies:
    feed-ingest-employers-dropped:
      display_name: "URGENT the Everon importer read fewer employers than the day before"
      tier: p1
      urgent: true
      notification_prompts: ["OPENED"]
      subject: "Everon importer read fewer employers: ${metric_or_resource.label.job_name}"
      documentation: >-
        A live whole-book run of the Everon importer (feed-ingest-everon-sync)
        that exited 0 had fewer employers in scope than the run before it
        (the most of its runs in the __BASELINE_RANGE__ that end
        __BASELINE_OFFSET__ before now, in practice the one run before). The
        value is this run's count over that one, below __EMPLOYERS_FLOOR__. A group that left Everon's
        book does this once; a page of groups Everon did not answer does it
        too. Read the run's everon.run.summary line in Cloud Logging
        (employers_in_scope, employers_sendable, employers_refused, the
        codes), then the ops portal's sync runs page (list_sync_runs) for the
        run's employers beside the run before it, and its data issues page
        (list_data_issues). Zero employers is `feed-ingest-read-nothing`'s.
        It closes by itself once the run leaves its 90-minute window, which is
        not a recovery, so it notifies when it opens alone: resolve it in
        PagerDuty once the run is read.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "fewer employers than the run before"
          promql:
            query: >-
              max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__]))
              / max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__))
              < __EMPLOYERS_FLOOR__
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_count{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) >= 1
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) > 0
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__)) > 0
            evaluation_interval: "300s"

    feed-ingest-people-dropped:
      display_name: "URGENT the Everon importer read far fewer people than the day before"
      tier: p1
      urgent: true
      notification_prompts: ["OPENED"]
      subject: "Everon importer read fewer people: ${metric_or_resource.label.job_name}"
      documentation: >-
        A live whole-book run of the Everon importer (feed-ingest-everon-sync)
        that exited 0 built more than __PEOPLE_DROP_PERCENT__ percent fewer
        people than the run before it (the most of its runs in the
        __BASELINE_RANGE__ that end __BASELINE_OFFSET__ before now, in practice
        the one run before). The value is this run's count over that one,
        below __PEOPLE_FLOOR__. People
        are counted from the employers the run could
        send, so an employer refused or read short lowers it
        (`feed-ingest-not-whole` opens for a refused one); a book that really
        shrank that much in a day is rare. Read the run's everon.run.summary
        line in Cloud Logging (people, rows_read, employers_refused,
        people_held, the codes), then the ops portal's sync runs and data
        issues pages (list_sync_runs, list_data_issues).
        It closes by itself once the run leaves its 90-minute window, which is
        not a recovery, so it notifies when it opens alone: resolve it in
        PagerDuty once the run is read.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "people more than the floor below the run before"
          promql:
            query: >-
              max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__]))
              / max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__))
              < __PEOPLE_FLOOR__
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_count{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) >= 1
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) > 0
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__)) > 0
            evaluation_interval: "300s"

    feed-ingest-people-jumped:
      display_name: "URGENT the Everon importer read far more people than the day before"
      tier: p1
      urgent: true
      notification_prompts: ["OPENED"]
      subject: "Everon importer read more people: ${metric_or_resource.label.job_name}"
      documentation: >-
        A live whole-book run of the Everon importer (feed-ingest-everon-sync)
        that exited 0 built more than __PEOPLE_JUMP_PERCENT__ percent more
        people than the run before it (the most of its runs in the
        __BASELINE_RANGE__ that end __BASELINE_OFFSET__ before now, in practice
        the one run before): a page of people read twice, or a book doubled.
        The value is this run's count over that one, above __PEOPLE_CEILING__.
        A new group of that size joining in a day would do it too. Read the
        run's everon.run.summary line in Cloud Logging (people, rows_read,
        coverages, member_id_collisions, the codes), then the ops portal's
        sync runs and data issues pages (list_sync_runs, list_data_issues).
        It closes by itself once the run leaves its 90-minute window, which is
        not a recovery, so it notifies when it opens alone: resolve it in
        PagerDuty once the run is read.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "people more than the ceiling above the run before"
          promql:
            query: >-
              max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__]))
              / max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__))
              > __PEOPLE_CEILING__
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_count{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) >= 1
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__BASELINE_RANGE__] offset __BASELINE_OFFSET__)) > 0
            evaluation_interval: "300s"

    feed-ingest-read-nothing:
      display_name: "URGENT the Everon importer read no employers or no people"
      tier: p1
      urgent: true
      notification_prompts: ["OPENED"]
      subject: "Everon importer read nothing: ${metric_or_resource.label.job_name}"
      documentation: >-
        A live whole-book run of the Everon importer (feed-ingest-everon-sync)
        exited 0 with no employers in scope, or no people built from them: it
        found an empty book, with or without a run before it to compare with.
        Read the run's everon.run.summary line in Cloud Logging
        (employers_in_scope, employers_sendable, employers_refused, people,
        rows_read, the codes), then the ops portal's sync runs and data issues
        pages (list_sync_runs, list_data_issues). Nothing was sent for those
        employers; the next slot runs on its own.
        It closes by itself once the run leaves its 90-minute window, which is
        not a recovery, so it notifies when it opens alone: resolve it in
        PagerDuty once the run is read.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "a run with no employers or no people"
          promql:
            query: >-
              max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) == 0
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_employers_count{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) >= 1
              or max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_sum{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) == 0
              and on (job_name) max by (job_name) (max_over_time(logging_googleapis_com:user_everon_book_people_count{monitored_resource="cloud_run_job", job_name="feed-ingest-everon-sync"}[__RUN_WINDOW__])) >= 1
            evaluation_interval: "300s"

feed_ingest_records:
  log_metrics:
    source_sync_alerts:
      description: >-
        One per value-free `source_sync.alert` line records writes when a sync
        run ends with something staff must see (records' slice C, the
        staff alert outbox lane's one alert, undeliverable until connectors'
        staff alert lane exists). A counter with no label: the line's run, tenant
        and counts are never read. NEEDS records' log line: today records
        writes the outbox row and logs nothing (records/ops/sources/alert.py),
        so this counter reads zero until records logs
        `{"message": "source_sync.alert", "op": ...}` beside the row.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="records"
        AND jsonPayload.message="source_sync.alert"

  alert_policies:
    records-source-sync-alert:
      display_name: "URGENT records raised an administrator sync alert"
      tier: p1
      urgent: true
      subject: "records raised an administrator sync alert"
      documentation: >-
        records ended an administrator sync run (the Everon importer's) with
        an alert for staff: a run that failed, closed incomplete or expired, or
        new problems in its log. Until connectors' staff alert lane delivers
        records' own alert, this is how staff hear of it (OWNER-EV-12, "51.8
        sure"). Nothing about the run is in this notification: open the ops
        portal's sync runs and data issues pages (list_sync_runs,
        list_data_issues) for the run, its counts and its issues.
        It is p1 (PagerDuty at high urgency, and the email channel): the owner,
        2026-11-01, chose that an import alert reach PagerDuty and email both, and
        beta emails p1 alone.
      conditions:
        - name: "an alert line"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/source_sync_alerts" AND resource.type = "cloud_run_revision"

# =============================================================================
# The enrollment service on beta (D-185, the owner, 2026-10-25: "we need it
# treated just like all the other services"), built off. Read by beta's root
# alone (enroll.tf), into the project the PHI role lives in, which receives
# the engine's and its job's logs and holds enroll-db; production-full reads
# none of it. `enroll_db` while var.enroll_db_enabled builds enroll-db (and
# its down policy leaves while B8 stops it); `enroll` while var.enroll_enabled
# builds the services (its mail policy only with var.enroll_mail_enabled).
# Beside these the module writes, from the root's inputs, enroll-db's ten
# per-instance policies and D-173's three (cloud_sql_instances), the engine's
# `no instance` (warm_services: it keeps one) and migrate-enroll's timeout;
# the shared policies (crash loops, start-up failures, the 5xx and SQL
# canaries) and the PHI project's `errors` counter (its `service` label
# reads "enroll") cover the engine and its job with no line here. Every line
# read is the engine's closed-field JSON (the design's §5.4: `service`,
# `level`, `op`, `code`), written against that interface before the engine's
# change lands; codes and counts only, never an address, a member or a value.
# =============================================================================
enroll_db:
  alert_policies:
    enroll-db-down:
      display_name: "URGENT enroll-db is down"
      tier: p1
      urgent: true
      documentation: >-
        Cloud SQL reported enroll-db not up for five minutes: the enrollment
        engine cannot answer, and its /ready refuses (`canary-startup`). Check
        the instance in the console (a maintenance or a failed restart), then
        its operations. While the database is stopped on purpose between test
        sessions (B8) this policy is not there.
      conditions:
        - name: "database/up below 1 for five minutes"
          threshold:
            filter: >-
              metric.type = "cloudsql.googleapis.com/database/up" AND resource.type = "cloudsql_database"
              AND resource.labels.database_id = ends_with(":enroll-db")
            comparison: "COMPARISON_LT"
            threshold_value: 1
            duration: "300s"
            alignment_period: "60s"
            per_series_aligner: "ALIGN_MAX"
            cross_series_reducer: "REDUCE_MAX"
            group_by_fields: ["resource.label.database_id"]

    enroll-db-disk:
      display_name: "enroll-db disk above 85%"
      tier: p2
      documentation: >-
        enroll-db's disk has stayed above 85 percent full for ten minutes.
        Automatic growth stops at the instance's disk_autoresize_limit
        (var.sizing); raise the limit or the disk before it fills, when the
        instance stops taking writes.
      conditions:
        - name: "disk/utilization above 0.85 for ten minutes"
          threshold:
            filter: >-
              metric.type = "cloudsql.googleapis.com/database/disk/utilization" AND resource.type = "cloudsql_database"
              AND resource.labels.database_id = ends_with(":enroll-db")
            threshold_value: 0.85
            duration: "600s"
            alignment_period: "300s"
            per_series_aligner: "ALIGN_MEAN"
            cross_series_reducer: "REDUCE_MAX"
            group_by_fields: ["resource.label.database_id"]

enroll:
  log_metrics:
    enroll_mail_errors:
      description: >-
        One per error line of the enrollment engine's mail loop
        (`op: systemmail.send`, level ERROR: SendGrid refused or could not be
        reached, the key unreadable, a recipient outside the one list), by its
        closed short code alone. The recipient, the letter and SendGrid's own
        words are never on the line (the design's §5.4).
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="enroll"
        AND jsonPayload.service="enroll"
        AND jsonPayload.op="systemmail.send"
        AND jsonPayload.level="ERROR"
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.code, "^([a-z][a-z0-9_]{0,39})$")'

  alert_policies:
    # records-down's shape: the engine keeps one instance, so ten minutes of
    # only 5xx is it down for the portal whatever the traffic.
    enroll-down:
      display_name: "URGENT the enrollment engine answered only errors"
      tier: p1
      urgent: true
      documentation: >-
        Every request the enrollment engine answered in the last ten minutes
        was a 5xx (two or more, none answered otherwise): the enrollment
        portal is down for everyone IAP admits. A refusal is a 4xx and never
        counts here. Read the engine's system log (`canary-startup`), its
        error lines (`errors`, service enroll) and enroll-db
        (`enroll-db-down`).
      conditions:
        - name: "only 5xx for ten minutes, at least two"
          promql:
            query: >-
              sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="enroll", response_code_class="5xx"}[10m])) >= 2
              unless sum by (service_name) (increase(run_googleapis_com:request_count{monitored_resource="cloud_run_revision", service_name="enroll", response_code_class!="5xx"}[10m])) > 0
            evaluation_interval: "60s"

    # A policy of its own, so the PHI project's `jobs-failed` list stays what
    # it was while the enrollment service is off.
    enroll-migrate-failed:
      display_name: "enroll-db's migration failed"
      tier: p3
      subject: "enroll-db's migration failed: ${metric_or_resource.label.job_name}"
      documentation: >-
        An execution of migrate-enroll (run by a person: the stand-in public
        lane, enroll's lane and its boundary check; or its provision and
        seed-beta verbs) failed. Read the execution's own lines, then enroll-db
        (`enroll-db-down`). The engine does not take a new image until its
        migration has run; run the job again once the cause is fixed.
      conditions:
        - name: "a failed execution"
          threshold:
            filter: >-
              metric.type = "run.googleapis.com/job/completed_execution_count" AND resource.type = "cloud_run_job"
              AND metric.labels.result = "failed"
              AND resource.labels.job_name = "migrate-enroll"
            group_by_fields: ["resource.label.job_name"]

    enroll-mail-failing:
      display_name: "the enrollment engine's mail is failing"
      tier: p2
      subject: "enrollment mail is failing: ${metric_or_resource.label.code}"
      documentation: >-
        The enrollment engine's mail loop wrote more than three error lines in
        fifteen minutes: sign-in links and notices are not leaving. The code
        says which: SendGrid's refusal (the key's Mail Send scope, the
        account's IP Access Management list holding enroll's NAT address,
        the verified sender), the route (enroll_sendgrid, the NAT gateway) or
        a recipient outside beta's one list. A pass cut mid-send is sent at
        least once; a letter is never lost, only late.
      conditions:
        - name: "more than three error lines in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/enroll_mail_errors" AND resource.type = "cloud_run_revision"
            threshold_value: 3
            duration: "0s"
            alignment_period: "900s"
            per_series_aligner: "ALIGN_SUM"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["metric.label.code"]

# R5106 (the decider, 2026-10-26, "189 yes."; R5104: "i approve the scheduler
# method"): auth's reset drain on Cloud Scheduler. Read by beta's main.tf into
# the app project (which receives auth's logs) only while
# var.auth_self_service_reset_enabled, so a plan with the switch off is
# today's. auth writes one `reset_requests_drained` line per call of
# POST /admin/reset-drain (auth-notary api/reset_drain.py, logger
# auth.api.reset_drain): `outcome` (ok or busy), `done`, `failed`, `expired`
# and `oldest_waiting_seconds`, never an address. A failed call writes no such
# line, so a scheduler that is paused, refused at ingress or refused by auth
# leaves the line absent: the review's T4.
auth_reset_drain:
  log_metrics:
    auth_reset_drain_passes:
      description: >-
        One per call of auth's reset drain (POST /admin/reset-drain), by its
        outcome alone (ok, or busy when another pass held the instance's
        lock). Its absence is the "not draining" page; nothing of the queue
        is read here.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.reset_drain"
        AND jsonPayload.msg="reset_requests_drained"
      labels:
        outcome: 'EXTRACT(jsonPayload.outcome)'

    auth_reset_queue_behind:
      description: >-
        The age of the oldest reset request still waiting after a drain pass,
        in seconds (nought when none waits): the queue's backlog. A number
        alone; no row, address or account is read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.reset_drain"
        AND jsonPayload.msg="reset_requests_drained"
        AND jsonPayload.outcome="ok"
      value_extractor: 'EXTRACT(jsonPayload.oldest_waiting_seconds)'
      unit: "s"
      bounds: [1, 30, 60, 120, 300, 600, 900]

  alert_policies:
    auth-reset-drain-absent:
      display_name: "auth's reset drain has not run for five minutes"
      tier: p2
      documentation: >-
        auth wrote no reset_requests_drained line for five minutes while the
        self-service reset is on, so password-reset emails are not being sent
        (each request expires unsent after fifteen minutes). Cloud Scheduler's
        auth-reset-drain is paused, deleted, failing, or refused: read its
        attempts (scheduler-failed names the status), then auth's request
        lines for POST /admin/reset-drain (401: the token; 403 not_invoker:
        AUTH_CALLER_DRAIN_ALLOWED; 404: the switch; 429: a retry storm). A
        refusal at Cloud Run's ingress is the unproven hop (infra/README.md,
        "auth's reset drain on Cloud Scheduler"): never widen auth's ingress
        or move the bearer key; restore D-191 and ask the decider.
      conditions:
        # By service, not by revision, and the passes that drained alone
        # (rework 1's M2): an absence condition watches each series of its
        # own, so without the sum every deploy's old revision, and a lone
        # `busy` call, would fall silent and open it; a busy call never
        # stands in for a pass, so only `ok` counts.
        - name: "no drain line for five minutes"
          absent:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_reset_drain_passes" AND resource.type = "cloud_run_revision"
              AND metric.labels.outcome = "ok"
            duration: "300s"
            cross_series_reducer: "REDUCE_SUM"
            group_by_fields: ["resource.label.service_name"]

    auth-reset-queue-behind:
      display_name: "auth's reset queue is behind"
      tier: p2
      documentation: >-
        A reset request has waited more than 120 s after a drain pass: the
        drain is running but not keeping up (each call takes at most 200 rows
        and stops claiming 12 s in), or rows are failing. Read auth's
        reset_requests_drained lines (done, failed, expired) and its
        password_reset_unsent lines; a flood of requests is armor-web's 3000
        and auth's own limits.
      conditions:
        - name: "oldest waiting row above 120 s"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_reset_queue_behind" AND resource.type = "cloud_run_revision"
            threshold_value: 120
            duration: "0s"
            alignment_period: "60s"
            per_series_aligner: "ALIGN_PERCENTILE_99"
            cross_series_reducer: "REDUCE_MAX"

# R5106: the CRM beta copy's forgot-password drain job (crm.tf), read into the
# CRM role's project while var.crm_reset_drain_enabled, as S4's commission
# pass is. R380's twice in a row as a policy of its own, so the catalogue's
# jobs-failed lists stay what they were while the job is off; its missed run
# is crm.tf's crm_reset_drain_missed_runs.
crm_reset_drain:
  alert_policies:
    crm-reset-drain-failed:
      display_name: "the CRM copy's reset drain failed twice in a row"
      tier: p2
      subject: "CRM copy's reset drain failed twice in a row: ${metric_or_resource.label.job_name}"
      documentation: >-
        The CRM beta copy's forgot-password drain (crm-reset-drain, one pass
        every two minutes: sweep the expired rows, then look each queued
        address up and mail its reset link on the system-mail rail) failed
        twice in a row with no successful run between. Read the executions'
        lines (network.auth: the queue's depth and its oldest row's age), then
        crm-db through the proxy and the SendGrid route (crm_sendgrid). A
        queued request lives 30 minutes, so a short outage loses nothing.
      conditions:
        - name: "the pass failed twice in a row"
          failed_twice:
            jobs: ["crm-reset-drain"]

# D-287 (the owner, 2026-11-07: "Let's get this deployed into the same project
# and get it all turned on now"): TPA sign-in for the CRM on beta (sso.tf), its
# auth half, the CRM repository's tasks/sso/SPEC.md §12. Read by beta's root
# into the app role's project, which receives auth's logs, only while
# var.sso_crm_enabled, so a plan with the sign-in off is today's to the byte.
# Each line is auth's own (auth-notary `auth/api/sso_common.py`, logger
# `auth.api.sso`; `sso_machine.py`, `auth.api.sso_machine`; `sso_door.py`,
# `auth.api.sso_door`; the sweeper,
# `auth.workers.sweeper`; the CLI, `auth.cli`): `msg` the line's name, never a
# subject, a session, an address or a key read. Two read the Data Access audit
# log instead: a signature with auth/sso-signing by anyone but sa-auth, and a
# read of crm-sso-client-key by anyone but the serving engine (SPEC §12's last
# two). The pages are p1, the rest p2.
sso_crm:
  log_metrics:
    sso_assertion_replayed:
      description: >-
        One per client assertion presented twice at any /sso/* path (SPEC §5.1): its jti was claimed already. A counter alone; the route and the reason on the line are not read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso"
        AND jsonPayload.msg="sso_assertion_replayed"

    sso_assertion_replayed_paging:
      description: >-
        The same replay when auth marks it a page (the identity token was refused too, or the source address is new for the client within the hour, SPEC A4-R2-12).
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso"
        AND jsonPayload.msg="sso_assertion_replayed"
        AND jsonPayload.page=true

    sso_code_replayed:
      description: >-
        One per authorization code redeemed twice (SPEC §5.6): auth refuses it and ends the TPA session behind the grant within the revoke budget.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_machine"
        AND jsonPayload.msg="sso_code_replayed"

    sso_mass_revoke_paging:
      description: >-
        The client's revoke budget spent (twenty TPA sessions ended in ten minutes, SPEC §5.11), the line auth marks a page.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_machine"
        AND jsonPayload.msg="sso_mass_revoke"
        AND jsonPayload.page=true

    sso_mass_revoke:
      description: >-
        Every revoke-budget line, the alert at ten in ten minutes and the spent budget alike.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_machine"
        AND jsonPayload.msg="sso_mass_revoke"

    sso_refused:
      description: >-
        One per door refusal (sso_refused, SPEC §5.3), for its spikes. The reason on the line is not read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_door"
        AND jsonPayload.msg="sso_refused"

    sso_client_refused:
      description: >-
        One per machine call refused before it was read (invalid_client: no or a bad assertion or identity token), for its spikes.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso"
        AND jsonPayload.msg="sso_client_refused"

    sso_door_saturated:
      description: >-
        One per door request turned away because the door is saturated (SPEC Y-7).
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_door"
        AND jsonPayload.msg="sso_door_saturated"
      # D-287's two doors (auth-notary's two-door slice): each door's own count, and the
      # reason (`saturated`, the client's 2,000 live transactions; `address`, one address's
      # 20 in ten minutes). The label is absent on a one-origin estate's lines and extracts
      # empty there.
      labels:
        site: 'EXTRACT(jsonPayload.door)'
        code: 'EXTRACT(jsonPayload.reason)'

    sso_activity_ignored:
      description: >-
        One per session-status call that ignored CRM activity beyond the presence horizon (SPEC §7.4), sustained keepalive.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso_machine"
        AND jsonPayload.msg="sso_activity_ignored"

    sso_signer_unavailable:
      description: >-
        One per /sso/token or /sso/jwks.json answered 503 because the key service could not sign with, or list the versions of, auth/sso-signing (quota, an outage, a disabled version): the sign-in is down.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth"
        AND jsonPayload.logger="auth.api.sso"
        AND jsonPayload.msg="sso_signer_unavailable"

    sso_sweep_failed:
      description: >-
        One per sweeper pass whose sign-in housekeeping failed (SPEC A4-12): the hourly status count or the expired rows.
      filter: |
        resource.type="cloud_run_job"
        AND resource.labels.job_name="auth-sweeper"
        AND jsonPayload.logger="auth.workers.sweeper"
        AND jsonPayload.msg="sso_sweep_failed"

    sso_operator_ended:
      description: >-
        One per `auth admin sso-end` (the operator ending sign-in sessions from a job, SPEC §16).
      filter: |
        resource.type="cloud_run_job"
        AND jsonPayload.logger="auth.cli"
        AND jsonPayload.msg="sso_operator_ended"

    sso_signing_key_foreign_use:
      description: >-
        A signature or version listing on auth/sso-signing by anyone but sa-auth, from the Data Access audit log (row 236 is sa-auth's alone; N97). The entry says who.
      filter: |
        log_id("cloudaudit.googleapis.com/data_access")
        AND protoPayload.serviceName="cloudkms.googleapis.com"
        AND protoPayload.resourceName=~"/keyRings/auth/cryptoKeys/sso-signing(/|$)"
        AND NOT protoPayload.authenticationInfo.principalEmail=~"^sa-auth@"

    sso_client_key_foreign_read:
      description: >-
        A read of crm-sso-client-key by anyone but the CRM beta copy's serving engine, from the Data Access audit log (row 239; N99; SPEC §12): whoever reads it is the sign-in client. The entry says who.
      filter: |
        log_id("cloudaudit.googleapis.com/data_access")
        AND protoPayload.serviceName="secretmanager.googleapis.com"
        AND protoPayload.methodName=~"AccessSecretVersion$"
        AND protoPayload.resourceName=~"/secrets/crm-sso-client-key(/|$)"
        AND NOT protoPayload.authenticationInfo.principalEmail=~"^sa-crm-beta-engine@"

  alert_policies:
    sso-assertion-replayed-paging:
      display_name: "URGENT TPA sign-in: a client assertion replayed from a new place"
      tier: p1
      urgent: true
      documentation: >-
        auth refused a CRM sign-in client assertion presented a second time, and the call also failed the identity-token check or came from an address not seen for the client in the last hour: someone may hold the client's key or a captured assertion. Suspend the client first (Operations, Admin, Sign-in, or `auth admin sso-suspend`), then read auth's lines for the route and the CRM engine's for its own calls.
      conditions:
        - name: "TPA sign-in: a client assertion replayed from a new place"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_assertion_replayed_paging" AND resource.type = "cloud_run_revision"

    sso-assertion-replayed:
      display_name: "TPA sign-in: a client assertion replayed"
      tier: p2
      documentation: >-
        auth refused a CRM sign-in client assertion presented a second time (a retry that reused its assertion is a CRM bug; anything else is the paging policy's case). Read auth's lines for the route.
      conditions:
        - name: "TPA sign-in: a client assertion replayed"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_assertion_replayed" AND resource.type = "cloud_run_revision"

    sso-code-replayed:
      display_name: "URGENT TPA sign-in: an authorization code replayed"
      tier: p1
      urgent: true
      documentation: >-
        A CRM sign-in authorization code was redeemed twice (SPEC §5.6): auth refused it and ended the TPA session behind it within the revoke budget. A code is single use, so a second redemption is a stolen or leaked code. Read auth's lines; suspend the client if more follow.
      conditions:
        - name: "TPA sign-in: an authorization code replayed"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_code_replayed" AND resource.type = "cloud_run_revision"

    sso-mass-revoke:
      display_name: "URGENT TPA sign-in: the client spent its revoke budget"
      tier: p1
      urgent: true
      documentation: >-
        The CRM sign-in client ended twenty TPA sessions in ten minutes (SPEC §5.11) and auth now refuses its revokes: a compromised CRM engine ending people's sessions, or a CRM bug. Suspend the client, then read the CRM engine's lines.
      conditions:
        - name: "TPA sign-in: the client spent its revoke budget"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_mass_revoke_paging" AND resource.type = "cloud_run_revision"

    sso-mass-revoke-alert:
      display_name: "TPA sign-in: the client is ending many TPA sessions"
      tier: p2
      documentation: >-
        The CRM sign-in client has ended ten or more TPA sessions in ten minutes (the budget is twenty). Watch for the paging policy; read the CRM engine's lines.
      conditions:
        - name: "TPA sign-in: the client is ending many TPA sessions"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_mass_revoke" AND resource.type = "cloud_run_revision"

    sso-refused-spike:
      display_name: "TPA sign-in: the door is refusing many requests"
      tier: p2
      documentation: >-
        auth's TPA sign-in door refused more than twenty requests in ten minutes (bad or stale hand-offs, a misconfigured client, or probing). Read auth's sso_refused lines' reasons.
      conditions:
        - name: "TPA sign-in: the door is refusing many requests"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_refused" AND resource.type = "cloud_run_revision"
            threshold_value: 20
            alignment_period: "600s"
            per_series_aligner: "ALIGN_SUM"
            cross_series_reducer: "REDUCE_SUM"

    sso-client-refused-spike:
      display_name: "TPA sign-in: many machine calls refused"
      tier: p2
      documentation: >-
        auth refused more than twenty CRM sign-in machine calls in ten minutes as invalid_client (no or a bad assertion or identity token): a broken client key, the engine on the wrong account, or someone without the key. Read auth's sso_client_refused reasons.
      conditions:
        - name: "TPA sign-in: many machine calls refused"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_client_refused" AND resource.type = "cloud_run_revision"
            threshold_value: 20
            alignment_period: "600s"
            per_series_aligner: "ALIGN_SUM"
            cross_series_reducer: "REDUCE_SUM"

    sso-door-saturated:
      display_name: "TPA sign-in: the door is saturated"
      tier: p2
      documentation: >-
        auth turned TPA sign-in door requests away because the door is saturated (SPEC Y-7). Read auth's request rate and instances.
      conditions:
        - name: "TPA sign-in: the door is saturated"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_door_saturated" AND resource.type = "cloud_run_revision"

    sso-activity-ignored:
      display_name: "TPA sign-in: CRM activity ignored beyond the presence horizon"
      tier: p2
      documentation: >-
        auth ignored CRM activity reports beyond the presence horizon on more than ten status calls in an hour (SPEC §7.4): a CRM tab or engine keeping sessions alive. Read the CRM engine's session lines.
      conditions:
        - name: "TPA sign-in: CRM activity ignored beyond the presence horizon"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_activity_ignored" AND resource.type = "cloud_run_revision"
            threshold_value: 10
            alignment_period: "3600s"
            per_series_aligner: "ALIGN_SUM"
            cross_series_reducer: "REDUCE_SUM"

    sso-signer-unavailable:
      display_name: "URGENT TPA sign-in: auth cannot sign with its sign-in key"
      tier: p1
      urgent: true
      documentation: >-
        auth answered /sso/token or /sso/jwks.json 503 because the key service could not sign with, or list the versions of, auth/sso-signing (quota, an outage, a disabled or destroyed version): nobody can sign in to the CRM through TPA. Read auth's sso_signer_unavailable lines (the route), the key's versions and the key service's quota; kms-version-disabled may have fired too.
      conditions:
        - name: "TPA sign-in: auth cannot sign with its sign-in key"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_signer_unavailable" AND resource.type = "cloud_run_revision"

    sso-sweep-failed:
      display_name: "TPA sign-in: the sweeper's sign-in housekeeping failed"
      tier: p2
      documentation: >-
        auth's sweeper could not do the sign-in's housekeeping (the hourly status count, the expired rows; SPEC A4-12). TPA's own revocations are untouched (I-27). Read the sweeper's lines.
      conditions:
        - name: "TPA sign-in: the sweeper's sign-in housekeeping failed"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_sweep_failed" AND resource.type = "cloud_run_job"

    sso-operator-ended:
      display_name: "TPA sign-in: an operator ended sign-in sessions"
      tier: p2
      documentation: >-
        Someone ran `auth admin sso-end` (SPEC §16): the TPA sessions behind live sign-ins were ended. Expected in a rollback; otherwise read the job's execution for who and why.
      conditions:
        - name: "TPA sign-in: an operator ended sign-in sessions"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_operator_ended" AND resource.type = "cloud_run_job"

    sso-signing-key-foreign-use:
      display_name: "URGENT TPA sign-in: someone but auth used the sign-in key"
      tier: p1
      urgent: true
      documentation: >-
        A principal other than sa-auth signed with, or listed, auth/sso-signing (the Data Access audit log): it could forge CRM sign-ins. Read the entry for who, disable the key's versions' grant if it is not ours, and suspend the client.
      conditions:
        # Both resource types kms-version-disabled reads: where a KMS entry
        # lands differs by project.
        - name: "TPA sign-in: someone but auth used the sign-in key (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_signing_key_foreign_use" AND resource.type = "audited_resource"
        - name: "TPA sign-in: someone but auth used the sign-in key (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_signing_key_foreign_use" AND resource.type = "global"

    sso-client-key-foreign-read:
      display_name: "TPA sign-in: someone but the CRM engine read the client key"
      tier: p2
      documentation: >-
        A principal other than the CRM beta copy's serving engine read crm-sso-client-key (the Data Access audit log): whoever reads it is the sign-in client (SPEC §12). Read the entry for who; if it is not an expected person's, suspend the client and rotate the key (sso.tf's crm_sso_client_key_version).
      conditions:
        # The three resource types secret-version-disabled reads (SR-OR-1's
        # review, 2026-11-12: Secret Manager's entries land on
        # `audited_resource`, which this policy had left out).
        - name: "TPA sign-in: someone but the CRM engine read the client key (on audited_resource)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_client_key_foreign_read" AND resource.type = "audited_resource"
        - name: "TPA sign-in: someone but the CRM engine read the client key (on global)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_client_key_foreign_read" AND resource.type = "global"
        - name: "TPA sign-in: someone but the CRM engine read the client key (on the secret)"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/sso_client_key_foreign_read" AND resource.type = "secretmanager.googleapis.com/Secret"

# D-287: TPA sign-in for the CRM, the CRM beta copy's engine's half (SPEC §12),
# read into the CRM role's project while var.sso_crm_enabled. The engine's own
# lines (the CRM repository's `engine/app/sso/`, logger `network.sso`, `msg` the
# line's name): it started with the sign-in on but unusable, a status call to
# auth failed, a recovery mail failed.
crm_sso:
  log_metrics:
    crm_sso_unavailable_at_start:
      description: >-
        One per engine start with TPA sign-in on and a key or an address unusable (sso_unavailable_at_start): the CRM shows no sign-in button.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="engine"
        AND jsonPayload.logger="network.sso"
        AND jsonPayload.msg="sso_unavailable_at_start"

    crm_sso_status_unavailable:
      description: >-
        One per session-status call to auth that failed (sso_status_unavailable, SPEC §7.3): the CRM cannot tell whether a TPA session still holds.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="engine"
        AND jsonPayload.logger="network.sso"
        AND jsonPayload.msg="sso_status_unavailable"

    crm_sso_recovery_mail_failed:
      description: >-
        One per recovery email the engine could not send after an unlink (sso_recovery_mail_failed, SPEC §6.10): that person cannot get back into the CRM.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="engine"
        AND jsonPayload.logger="network.sso"
        AND jsonPayload.msg="sso_recovery_mail_failed"

  alert_policies:
    crm-sso-unavailable-at-start:
      display_name: "TPA sign-in: the CRM engine started without it"
      tier: p2
      documentation: >-
        The CRM beta copy's engine started with TPA sign-in on and could not use it (a key, an address): no sign-in button. Read the start line's reason; its keys and addresses are sso.tf's.
      conditions:
        - name: "TPA sign-in: the CRM engine started without it"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_sso_unavailable_at_start" AND resource.type = "cloud_run_revision"

    crm-sso-status-unavailable:
      display_name: "URGENT TPA sign-in: the CRM cannot reach auth's status"
      tier: p1
      urgent: true
      documentation: >-
        The CRM beta copy's engine could not ask auth whether TPA sessions still hold (SPEC §7.3): CRM sessions end when the status stays unknown. Read the engine's lines and auth's /sso/session-status; crm-net's rule 2030 and psc-auth are the path.
      conditions:
        - name: "TPA sign-in: the CRM cannot reach auth's status"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_sso_status_unavailable" AND resource.type = "cloud_run_revision"
            threshold_value: 5
            alignment_period: "300s"
            per_series_aligner: "ALIGN_SUM"
            cross_series_reducer: "REDUCE_SUM"

    crm-sso-recovery-mail-failed:
      display_name: "URGENT TPA sign-in: a recovery email failed"
      tier: p1
      urgent: true
      documentation: >-
        The CRM beta copy's engine could not send a recovery link after an unlink (SPEC §6.10): that person is locked out of the CRM until it is re-sent. Read the engine's mail lines (its system-mail rail, R365).
      conditions:
        - name: "TPA sign-in: a recovery email failed"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/crm_sso_recovery_mail_failed" AND resource.type = "cloud_run_revision"

# R502 (the owner, class 3; slice S6; orchestrator/plans/desk-roster/DESIGN.md
# §7 answer 11: "Alert the owner on each new desk? Yes, cheaply. A log-based
# metric on desk_roster_added during beta, so a desk made by surprise is
# seen."): read by beta's callcentre.tf into the call-centre project's
# monitoring (module.monitoring_cc, which receives svc-ops's logs) only while
# var.desk_roster_auto_enabled, so a plan with the switch off is today's.
# svc-ops writes one `desk_roster_added` line each time a rep's desk is set up
# (call-center services/ops/desk_enrol.py, logger services.ops.desk_enrol, at
# INFO): `event`, the attempt's count and whether the relay made the Worker or
# found it already made (`desk_roster_attempt`, `desk_roster_created`), never
# a person, a Worker or a tenant (services/privacy/log_setup.py,
# DESK_ROSTER_SHAPES). Nothing of the line is extracted here.
desk_roster:
  log_metrics:
    desk_roster_added:
      description: >-
        One per desk line svc-ops set up for a customer service rep on their
        first desk visit (R502's automatic desks): its `desk_roster_added`
        line. Counted alone; nothing of the line is read, and the line names
        no person, Worker or tenant.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="svc-ops"
        AND jsonPayload.logger="services.ops.desk_enrol"
        AND jsonPayload.event="desk_roster_added"

  alert_policies:
    # p2, the low-urgency tier (#202): PagerDuty at WARNING and Slack, never a
    # text, notified on opening alone. One incident a window, however many
    # desks it holds; it closes by itself once a window passes with none.
    desk-roster-added:
      display_name: "svc-ops set up a rep's desk line"
      tier: p2
      subject: "a rep's desk line was set up"
      documentation: >-
        svc-ops set up a desk line for a customer service rep in the last five
        minutes (R502: anyone given the ops_agent role in the staff tenant gets
        a desk, and with it live member calls, the first time they open the
        desk). Expected after a rep was invited or given the role. If nobody
        meant to: on the ops portal's People page, find whoever now shows a
        desk line and keep them off the desk (Keep off, which retires the line
        at once), then read auth's audit of who granted ops_agent and when.
        svc-ops's desk_roster_* lines and cc-db's desk_roster_audit rows hold
        the rest; this alert carries no name.
      conditions:
        - name: "a desk set up in five minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/desk_roster_added" AND resource.type = "cloud_run_revision"
            threshold_value: 0
            alignment_period: "300s"

# Beta's member email (memberemail.tf; OWNER-EMAIL-1), read into the member-data
# project, which receives records' logs, while var.beta_member_email_enabled is
# on. The ruling's "expired, not sent, and counted for the owner": records writes
# one WARNING line per claim that expired anything, on purpose below the generic
# error alert, with that claim's count in `rows`. A claim takes up to 25 rows, so
# a backlog writes many lines: the policy reads an hour, so it opens once for a
# backlog rather than once a line.
member_email:
  log_metrics:
    records_notices_expired:
      description: >-
        How many notices one outbox claim expired unsent for being older than
        records' limit, one value a claim, so the distribution's sum is the
        total. A number alone: the kinds on the line's message are not read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="records"
        AND jsonPayload.service="records"
        AND jsonPayload.op="outbox.claim"
        AND jsonPayload.code="expired"
      value_extractor: 'EXTRACT(jsonPayload.rows)'
      unit: "1"
      bounds: [1, 5, 10, 25]

    connectors_email_held:
      description: >-
        One per refusal episode: the email vendor refused connectors' key or
        address, so it holds every row rather than killing them. The reason and
        the outcome alone; nothing of a row is read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="connectors"
        AND jsonPayload.reason="vendor_refused"
        AND jsonPayload.outcome="held"

  alert_policies:
    connectors-email-held:
      display_name: "URGENT connectors: the email vendor refused our key or address"
      tier: p1
      urgent: true
      subject: "connectors: all email is held, the vendor refused our key or address"
      documentation: >-
        SendGrid answered 401 or 403 to connectors, so sending is held: no email
        notice leaves, and none is lost, since a held row waits rather than going
        dead. This alert is the only sign, because rows no longer settle dead.
        Read in order: notify-email-api-key's pinned version exists and is the key
        that was made; the key still has Mail Send; the member-data project's NAT
        address (the nat_addresses output's phi list) is on SendGrid's IP Access
        Management list. Sending resumes by itself once the vendor takes it.
      conditions:
        - name: "a refusal episode"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/connectors_email_held" AND resource.type = "cloud_run_revision"

    records-notices-expired:
      display_name: "records expired notices unsent"
      tier: p2
      subject: "records expired notices unsent"
      documentation: >-
        records expired one or more notices unsent, because they were older than
        its limit, 48 hours by default, when connectors claimed them
        (OWNER-EMAIL-1). Nobody was emailed for those notices and none will be.
        The total is the sum of the records_notices_expired metric, and each
        line's message names the kinds. Expected once as a backlog clears; if it
        comes back, connectors has been down or behind: read connectors-stalled
        first.
      conditions:
        - name: "a claim expired notices this hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/records_notices_expired" AND resource.type = "cloud_run_revision"
            threshold_value: 0
            duration: "0s"
            alignment_period: "3600s"
            per_series_aligner: "ALIGN_PERCENTILE_99"
            cross_series_reducer: "REDUCE_MAX"

# auth's mail to everyone (main.tf, auth_email_env; OWNER-EMAIL-1), read into the
# app project, which receives the messenger's logs, while
# var.email_everyone_enabled is on: nothing else of these lines reaches the cloud
# (auth-notary's request of 2026-11-07).
auth_email_everyone:
  log_metrics:
    auth_email_undeliverable:
      description: >-
        auth's messenger: an email it could not hand on, because the address
        cannot be delivered to. A count alone; never the address.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth-outbox-publisher"
        AND jsonPayload.logger="auth.seams.outbound"
        AND jsonPayload.msg="email_undeliverable"

    auth_message_to_synthetic_login:
      description: >-
        auth's messenger: mail kept from a synthetic login. Worth a look if it is
        ever above zero. A count alone; never the login.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth-outbox-publisher"
        AND jsonPayload.logger="auth.workers.messenger"
        AND jsonPayload.msg="message_to_a_synthetic_login"

# O275 (the owner's authority, 2026-11-11: members' sign-in codes texted through
# Twilio from the 855 line) and I-843: auth's texted codes, read into the app
# role's project while var.auth_sms_twilio_enabled, the one backend that reads
# each text's delivery back. auth-notary's messenger under `twilio`
# (`check_deliveries_once`) writes one `sms_delivery_reported` line per text
# Twilio delivered or did not deliver: INFO, logger `auth.workers.messenger`,
# `outcome` ok, `reason` "delivered" or the closed word for why not
# (`carrier_failed` for any code it has no word for), and `message_id`, the
# outbox row, which is never read here. That is the line I-843 lacked: the
# texts below the estate's ceiling, which auth-texted-codes-ceiling does not
# see, so a pumping run under the ceiling is seen here before the vendor's bill
# (beside the vendor's own usage trigger, infra/README.md). A text whose
# delivery is never confirmed writes no line, and one Twilio refused at the send
# is `message_not_sent` (`sign-in-message-vendor`).
auth_texts:
  log_metrics:
    auth_texts_reported:
      description: >-
        One per texted code Twilio delivered or did not deliver, as auth's
        messenger read it back (`sms_delivery_reported`), by how it ended
        (`code`: delivered, or the closed word for why not). Never the row,
        the number or the code.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth-outbox-publisher"
        AND jsonPayload.logger="auth.workers.messenger"
        AND jsonPayload.msg="sms_delivery_reported"
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.reason, "^([a-z_]{1,32})$")'

    # auth-notary's request (part B 4): a text the messenger did not hand
    # over for a reason of the number's or the account's (`message_not_sent`,
    # channel sms: opted_out, bad_address, not_allowed for Twilio's 21408 or a
    # number outside the US). The vendor's own failures (a dead key's
    # vendor_refused, busy, unavailable, unreachable, no answer) are
    # auth_message_vendor_failures', which `sign-in-message-vendor` pages on
    # three in fifteen minutes on the sms lane, so they are left out here and
    # never page twice. One line per send tried.
    auth_texts_not_sent:
      description: >-
        One per texted code auth's messenger did not hand to Twilio for a reason
        of the number's or the account's (`message_not_sent`, channel sms), by
        the reason's closed word (`code`). The vendor's own failures are
        auth_message_vendor_failures'. Never the row, the number or the code.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth-outbox-publisher"
        AND jsonPayload.logger="auth.workers.messenger"
        AND jsonPayload.msg="message_not_sent"
        AND jsonPayload.channel="sms"
        AND NOT jsonPayload.reason=~"^(vendor_(refused|busy|unavailable|unreadable)|unreachable|no_answer)$"
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.reason, "^([a-z_]{1,32})$")'

    # auth-notary's request (part B 4): the delivery read's own faults. A read
    # Twilio refused or did not answer (`sms_delivery_unread`, WARNING, or an
    # ERROR with reason reader_error), a send whose answer carried no message
    # id to read back (`sms_reference_unreadable`, WARNING, from the vendor
    # seam), and a turn of reads that raised (`sms_delivery_checks_failed`,
    # ERROR). By the line's name alone.
    auth_text_delivery_faults:
      description: >-
        One per fault of auth's delivery read for texts: a read refused or
        unanswered, a send with no message id to read back, or a turn of reads
        that raised; by the line (`code`). Nothing of the message is read.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="auth-outbox-publisher"
        AND ((jsonPayload.logger="auth.workers.messenger"
              AND (jsonPayload.msg="sms_delivery_unread" OR jsonPayload.msg="sms_delivery_checks_failed"))
          OR (jsonPayload.logger="auth.seams.outbound"
              AND jsonPayload.msg="sms_reference_unreadable"))
      labels:
        code: 'REGEXP_EXTRACT(jsonPayload.msg, "^(sms_delivery_unread|sms_delivery_checks_failed|sms_reference_unreadable)$")'

    # The review of T-131 (F2; TP-403, TP-182's residual in the app project):
    # auth_twilio admits a content network's edges by name, so a compromised
    # messenger could reach other sites there. The rule logs every connection
    # it admits (main.tf, enable_logging), and this counts them: Cloud NGFW's
    # Firewall Rules Logging record (log compute.googleapis.com/firewall, on
    # the subnetwork), one per connection, ALLOWED by the egress rule at
    # priority 1225, which is auth_twilio's alone in this root and the one rule
    # here that logs. Nothing of the record is read but the match: no address,
    # port or name. Firewall logs carry no byte counts, so connections. The
    # first live record is read to confirm the field names (rule_details'
    # priority and direction), as Adaptive Protection's alertId was (D-308).
    auth_twilio_connections:
      description: >-
        One per TCP connection the auth_twilio rule admitted, auth's messenger to
        the text vendor's API host by name (TP-403's watch). A count alone; never
        an address, a port or a name.
      filter: |
        log_id("compute.googleapis.com/firewall")
        AND resource.type="gce_subnetwork"
        AND jsonPayload.disposition="ALLOWED"
        AND jsonPayload.rule_details.direction="EGRESS"
        AND jsonPayload.rule_details.priority=1225

  alert_policies:
    # D-308's bar for the surge it could not build (100 texts an hour), on the
    # line that exists now. p2: the estate's ceilings are the brake.
    auth-texted-codes-volume:
      display_name: "texted codes: more than 100 in an hour"
      tier: p2
      documentation: >-
        Twilio reported more than 100 of auth's texted codes delivered or not
        delivered in an hour, below the estate's daily ceiling
        (auth-texted-codes-ceiling opens only once it is spent). Either real
        sign-ins (a morning's rush, an enrollment mailing) or an SMS pumping
        run behind stuffed passwords: read auth-password-spray and
        auth-sign-in-code-surge beside it, the Twilio console's Messaging logs
        for the countries and the spend (Messaging geo permissions are the US
        alone, O275), and auth's refused sign-ins by address. The brake is
        auth_sms_codes_estate_per_day, then IAP back on the portal host
        (infra/README.md, "Putting IAP back").
      conditions:
        - name: "more than 100 texted codes reported in an hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_texts_reported" AND resource.type = "cloud_run_revision"
            threshold_value: 100
            alignment_period: "3600s"

    # O275: "when it works or doesn't work". Each failure is already in the
    # member's Notifications (records); this is the estate's view: texts the
    # carriers turned away, a sender registration lapsing or a carrier
    # filtering the line.
    auth-texts-not-delivered:
      display_name: "texted codes: five or more not delivered in an hour"
      tier: p2
      subject: "texted codes not delivered: ${metric_or_resource.label.code}"
      documentation: >-
        Twilio reported five or more of auth's texted codes not delivered in an
        hour, by the closed word for why (the incident's `code`): members are
        not getting their sign-in codes. carrier_failed or a carrier word for
        many numbers at once is the 855 line's toll-free verification or a
        carrier filtering it (the Twilio console, Phone Numbers, the line's
        Regulatory and Messaging logs); opted_out or bad_address are people's
        own numbers, one at a time. Each member's own status is in their
        Notifications in ops.
      conditions:
        - name: "five or more texts not delivered in an hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_texts_reported" AND resource.type = "cloud_run_revision"
              AND metric.labels.code != "delivered"
            threshold_value: 4
            alignment_period: "3600s"
            group_by_fields: ["metric.label.code"]

    # D-335 (the owner, 2026-11-12: "I need a way to ensure 100% this works and
    # we can get a critical alert if they cant"): the texts Twilio takes and
    # the carriers turn away for the line itself, which no send-side alert
    # sees (Twilio answered the send, so `sign-in-message-vendor` and the lag
    # stay quiet). auth-notary auth/seams/outbound.py's closed words:
    # `toll_free_unverified` is Twilio's 30032, the 855 line's toll-free
    # verification gone, and every text after it fails, so any one pages;
    # `carrier_filtered` is 30004 and 30007, a carrier filtering the line or a
    # person's own block, so it pages only at three in an hour and more than
    # half of the texts reported, which one person's block never is. The
    # people's own words (opted_out, landline, unknown_number, unreachable,
    # carrier_failed) stay auth-texts-not-delivered's (p2). One PromQL
    # condition, alone in its policy. In the texts read (2026-11-11 to -12, all
    # delivered) it opens never.
    auth-texts-blocked:
      display_name: "URGENT texted codes blocked: the carriers are refusing the line"
      tier: p1
      urgent: true
      documentation: >-
        Twilio reported a texted code not delivered because the 855 line's
        toll-free verification is gone (toll_free_unverified, Twilio's 30032),
        or three or more in an hour, and more than half of all texts reported,
        filtered or blocked by the carriers (carrier_filtered, 30004 and
        30007): members and brokers who sign in by text are not getting their
        codes, though every send succeeded. Read the Twilio console: Phone
        Numbers, the line's Regulatory (the toll-free verification's state)
        and Messaging logs for the error codes. Each member's own status is
        in their Notifications in ops; `auth-texts-not-delivered` may be open
        beside it.
      conditions:
        - name: "the line unverified, or most texts filtered by the carriers, in an hour"
          promql:
            query: >-
              sum(increase(logging_googleapis_com:user_auth_texts_reported{monitored_resource="cloud_run_revision", code="toll_free_unverified"}[1h])) > 0
              or (sum(increase(logging_googleapis_com:user_auth_texts_reported{monitored_resource="cloud_run_revision", code="carrier_filtered"}[1h])) >= 3
              and sum(increase(logging_googleapis_com:user_auth_texts_reported{monitored_resource="cloud_run_revision", code="carrier_filtered"}[1h]))
              > 0.5 * sum(increase(logging_googleapis_com:user_auth_texts_reported{monitored_resource="cloud_run_revision"}[1h])))
            evaluation_interval: "60s"

    # auth-notary's request (part B 4): texts refused for the number or the
    # account. A run of one word is the account (not_allowed: Messaging geo
    # permissions, or numbers outside the US being tried) or a list at work.
    auth-texts-not-sent:
      display_name: "texted codes: five or more not sent in an hour"
      tier: p2
      subject: "texted codes not sent: ${metric_or_resource.label.code}"
      documentation: >-
        auth's messenger did not hand five or more texted codes to Twilio in an
        hour for a reason of the number's or the account's (the incident's
        `code`): opted_out (people who replied STOP), bad_address (not a valid
        or not a mobile number), not_allowed (Twilio's geo permissions refused
        the country, or a number outside the US). Many at once is the account's
        Messaging geo permissions or someone trying numbers. A dead key
        (vendor_refused) and Twilio's outages page as sign-in-message-vendor.
        Each member's own status is in their Notifications in ops.
      conditions:
        - name: "five or more texts not sent in an hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_texts_not_sent" AND resource.type = "cloud_run_revision"
            threshold_value: 4
            alignment_period: "3600s"
            group_by_fields: ["metric.label.code"]

    # auth-notary's request (part B 4): any fault of the read loop itself, or
    # a run of refused reads. While it fires, texts may arrive but no member's
    # Notifications says delivered or not delivered.
    auth-text-delivery-reads-failing:
      display_name: "texted codes: their delivery is not being read back"
      tier: p2
      subject: "texted codes' delivery read failing: ${metric_or_resource.label.code}"
      documentation: >-
        auth's messenger is not reading texted codes' delivery back from Twilio:
        a turn of reads raised (sms_delivery_checks_failed, its traceback in
        auth's error lines), a send's answer carried no message id
        (sms_reference_unreadable), or Twilio refused or did not answer five or
        more reads in fifteen minutes (sms_delivery_unread: the key's Read
        permission, or Twilio's status page). Texts still go; members'
        Notifications stay at sent.
      conditions:
        - name: "any read loop fault or missing message id in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_text_delivery_faults" AND resource.type = "cloud_run_revision"
              AND metric.labels.code != "sms_delivery_unread"
            alignment_period: "900s"
            group_by_fields: ["metric.label.code"]
        - name: "five or more reads refused or unanswered in fifteen minutes"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_text_delivery_faults" AND resource.type = "cloud_run_revision"
              AND metric.labels.code = "sms_delivery_unread"
            threshold_value: 4
            alignment_period: "900s"
            group_by_fields: ["metric.label.code"]

    # The review of T-131 (F2; TP-403's watch, accepted under O275's "Named rule
    # like SendGrid"): the messenger's connections to the vendor's host above
    # what the texts explain. Each text is at most four calls (one send and up
    # to three delivery reads), so 100 texts an hour (auth-texted-codes-volume's
    # bar) is at most 400 connections, fewer with connections kept alive; more
    # than 500 in an hour is traffic the texts do not account for.
    auth-twilio-connections-high:
      display_name: "auth's messenger: more connections by the text vendor's rule than texts explain"
      tier: p2
      documentation: >-
        The auth_twilio firewall rule admitted more than 500 connections in an
        hour from auth's messenger to the text vendor's API host by name. The
        name is an alias of a shared content network, so the rule also admits
        that network's other sites (TP-403, TP-182's residual): traffic beyond
        the texts may be the messenger reaching somewhere it should not. Read
        auth-texted-codes-volume beside it (a real surge of texts explains a
        surge of connections), then the firewall log's records for the rule
        (log compute.googleapis.com/firewall, priority 1225) for destination
        addresses outside the vendor's, and auth-outbox-publisher's revision and
        image. To cut it off at once, auth_sms_twilio_enabled = false and the
        README's targets (infra/README.md, "Members' texted codes through
        Twilio (O275)").
      conditions:
        - name: "more than 500 connections by auth_twilio in an hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/auth_twilio_connections" AND resource.type = "gce_subnetwork"
            threshold_value: 500
            alignment_period: "3600s"

# D-400 (beta's mailcheck.tf): the hourly mail check's inbox, App Engine in a
# project of its own that receives its logs, so its two counters are that
# project's (module.monitoring_mail_check, from the inbox stage). The app writes
# one JSON line a delivery to stdout, which App Engine records on the `gae_app`
# resource (the one type both counters keep a series on): `msg`
# mail_check_arrived with `lane`, `check_id`, `dkim` "pass" and `seconds`, or
# mail_check_refused with one closed `reason` (mail_inbox/check.py, REASONS).
# No line the app writes carries an address, a subject, a header or a body; the check id is
# never read here.
#
# The two policies are the app project's, read across its metrics scope (the
# inbox project is in it from the inbox stage), so they reach PagerDuty and
# Slack as every p1 there does, and only at the alerting stage, once each lane
# has arrived once: Google refuses a PromQL policy over a counter with no
# series. Each is one lane's, PromQL alone in its policy, written as the
# module's missed runs are: absent over 2 h 15 min now AND ten minutes ago (the
# hold is inside the query, because the guard's week-long lookback takes no
# retest window: "Retest windows are not supported in PromQL queries with
# lookbacks longer than 1d1h"), AND some arrival in the last seven days, so a
# lane that has never arrived never opens it. 2 h 15 min is two hourly checks
# in a row (one late or lost check does not page); at the seven-day lookback
# Google evaluates every five minutes.
mail_check:
  log_metrics:
    mail_check_arrived:
      description: >-
        One per mail check email the inbox counted: delivered to its lane's
        address, the pinned subject, From and a DKIM signature of the sending
        domain. The lane alone (invites or notices); never the check id.
      filter: |
        resource.type="gae_app"
        AND jsonPayload.msg="mail_check_arrived"
        AND jsonPayload.dkim="pass"
        AND (jsonPayload.lane="invites" OR jsonPayload.lane="notices")
      labels:
        lane: 'EXTRACT(jsonPayload.lane)'

    mail_check_refused:
      description: >-
        One per request the inbox refused, by its closed reason: not a check
        address, not the pinned subject, a signature that is missing, of
        another domain or does not verify, a check older than a day, or any
        request not Google's mail delivery (not_mail_path, which the firewall
        should leave at zero). The reason alone.
      filter: |
        resource.type="gae_app"
        AND jsonPayload.msg="mail_check_refused"
      labels:
        code: 'EXTRACT(jsonPayload.reason)'

  alert_policies:
    mail-check-invites-missing:
      display_name: "URGENT mail check: no invites email arrived in 2 h 15 min"
      tier: p1
      urgent: true
      subject: "mail check: no invites email arrived in 2 h 15 min"
      documentation: >-
        The hourly mail check on the invites lane has not reached its inbox for
        2 h 15 min: two checks in a row. That lane is the opening-email chain
        (records' opening queue, tpa-jobs-drains, auth's opening intake, auth's
        messenger, SendGrid), the chain staff and broker invitations and
        opening emails take, so treat those as not going out until shown
        otherwise. First tell never sent from sent and never arrived: in the
        member-data project's logs, look for records' mail_check_queued line of
        the invites lane in the last three hours (records writes one each
        hour). None: the check was never sent. Read the job (missed run
        (tpa-jobs-mail-check), jobs-failed) and records' mail_check_skipped
        line and its reason (not_configured: records has no address). Some: it
        was sent and never arrived. Read, in order, tpa-jobs-drains and auth's
        messenger (auth-outbox-publisher, auth-messages-stalled) for its
        SendGrid call, records' vendor_event_stored lines of kind mail_check (a
        bounce, drop or deferral is SendGrid's answer), then the inbox
        project's mail_check_refused counter by reason (a dkim reason means
        the email arrived and failed its signature check: read SendGrid's
        domain authentication). This policy waits for the lane's first
        arrival, and closes by itself after seven days with none, which is not
        a recovery (docs/infra/mail-check.md).
      conditions:
        - name: "no invites check in 2 h 15 min, ten minutes running"
          promql:
            query: >-
              absent_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="invites"}[135m])
              and on() absent_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="invites"}[135m] offset 600s)
              and on() count_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="invites"}[7d])
            duration: "0s"
            evaluation_interval: "300s"

    mail-check-notices-missing:
      display_name: "URGENT mail check: no notices email arrived in 2 h 15 min"
      tier: p1
      urgent: true
      subject: "mail check: no notices email arrived in 2 h 15 min"
      documentation: >-
        The hourly mail check on the notices lane has not reached its inbox for
        2 h 15 min: two checks in a row. That lane is records' outbox and
        connectors' email to SendGrid, the path reminders and coverage notices
        take, so treat those as not going out until shown otherwise. First tell
        never sent from sent and never arrived: in the member-data project's
        logs, look for records' mail_check_queued line of the notices lane in
        the last three hours (records writes one each hour). None: the check
        was never sent. Read the job (missed run (tpa-jobs-mail-check),
        jobs-failed) and records' mail_check_skipped line and its reason
        (not_configured: records has no address). Some: it was sent and never
        arrived. Read, in order, connectors (connectors-email-held,
        connectors-stalled, its dead letters) for its SendGrid call, records'
        vendor_event_stored lines of kind mail_check (a bounce, drop or
        deferral is SendGrid's answer), then the inbox project's
        mail_check_refused counter by reason (a dkim reason means the email
        arrived and failed its signature check: read SendGrid's domain
        authentication). This policy waits for the lane's first arrival, and
        closes by itself after seven days with none, which is not a recovery
        (docs/infra/mail-check.md).
      conditions:
        - name: "no notices check in 2 h 15 min, ten minutes running"
          promql:
            query: >-
              absent_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="notices"}[135m])
              and on() absent_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="notices"}[135m] offset 600s)
              and on() count_over_time(logging_googleapis_com:user_mail_check_arrived{monitored_resource="gae_app", lane="notices"}[7d])
            duration: "0s"
            evaluation_interval: "300s"

# D-400 (beta's mailcheck.tf): what SendGrid reported back about every email,
# read off records' one line per stored event (hooks-relay -> tpa-api -> records'
# vendor_events): the kind of email it matched (opening, notice, auth_message,
# mail_check or unmatched) as `lane`, SendGrid's event (delivered, bounce,
# dropped, deferred, spamreport, open, processed or other) as `outcome`, and
# nothing else of the event. In the member-data project, which receives
# records' logs; the counter from the mail check's inbox stage (the monitoring
# website charts it), the policy at its alerting stage and only while signed
# reports reach records (hooks.tf).
email_delivery:
  log_metrics:
    records_vendor_events:
      description: >-
        One per SendGrid event records stored, by the kind of email it matched
        (lane) and SendGrid's event (outcome). Never an address, a row or the
        event's own fields.
      filter: |
        resource.type="cloud_run_revision"
        AND resource.labels.service_name="records"
        AND jsonPayload.service="records"
        AND jsonPayload.message="vendor_event_stored"
      labels:
        lane: 'EXTRACT(jsonPayload.kind)'
        outcome: 'EXTRACT(jsonPayload.event)'

  alert_policies:
    email-delivery-failed:
      display_name: "emails bounced, dropped or reported as spam"
      tier: p2
      subject: "email ${metric_or_resource.label.outcome} reported by SendGrid"
      documentation: >-
        SendGrid reported a real email (an opening email, a notice or a sign-in
        message; the mail check's own are left out) as bounced, dropped or
        reported as spam in the last hour. A bounce is an address that does not
        take mail; a drop is SendGrid refusing to send, most often an address
        on its suppression list after an earlier bounce; a spam report is a
        person marking it so. Which emails and to whom is the ops portal's
        delivery state (opening emails) and SendGrid's own activity feed, never
        this alert. A run of drops can mean SendGrid suppressed a real address:
        read its suppression list. The counter's lane says which kind of email.
      conditions:
        - name: "a bounce, drop or spam report on a real email this hour"
          threshold:
            filter: >-
              metric.type = "logging.googleapis.com/user/records_vendor_events" AND resource.type = "cloud_run_revision"
              AND metric.labels.outcome = one_of("bounce", "dropped", "spamreport")
              AND metric.labels.lane = one_of("opening", "notice", "auth_message", "unmatched")
            threshold_value: 0
            alignment_period: "3600s"
            group_by_fields: ["metric.label.outcome"]
