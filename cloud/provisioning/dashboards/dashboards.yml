# Dashboards are baked into the image from cloud/dashboards/ and cannot be changed in the UI. At start,
# render-dashboards.sh writes them here with this environment's project ids filled in (Grafana drops a Cloud
# Monitoring query that names no project), then starts Grafana.
apiVersion: 1

providers:
  - name: trellis-watchtower
    orgId: 1
    folder: trellis-watchtower
    type: file
    disableDeletion: false
    editable: false
    allowUiUpdates: false
    updateIntervalSeconds: 300
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
