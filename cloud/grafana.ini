# trellis-watchtower, production Grafana (cloud/). Stateless: dashboards and datasources are provisioned from files
# baked into the image, and production alerting lives in Cloud Monitoring alert policies, not here.
#
# Environment the Cloud Run service must set (none of them is a secret):
#   WATCH_HOST          the public host, e.g. watch.<domain>
#   IAP_AUDIENCE        /projects/<project number>/global/backendServices/<bes-watch id> (tpa-platform outputs.tf)
#   TPA_APP_PROJECT_ID, TPA_CRM_PROJECT_ID, TPA_PHI_PROJECT_ID   (provisioning/datasources)

[paths]
data = /var/lib/grafana
provisioning = /etc/grafana/provisioning

[server]
protocol = http
; Cloud Run's default container port.
http_port = 8080
domain = $__env{WATCH_HOST}
root_url = https://%(domain)s/
enforce_domain = false
enable_gzip = true
router_logging = false

[database]
; sqlite on the container's own disk, and disposable by design: no Grafana alerting, dashboards and datasources come
; from files, and users are re-created from the IAP assertion on their next request. Losing it loses nothing.
type = sqlite3

; ---- Sign-in: IAP only ---------------------------------------------------------------------------------------------
; IAP authenticates the person (grp-platform only) and forwards a signed assertion. Grafana verifies it against
; Google's IAP keys and checks the audience (this backend) and the issuer, then signs the person in by email.
[auth.jwt]
enabled = true
header_name = X-Goog-Iap-Jwt-Assertion
jwk_set_url = https://www.gstatic.com/iap/verify/public_key-jwk
cache_ttl = 60m
expect_claims = {"aud": "$__env{IAP_AUDIENCE}", "iss": "https://cloud.google.com/iap"}
email_claim = email
username_claim = email
auto_sign_up = true
url_login = false
allow_assign_grafana_admin = false
; Everyone is a Viewer: the role is not read from the assertion, new users get auto_assign_org_role below.
skip_org_role_sync = true

[auth]
disable_login_form = true
; IAP owns the session; Grafana has none to end.
disable_signout_menu = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false

[security]
; No admin user exists. Nobody can change anything in the UI; changes are commits to this repository.
disable_initial_admin_creation = true
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
strict_transport_security = true
content_security_policy = true
allow_embedding = false
; secret_key is left at its default on purpose: it only encrypts stored secrets, and this image stores none
; (no secureJsonData, no API keys or service accounts, and the sqlite state is disposable).

; ---- Off: alerting, sharing, plugins, phoning home ------------------------------------------------------------------
[unified_alerting]
enabled = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[plugins]
plugin_admin_enabled = false
; Grafana 12 would otherwise download a set of app plugins at start-up, and fetch plugin-signing keys from
; grafana.com. Neither is needed with core plugins only; the image makes no call to grafana.com.
preinstall_disabled = true
public_key_retrieval_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[metrics]
enabled = false

[log]
mode = console
level = info

[log.console]
format = json
