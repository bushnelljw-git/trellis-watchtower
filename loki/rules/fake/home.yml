# Generated by scripts/gen_home.py: edit that, not this file.
# Loki's ruler evaluates these every 30 s and writes the results to Prometheus (loki/loki-config.yml,
# ruler.remote_write), where the home page and prometheus/rules/home.yml read them. Linted like the
# dashboards' queries (scripts/dashboard_lint.py): metric queries only, listed labels only.
groups:
  - name: home
    interval: 30s
    rules:
      - record: tw:loki_rules:heartbeat
        expr: "sum(count_over_time({stack=~\".+\", stack!=\"fixture\"} [30s] offset 15s)) or vector(0)"
      - record: tw:loki_lines:sum30s
        expr: "sum by (stack, service) (count_over_time({stack=~\".+\", stack!=\"fixture\"} [30s] offset 15s))"
      - record: tw:error_lines:sum30s
        expr: "sum(count_over_time({stack=~\".+\", stack!=\"fixture\"} | level=\"ERROR\" [30s] offset 15s)) or vector(0)"
      - record: tw:worker_ok_ms:max
        expr: "max(max_over_time({stack=\"tpa\", service=\"connectors\"} | level=\"INFO\" | outcome=\"pass\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [120s]))"
        labels:
          service: "connectors"
      - record: tw:worker_errors:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"connectors\"} | level=\"ERROR\" [30s] offset 15s)) or vector(0)"
        labels:
          service: "connectors"
      - record: tw:worker_error_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"connectors\"} | level=\"ERROR\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
        labels:
          service: "connectors"
      - record: tw:worker_ok_ms:max
        expr: "max(max_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `\"tenants_total\"` | job=\"crm_transitions\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [180s]))"
        labels:
          service: "crm_transitions"
      - record: tw:worker_errors:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} | level=\"ERROR\" | operation=\"crm_transitions\" or job=\"crm_transitions\" [30s] offset 15s)) or vector(0)"
        labels:
          service: "crm_transitions"
      - record: tw:worker_error_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} | level=\"ERROR\" | operation=\"crm_transitions\" or job=\"crm_transitions\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
        labels:
          service: "crm_transitions"
      - record: tw:worker_ok_ms:max
        expr: "max(max_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `\"tenants_total\"` | job=\"outbox_dispatch\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [180s]))"
        labels:
          service: "outbox_dispatch"
      - record: tw:worker_errors:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} | level=\"ERROR\" | operation=\"outbox_dispatch\" or job=\"outbox_dispatch\" [30s] offset 15s)) or vector(0)"
        labels:
          service: "outbox_dispatch"
      - record: tw:worker_error_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} | level=\"ERROR\" | operation=\"outbox_dispatch\" or job=\"outbox_dispatch\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
        labels:
          service: "outbox_dispatch"
      - record: tw:worker_ok_ms:max
        expr: "max(max_over_time({stack=\"tpa\", service=\"auth-publisher\"} |= \"publisher: \" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [150s]))"
        labels:
          service: "auth-publisher"
      - record: tw:worker_errors:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"auth-publisher\"} | level=\"ERROR\" [30s] offset 15s)) or vector(0)"
        labels:
          service: "auth-publisher"
      - record: tw:worker_error_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"auth-publisher\"} | level=\"ERROR\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
        labels:
          service: "auth-publisher"
      - record: tw:worker_ok_ms:max
        expr: "max(max_over_time({stack=\"tpa\", service=\"auth-sweeper\"} | level=\"INFO\" | outcome=\"ok\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [900s]))"
        labels:
          service: "auth-sweeper"
      - record: tw:worker_errors:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"auth-sweeper\"} | level=\"ERROR\" [30s] offset 15s)) or vector(0)"
        labels:
          service: "auth-sweeper"
      - record: tw:worker_error_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"auth-sweeper\"} | level=\"ERROR\" | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
        labels:
          service: "auth-sweeper"
      - record: tw:drain_raised:sum30s
        expr: "sum(count_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `a drain tick raised` [30s] offset 15s)) or vector(0)"
      - record: tw:drain_raised_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `a drain tick raised` | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
      - record: tw:drain_tenants_not_ok:sum30s
        expr: "sum(sum_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `\"tenants_total\"` | json f=\"tenants_failed\", p=\"tenants_partial\", k=\"tenants_skipped\" | __error__=\"\" | label_format n=`{{ add .f .p .k }}` | unwrap n [30s] offset 15s)) or vector(0)"
      - record: tw:drain_tenants_not_ok_ms:min
        expr: "min(min_over_time({stack=\"tpa\", service=\"tpa-jobs-drains\"} |= `\"tenants_total\"` | json f=\"tenants_failed\", p=\"tenants_partial\", k=\"tenants_skipped\" | __error__=\"\" | label_format n=`{{ add .f .p .k }}` | n > 0 | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
      - record: tw:auth_not_ready:sum30s
        expr: "sum by (reason_code) (count_over_time({stack=\"tpa\", service=\"auth\"} |~ `\"msg\": ?\"not_ready\"` | json rc=\"reason\" | label_format reason_code=`{{ if eq (regexReplaceAll \"^[A-Za-z][A-Za-z_]{0,39}$\" .rc \"\") \"\" }}{{ .rc }}{{ else }}other{{ end }}` [30s] offset 15s))"
      - record: tw:auth_not_ready_ms:min
        expr: "min by (reason_code) (min_over_time({stack=\"tpa\", service=\"auth\"} |~ `\"msg\": ?\"not_ready\"` | json rc=\"reason\" | label_format reason_code=`{{ if eq (regexReplaceAll \"^[A-Za-z][A-Za-z_]{0,39}$\" .rc \"\") \"\" }}{{ .rc }}{{ else }}other{{ end }}` | label_format ts=`{{ unixEpochMillis __timestamp__ }}` | unwrap ts [1m]))"
      - record: tw:velocity_lines:count10m
        expr: "sum by (code, decision) (count_over_time({stack=\"tpa\", service=\"records\"} |= `\"message\":\"velocity\"` | json code, decision | code=~\"velocity_(flag|hold|freeze)\" [10m]))"
