# Loki 3.x, single binary, local filesystem. Published on 127.0.0.1:4392 only
# (compose.yml); inside tw-net it listens on :3100 for Alloy and Grafana.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Structured metadata carries the error-group fields (docs/SPEC.md
  # "Loki structured metadata"). Alloy sets it; Loki must not add its own:
  # no auto `service_name` stream label, no auto `detected_level` field.
  allow_structured_metadata: true
  discover_service_name: []
  discover_log_levels: false
  # No automatic `__stream_shard__` label either (it appears under a burst,
  # e.g. Alloy's first read of a container's history).
  shard_streams:
    enabled: false
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

# Cache the parts of a metric query that lie in the past. The home page asks a 7-day question every 30 s (new error
# groups: seen in the last 24 h, absent the 6 days before); split by the hour and cached, a refresh re-reads only the
# newest hour instead of the whole week.
query_range:
  cache_results: true
  cache_instant_metric_results: true
  instant_metric_query_split_align: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# The home page's log-derived numbers (worker ages, error and restart counts, auth's not-ready lines) are recorded
# here every 30 s and written to Prometheus, so a page refresh reads a few series instead of hours of lines. The rules
# are generated with the home page (scripts/gen_home.py writes loki/rules/fake/home.yml; "fake" is the tenant Loki
# uses when auth is off) and linted like its queries (scripts/dashboard_lint.py).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/ruler-scratch
  evaluation_interval: 30s
  enable_api: true
  ring:
    kvstore:
      store: inmemory
  wal:
    dir: /loki/ruler-wal
  remote_write:
    enabled: true
    clients:
      prometheus:
        url: http://tw-prometheus:9090/api/v1/write

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
