# Loki 3.x, single binary, local filesystem. Published on 127.0.0.1:4392 only
# (compose.yml); inside tw-net it listens on :3100 for Alloy and Grafana.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Structured metadata carries the error-group fields (docs/SPEC.md
  # "Loki structured metadata"). Alloy sets it; Loki must not add its own:
  # no auto `service_name` stream label, no auto `detected_level` field.
  allow_structured_metadata: true
  discover_service_name: []
  discover_log_levels: false
  # No automatic `__stream_shard__` label either (it appears under a burst,
  # e.g. Alloy's first read of a container's history).
  shard_streams:
    enabled: false
  volume_enabled: true
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
